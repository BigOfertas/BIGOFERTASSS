# As funcoes R2 validam o JWT do usuario e o papel owner dentro do proprio handler.
# O verify_jwt da plataforma fica desligado para evitar 401 com as novas chaves publicaveis.
[functions.r2-image-presign]
verify_jwt = false

[functions.r2-image-complete]
verify_jwt = false

[functions.site-asset-presign]
verify_jwt = false

[functions.site-asset-complete]
verify_jwt = false

# Cotacao publica de frete. O token da SuperFrete fica somente nos secrets do Supabase.
[functions.shipping-quote]
verify_jwt = false

# Checkout valida a sessao do cliente dentro da propria funcao.
[functions.checkout-start]
verify_jwt = false

# Webhook publico chamado diretamente pela InfinitePay.
[functions.infinitepay-webhook]
verify_jwt = false

# Processador interno. O proprio codigo exige o service role exato.
[functions.notifications-process]
verify_jwt = false

# Acionador autenticado da fila; valida o bearer dentro da propria funcao.
[functions.notifications-kick]
verify_jwt = false

# Login e 2FA: a funcao aceita login publico e valida bearer internamente nas acoes autenticadas.
[functions.auth-email-2fa]
verify_jwt = false
