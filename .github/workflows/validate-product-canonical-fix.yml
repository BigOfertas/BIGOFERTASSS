name: Validate Product Canonical Fix

on:
  push:
    branches:
      - fix-product-canonical-duplicate-20260914

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix-product-canonical-duplicate-20260914

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bunx prettier --check src/components/product/ProductSeo.tsx

      - name: Validate WhatsApp and sharing contract
        run: node scripts/validate-whatsapp-sharing.mjs

      - name: Lint
        run: bun run lint

      - name: Project TypeScript and build validation
        run: bun run build

      - name: Hostinger production build
        run: bun run build:hostinger
