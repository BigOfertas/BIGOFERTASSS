name: QA Stage 1 Variants Production Final

on:
  push:
    branches:
      - qa-stage1-variants-prod-final-20260914

permissions:
  contents: read

jobs:
  qa-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v7
        with:
          ref: qa-stage1-variants-prod-final-20260914

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run final production browser QA
        run: node scripts/run-qa-stage1-production-final.mjs
