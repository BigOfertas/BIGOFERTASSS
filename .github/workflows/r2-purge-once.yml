name: One-time R2 Purge

on:
  push:
    branches:
      - r2-catalog-bridge-20260909
    paths:
      - ".github/r2-purge-trigger"

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Install AWS CLI
        run: |
          set -euo pipefail
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp/awscliv2
          sudo /tmp/awscliv2/aws/install --update

      - name: Purge bucket contents and verify
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(aws s3api list-objects-v2 --endpoint-url "$R2_ENDPOINT" --bucket "$R2_BUCKET" --query 'length(Contents)' --output text)
          [[ "$BEFORE" == "None" ]] && BEFORE=0
          echo "R2_OBJECTS_BEFORE=$BEFORE"
          while true; do
            aws s3api list-objects-v2 --endpoint-url "$R2_ENDPOINT" --bucket "$R2_BUCKET" --max-keys 1000 --output json > /tmp/r2-list.json
            COUNT=$(python3 - <<'PY'
import json
with open('/tmp/r2-list.json', 'r', encoding='utf-8') as f:
    data=json.load(f)
print(len(data.get('Contents') or []))
PY
)
            [[ "$COUNT" == "0" ]] && break
            python3 - <<'PY' > /tmp/r2-delete.json
import json
with open('/tmp/r2-list.json', 'r', encoding='utf-8') as f:
    data=json.load(f)
print(json.dumps({'Objects':[{'Key':x['Key']} for x in (data.get('Contents') or [])], 'Quiet': True}))
PY
            aws s3api delete-objects --endpoint-url "$R2_ENDPOINT" --bucket "$R2_BUCKET" --delete file:///tmp/r2-delete.json >/dev/null
          done
          AFTER=$(aws s3api list-objects-v2 --endpoint-url "$R2_ENDPOINT" --bucket "$R2_BUCKET" --query 'length(Contents)' --output text)
          [[ "$AFTER" == "None" ]] && AFTER=0
          echo "R2_OBJECTS_AFTER=$AFTER"
          [[ "$AFTER" == "0" ]]
          echo "R2_PURGE_OK"
