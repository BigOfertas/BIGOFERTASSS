name: Retro Public Production Verify Once

on:
  push:
    branches: [main]
    paths:
      - 'catalog-jobs/retro-public-verify-once.json'
      - '.github/workflows/retro-public-verify-once.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Download definitive Retro production evidence
        uses: actions/download-artifact@v4
        with:
          name: retro-production-retro-pdf-page6-20260910-004
          path: .artifacts/retro-production
          github-token: ${{ github.token }}
          repository: BigOfertas/BIGOFERTASSS
          run-id: 34431687880

      - name: Locate verification evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          echo 'Downloaded evidence files:'
          find .artifacts/retro-production -maxdepth 4 -type f -print | sort
          verification='.artifacts/retro-production/batch-verification.json'
          test -s "$verification"
          echo "verification=$verification" >> "$GITHUB_OUTPUT"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@latest
          npx playwright install --with-deps chromium

      - name: Public HTTP reachability
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsSL --connect-timeout 15 --max-time 60 --retry 1 --retry-delay 2 https://bigofertas.net/ -o /tmp/bigofertas-home.html; then
              test -s /tmp/bigofertas-home.html
              echo "PUBLIC_HTTP_OK bytes=$(wc -c </tmp/bigofertas-home.html) attempt=$attempt"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo 'PUBLIC_HTTP_FAILED' >&2
          exit 1

      - name: Verify definitive Retro catalog in public storefront
        env:
          VERIFICATION_FILE: ${{ steps.evidence.outputs.verification }}
        run: |
          node scripts/catalog-batch-public-verify.mjs \
            --verification "$VERIFICATION_FILE" \
            --base-url https://bigofertas.net \
            --launch-count 10

      - name: Publish green public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retro-public-verification-${{ github.run_id }}
          path: |
            .artifacts/retro-production/**
            /tmp/bigofertas-home.html
          if-no-files-found: warn
          retention-days: 30
