name: R2 Catalog Bridge

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operacao: listar, analisar, importar ou limpar o bucket"
        required: true
        default: "list"
        type: choice
        options:
          - list
          - analyze
          - import
          - purge
      object_key:
        description: "Chave do ZIP no R2, ex.: incoming/catalogo/ARQUIVO.zip"
        required: false
        type: string
      competition:
        description: "Competicao/campeonato opcional, ex.: MUNDO FIFA"
        required: false
        type: string
      league:
        description: "Liga opcional"
        required: false
        type: string
      default_price:
        description: "Preco padrao opcional"
        required: false
        type: string
      default_stock:
        description: "Estoque padrao opcional"
        required: false
        type: string
      image_concurrency:
        description: "Uploads simultaneos por produto (1-8)"
        required: false
        default: "4"
        type: string
      activate:
        description: "Ativar produtos depois da importacao"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: r2-catalog-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bridge:
    name: R2 catalog bridge
    runs-on: ubuntu-latest
    environment: production
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CATALOG_IMPORT_OWNER_ACCESS_TOKEN: ${{ secrets.CATALOG_IMPORT_OWNER_ACCESS_TOKEN }}
      CATALOG_IMPORT_OWNER_EMAIL: ${{ secrets.CATALOG_IMPORT_OWNER_EMAIL }}
      CATALOG_IMPORT_OWNER_PASSWORD: ${{ secrets.CATALOG_IMPORT_OWNER_PASSWORD }}
      R2_BRIDGE_ARTIFACT_DIR: .artifacts/r2-catalog-bridge
      INPUT_ACTION: ${{ inputs.action }}
      INPUT_OBJECT_KEY: ${{ inputs.object_key }}
      INPUT_COMPETITION: ${{ inputs.competition }}
      INPUT_LEAGUE: ${{ inputs.league }}
      INPUT_DEFAULT_PRICE: ${{ inputs.default_price }}
      INPUT_DEFAULT_STOCK: ${{ inputs.default_stock }}
      INPUT_IMAGE_CONCURRENCY: ${{ inputs.image_concurrency }}
      INPUT_ACTIVATE: ${{ inputs.activate }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install R2 and image tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip imagemagick curl
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          rm -rf /tmp/aws /tmp/awscliv2
          unzip -q /tmp/awscliv2.zip -d /tmp/awscliv2
          sudo /tmp/awscliv2/aws/install --update
          aws --version

      - name: Validate bridge code
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/r2-catalog-bridge.mjs
          node --check scripts/r2-purge-bucket.mjs
          npm run validate:catalog-import

      - name: Execute R2 catalog bridge
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$INPUT_ACTION" == "purge" ]]; then
            node scripts/r2-purge-bucket.mjs
            exit 0
          fi

          args=(--action "$INPUT_ACTION")

          if [[ -n "$INPUT_OBJECT_KEY" ]]; then
            args+=(--key "$INPUT_OBJECT_KEY")
          fi
          if [[ -n "$INPUT_COMPETITION" ]]; then
            args+=(--competition "$INPUT_COMPETITION")
          fi
          if [[ -n "$INPUT_LEAGUE" ]]; then
            args+=(--league "$INPUT_LEAGUE")
          fi
          if [[ -n "$INPUT_DEFAULT_PRICE" ]]; then
            args+=(--default-price "$INPUT_DEFAULT_PRICE")
          fi
          if [[ -n "$INPUT_DEFAULT_STOCK" ]]; then
            args+=(--default-stock "$INPUT_DEFAULT_STOCK")
          fi
          if [[ -n "$INPUT_IMAGE_CONCURRENCY" ]]; then
            args+=(--image-concurrency "$INPUT_IMAGE_CONCURRENCY")
          fi
          if [[ "$INPUT_ACTIVATE" == "true" ]]; then
            args+=(--activate)
          fi

          node scripts/r2-catalog-bridge.mjs "${args[@]}"

      - name: Upload bridge reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-catalog-bridge-${{ github.run_id }}
          path: .artifacts/r2-catalog-bridge/
          if-no-files-found: warn
          retention-days: 30
