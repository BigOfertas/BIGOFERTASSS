name: Refine Global Patch Matrix

on:
  push:
    branches:
      - catalog-global-patches-20260909
    paths:
      - catalog-jobs/refine-global-patches.json

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Add verified titleholder badge variants
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/catalog-business-rules.mjs')
          s = p.read_text()
          s = s.replace('  Object.freeze({ code: "copa-mx", label: "Copa do México" }),\n', '')
          s = s.replace(
            '  Object.freeze({ code: "champions-league", label: "Champions League" }),\n',
            '  Object.freeze({ code: "champions-league", label: "Champions League" }),\n'
            '  Object.freeze({ code: "champions-league-titleholder", label: "Champions League — Campeão" }),\n'
          )
          s = s.replace(
            '  Object.freeze({ code: "europa-league", label: "Europa League" }),\n',
            '  Object.freeze({ code: "europa-league", label: "Europa League" }),\n'
            '  Object.freeze({ code: "europa-league-titleholder", label: "Europa League — Campeão" }),\n'
          )
          s = s.replace(
            '  Object.freeze({ code: "conference-league", label: "Conference League" }),\n',
            '  Object.freeze({ code: "conference-league", label: "Conference League" }),\n'
            '  Object.freeze({ code: "conference-league-titleholder", label: "Conference League — Campeão" }),\n'
          )
          s = s.replace(
            '  Object.freeze({ code: "euro", label: "UEFA EURO" }),\n',
            '  Object.freeze({ code: "euro", label: "UEFA EURO" }),\n'
            '  Object.freeze({ code: "euro-titleholder", label: "UEFA EURO — Campeão" }),\n'
          )
          s = s.replace(
            '  Object.freeze({ code: "uefa-nations-league", label: "UEFA Nations League" }),\n',
            '  Object.freeze({ code: "uefa-nations-league", label: "UEFA Nations League" }),\n'
            '  Object.freeze({ code: "nations-league-titleholder", label: "UEFA Nations League — Campeão" }),\n'
          )
          s = s.replace(
            '  Object.freeze({ code: "copa-america", label: "Copa América" }),\n',
            '  Object.freeze({ code: "copa-america", label: "Copa América" }),\n'
            '  Object.freeze({ code: "copa-america-titleholder", label: "Copa América — Campeão" }),\n'
          )
          s = s.replace(
            '  if (national.key === "ESPANHA" && currentSeason2627(source))\n    addPatch(codes, "fifa-world-champions");\n',
            '  if (national.key === "ESPANHA" && currentSeason2627(source)) {\n'
            '    addPatch(codes, "fifa-world-champions");\n'
            '    addPatch(codes, "euro-titleholder");\n'
            '  }\n'
            '  if (national.key === "PORTUGAL" && currentSeason2627(source))\n'
            '    addPatch(codes, "nations-league-titleholder");\n'
            '  if (national.key === "ARGENTINA" && currentSeason2627(source))\n'
            '    addPatch(codes, "copa-america-titleholder");\n'
          )
          s = s.replace(
            '  const uefaPatch = inferUefa2627Patch(source);\n  if (uefaPatch) addPatch(codes, uefaPatch);\n  return codes;\n',
            '  const uefaPatch = inferUefa2627Patch(source);\n'
            '  if (uefaPatch) addPatch(codes, uefaPatch);\n'
            '  if (currentSeason2627(source) && anyAlias(source, ["PSG", "PARIS SAINT GERMAIN"]))\n'
            '    addPatch(codes, "champions-league-titleholder");\n'
            '  if (currentSeason2627(source) && aliasInSource(source, "ASTON VILLA"))\n'
            '    addPatch(codes, "europa-league-titleholder");\n'
            '  if (currentSeason2627(source) && aliasInSource(source, "CRYSTAL PALACE"))\n'
            '    addPatch(codes, "conference-league-titleholder");\n'
            '  return codes;\n'
          )
          p.write_text(s)

          p = Path('supabase/migrations/20260909143000_global_patch_matrix.sql')
          s = p.read_text()
          s = s.replace(
            '    {"code":"champions-league","label":"Champions League"},\n',
            '    {"code":"champions-league","label":"Champions League"},\n'
            '    {"code":"champions-league-titleholder","label":"Champions League — Campeão"},\n'
          )
          s = s.replace(
            '    {"code":"europa-league","label":"Europa League"},\n',
            '    {"code":"europa-league","label":"Europa League"},\n'
            '    {"code":"europa-league-titleholder","label":"Europa League — Campeão"},\n'
          )
          s = s.replace(
            '    {"code":"conference-league","label":"Conference League"},\n',
            '    {"code":"conference-league","label":"Conference League"},\n'
            '    {"code":"conference-league-titleholder","label":"Conference League — Campeão"},\n'
          )
          s = s.replace(
            '    {"code":"euro","label":"UEFA EURO"},\n',
            '    {"code":"euro","label":"UEFA EURO"},\n'
            '    {"code":"euro-titleholder","label":"UEFA EURO — Campeão"},\n'
          )
          s = s.replace(
            '    {"code":"uefa-nations-league","label":"UEFA Nations League"},\n',
            '    {"code":"uefa-nations-league","label":"UEFA Nations League"},\n'
            '    {"code":"nations-league-titleholder","label":"UEFA Nations League — Campeão"},\n'
          )
          s = s.replace(
            '    {"code":"copa-america","label":"Copa América"},\n',
            '    {"code":"copa-america","label":"Copa América"},\n'
            '    {"code":"copa-america-titleholder","label":"Copa América — Campeão"},\n'
          )
          p.write_text(s)

          p = Path('scripts/validate-catalog-business-rules.mjs')
          s = p.read_text()
          s = s.replace(
            '["fifa-world-cup-2026", "fifa-world-champions", "euro", "uefa-nations-league"],',
            '["fifa-world-cup-2026", "fifa-world-champions", "euro", "euro-titleholder", "uefa-nations-league"],'
          )
          s = s.replace(
            'assert.ok(PATCH_CATALOG.length >= 45, "global patch catalog unexpectedly small");',
            'assert.ok(PATCH_CATALOG.length >= 50, "global patch catalog unexpectedly small");'
          )
          s = s.replace(
            'const barcelona = patchCodes',
            'const psg = patchCodes({ name: "CAMISA I PSG 26/27 NIKE", league: "Ligue 1" });\n'
            'hasAll(psg, ["ligue-1", "champions-league", "champions-league-titleholder"], "PSG");\n\n'
            'const astonVilla = patchCodes({ name: "CAMISA I ASTON VILLA 26/27 ADIDAS", league: "Premier League" });\n'
            'hasAll(astonVilla, ["premier-league", "champions-league", "europa-league-titleholder"], "Aston Villa");\n\n'
            'const crystalPalace = patchCodes({ name: "CAMISA I CRYSTAL PALACE 26/27 MACRON", league: "Premier League" });\n'
            'hasAll(crystalPalace, ["premier-league", "europa-league", "conference-league-titleholder"], "Crystal Palace");\n\n'
            'const barcelona = patchCodes'
          )
          s = s.replace(
            'for (const [product, expected, forbidden] of nationalCases) {',
            'hasAll(patchCodes({ name: "CAMISA I PORTUGAL 26/27 PUMA", selecao: "Portugal" }), ["nations-league-titleholder"], "Portugal");\n'
            'hasAll(patchCodes({ name: "CAMISA I ARGENTINA 26/27 ADIDAS", selecao: "Argentina" }), ["copa-america-titleholder"], "Argentina");\n\n'
            'for (const [product, expected, forbidden] of nationalCases) {'
          )
          p.write_text(s)
          PY

      - name: Format refined files
        run: bunx prettier --write scripts/catalog-business-rules.mjs scripts/validate-catalog-business-rules.mjs

      - name: Commit refinement
        run: |
          git config user.name "BigOfertas Automation"
          git config user.email "contato@bigofertas.net"
          git add scripts/catalog-business-rules.mjs scripts/validate-catalog-business-rules.mjs supabase/migrations/20260909143000_global_patch_matrix.sql
          git commit -m "feat: add verified titleholder patch variants"
          git push origin HEAD:catalog-global-patches-20260909
