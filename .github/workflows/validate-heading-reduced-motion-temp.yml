name: Validate Heading Reduced Motion Temp

on:
  push:
    branches:
      - fix-heading-reduced-motion-20260913
    paths:
      - ".github/workflows/validate-heading-reduced-motion-temp.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-heading-reduced-motion-20260913
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Check formatting
        run: bunx prettier --check src/components/ui/slide-up-reveal.tsx
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Validate storefront regressions
        run: node scripts/validate-storefront-regressions.mjs && node scripts/validate-final-storefront-refinements.mjs
