name: Temporary Stage 3 Final Check

on:
  push:
    branches:
      - stage3-dropbox-rebrand-20260911
    paths:
      - ".github/workflows/temporary-stage3-final-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage 3 branch
        uses: actions/checkout@v7
        with:
          ref: stage3-dropbox-rebrand-20260911

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Stage 3 and previous storefront phases
        run: node scripts/validate-brand-identity.mjs && node scripts/validate-stage3-rebrand.mjs && node scripts/validate-stage1-ux.mjs && node scripts/validate-stage2-commerce.mjs

      - name: Audit public legacy wordmark references
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git grep -nE 'BIGofertas|BigOfertas|BIGOFERTAS' -- src public .env supabase/functions 2>/dev/null || true)"
          echo "$matches"
          unexpected="$(printf '%s\n' "$matches" | grep -vE 'src/lib/(cart|products)\.ts:.*Camisa Profissional BIGofertas 2024' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected legacy public brand references remain:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          echo "STAGE3_LEGACY_WORDMARK_AUDIT_OK"

      - name: Lint storefront
        run: bun run lint

      - name: Validate production build
        run: bun run build

      - name: Build Hostinger artifact
        run: bun run build:hostinger

      - name: Verify Hostinger shell and favicon
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT=""
          for candidate in .output/public dist/client dist/public dist; do
            if [ -f "$candidate/index.html" ]; then
              OUTPUT="$candidate"
              break
            fi
          done
          test -n "$OUTPUT"
          grep -F -q "DropBox" "$OUTPUT/index.html"
          grep -F -q "/favicon.svg" "$OUTPUT/index.html"
          test -f "$OUTPUT/favicon.svg"
          if grep -E -q "BIGofertas|BigOfertas|BIGOFERTAS" "$OUTPUT/index.html"; then
            echo "Legacy wordmark found in Hostinger shell." >&2
            exit 1
          fi
          echo "STAGE3_HOSTINGER_BRAND_OK"
