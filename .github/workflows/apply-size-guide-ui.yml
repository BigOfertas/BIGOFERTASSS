name: Apply Size Guide UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-size-guide-ui
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply size guide integration
        shell: python
        run: |
          from pathlib import Path

          purchase = Path("src/components/product/ProductPurchaseOptions.tsx")
          text = purchase.read_text()
          old_dialog = '''import {
            Dialog,
            DialogContent,
            DialogDescription,
            DialogHeader,
            DialogTitle,
            DialogTrigger,
          } from "@/components/ui/dialog";
          '''
          if old_dialog in text:
              text = text.replace(old_dialog, 'import { SizeGuideDialog } from "@/components/product/SizeGuideDialog";\n')
          old_guide_start = text.find('function SizeGuide({ sizes }: { sizes: string[] }) {')
          if old_guide_start != -1:
              old_guide_end = text.find('\n}\n\nexport function ProductPurchaseOptions', old_guide_start)
              if old_guide_end == -1:
                  raise SystemExit("Could not find end of legacy SizeGuide")
              text = text[:old_guide_start] + text[old_guide_end + 3:]
          text = text.replace('<SizeGuide sizes={config.sizes} />', '<SizeGuideDialog commercialType={config.commercialType} />')
          purchase.write_text(text)

          quick = Path("src/components/product/ProductQuickAdd.tsx")
          text = quick.read_text()
          import_anchor = 'import { Link } from "@tanstack/react-router";\n\n'
          if 'SizeGuideDialog' not in text:
              text = text.replace(import_anchor, import_anchor + 'import { SizeGuideDialog } from "@/components/product/SizeGuideDialog";\n')
          legend = '<legend className="mb-2 text-xs font-bold text-gray-700">Escolha o tamanho</legend>'
          replacement = '''<legend className="text-xs font-bold text-gray-700">Escolha o tamanho</legend>
              <div className="mb-2 mt-1 flex justify-end">
                <SizeGuideDialog commercialType={config.commercialType} compact />
              </div>'''
          text = text.replace(legend, replacement)
          quick.write_text(text)

          cart = Path("src/routes/cart.tsx")
          text = cart.read_text()
          cart_anchor = 'import { ShippingCalculator } from "@/components/cart/ShippingCalculator";\n'
          if 'SizeGuideDialog' not in text:
              text = text.replace(cart_anchor, cart_anchor + 'import { SizeGuideDialog } from "@/components/product/SizeGuideDialog";\n')
          editable_line = '                    const editable = item.status === "available";\n'
          if 'const hasSizeSelection' not in text:
              text = text.replace(
                  editable_line,
                  editable_line + '                    const hasSizeSelection = item.selectedOptions.some(\n                      (option) =>\n                        option.optionKind === "size" ||\n                        option.optionName.toLocaleLowerCase("pt-BR").includes("tamanho"),\n                    );\n',
              )
          price_block = '''                                <p className="mt-1.5 text-sm font-black text-red-600 sm:mt-2 sm:text-base">
                                  {currency.format(item.unitPrice)}
                                </p>
'''
          guide_block = price_block + '''
                                {hasSizeSelection ? (
                                  <div className="mt-1.5">
                                    <SizeGuideDialog
                                      productId={item.productId}
                                      triggerLabel="Conferir medidas"
                                      compact
                                    />
                                  </div>
                                ) : null}
'''
          if 'triggerLabel="Conferir medidas"' not in text:
              text = text.replace(price_block, guide_block)
          cart.write_text(text)

      - name: Format changed files
        run: npx prettier --write src/components/product/SizeGuideDialog.tsx src/components/product/ProductPurchaseOptions.tsx src/components/product/ProductQuickAdd.tsx src/routes/cart.tsx

      - name: Validate changed files
        run: |
          npm install --ignore-scripts
          npm run lint
          npm run build

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "SIZE_GUIDE_UI_ALREADY_APPLIED"
            exit 0
          fi
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add src/components/product/SizeGuideDialog.tsx src/components/product/ProductPurchaseOptions.tsx src/components/product/ProductQuickAdd.tsx src/routes/cart.tsx
          git commit -m "feat: integrate smart size guides"
          git push origin main
