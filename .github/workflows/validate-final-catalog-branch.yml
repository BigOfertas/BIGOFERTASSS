name: Validate Final Catalog Branch

on:
  push:
    branches:
      - catalog-final-pipeline-20260909-prod
    paths:
      - catalog-jobs/validate-final-catalog-branch.json

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: catalog-final-pipeline-20260909-prod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate catalog business rules
        run: node scripts/validate-catalog-business-rules.mjs

      - name: Validate Google Photos final pipeline
        run: node scripts/validate-google-photos-final-pipeline.mjs

      - name: Validate storefront media
        run: node scripts/validate-storefront-media-stage3.mjs

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
