name: Test Catalog Foundation Stage 1

on:
  push:
    branches:
      - catalog-foundation-stage-1-20260908
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-catalog-foundation-stage-1
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate catalog foundation requirements
        run: node scripts/validate-catalog-foundation-stage1.mjs

      - name: Validate storefront requirements
        run: node scripts/validate-storefront-upgrades.mjs

      - name: Validate pricing
        run: bun run validate:pricing

      - name: Validate affiliate regressions
        run: bun run validate:affiliate

      - name: Validate affiliate self-service lifecycle
        run: node scripts/validate-affiliate-self-service.mjs

      - name: Validate phase 10 and admin regressions
        run: bun run validate:phase10

      - name: Lint
        run: bun run lint

      - name: Build application
        run: bun run build

      - name: Build Hostinger artifact without publishing
        run: bun run build:hostinger
