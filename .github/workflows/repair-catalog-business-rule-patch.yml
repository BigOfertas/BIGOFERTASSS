name: Repair Catalog Business Rule Patch

on:
  push:
    branches:
      - catalog-business-rules-20260909
    paths:
      - catalog-repairs/**

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rename legacy local classifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/catalog-import-zip.mjs')
          text = path.read_text(encoding='utf-8')
          old = 'function inferCommercialType(product) {'
          new = 'function inferLegacyCommercialType(product) {'
          if old not in text:
              raise SystemExit('legacy classifier declaration not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check scripts/catalog-import-zip.mjs

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "BigOfertas Automation"
          git config user.email "contato@bigofertas.net"
          git add scripts/catalog-import-zip.mjs
          git commit -m "chore: prepare importer for catalog business rules"
          git push origin HEAD:${GITHUB_REF_NAME}
