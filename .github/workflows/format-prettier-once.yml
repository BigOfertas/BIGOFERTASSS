name: Format Current Prettier Violations Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-prettier-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format only files currently failing Prettier
        run: >-
          bunx prettier --write
          scripts/catalog-merge-nba-plans.mjs
          scripts/catalog-merge-pdf-remaining-plans.mjs
          scripts/catalog-nba-assimilation-filter.mjs
          scripts/catalog-nba-production-guard.mjs
          scripts/catalog-pdf-remaining-plan.mjs
          scripts/catalog-pdf-remaining-production-guard.mjs
          scripts/catalog-pdf-remaining-scope-filter.mjs
          scripts/catalog-pdf-remaining-verify.mjs
          scripts/catalog-reconcile-existing-products.mjs
          src/components/ui/cursor-follower.tsx

      - name: Commit formatting-only changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git diff --check
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add \
            scripts/catalog-merge-nba-plans.mjs \
            scripts/catalog-merge-pdf-remaining-plans.mjs \
            scripts/catalog-nba-assimilation-filter.mjs \
            scripts/catalog-nba-production-guard.mjs \
            scripts/catalog-pdf-remaining-plan.mjs \
            scripts/catalog-pdf-remaining-production-guard.mjs \
            scripts/catalog-pdf-remaining-scope-filter.mjs \
            scripts/catalog-pdf-remaining-verify.mjs \
            scripts/catalog-reconcile-existing-products.mjs \
            src/components/ui/cursor-follower.tsx
          git commit -m "chore: format catalog scripts and cursor follower"
          git push origin main
