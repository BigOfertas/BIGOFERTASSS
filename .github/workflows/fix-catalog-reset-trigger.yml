name: Fix Catalog Reset Trigger

on:
  push:
    branches:
      - catalog-final-pipeline-20260909-prod
    paths:
      - catalog-jobs/fix-catalog-reset-trigger.json

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: catalog-final-pipeline-20260909-prod
      - name: Apply reset fix
        run: |
          python scripts/fix-catalog-reset-trigger.py
          npx --yes prettier@3.9.6 --write scripts/deploy-storefront-upgrade-migrations.mjs scripts/validate-google-photos-final-pipeline.mjs
          node scripts/validate-google-photos-final-pipeline.mjs
      - name: Commit fix
        run: |
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add scripts/deploy-storefront-upgrade-migrations.mjs scripts/validate-google-photos-final-pipeline.mjs supabase/migrations/20260909152000_google_photos_catalog_import.sql
          git commit -m "fix: reset catalog variants before products"
          git push origin HEAD:catalog-final-pipeline-20260909-prod
