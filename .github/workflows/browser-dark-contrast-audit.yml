name: Browser Dark Contrast Audit

on:
  push:
    branches:
      - browser-dark-contrast-audit-20260915
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-dark-contrast-audit
  cancel-in-progress: true

jobs:
  discover-products:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Install browser audit dependencies
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Discover the real catalog once in Chromium
        run: node scripts/browser-discover-products.mjs

      - name: Upload shared product catalog
        uses: actions/upload-artifact@v4
        with:
          name: browser-dark-product-catalog
          path: browser-audit-discovery/
          if-no-files-found: error
          retention-days: 3

  routes:
    needs: discover-products
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        viewport: [desktop, mobile]
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7

      - name: Download shared product catalog
        uses: actions/download-artifact@v4
        with:
          name: browser-dark-product-catalog
          path: browser-audit-discovery

      - name: Patch audit to reuse shared catalog
        run: node scripts/patch-browser-audit-discovery.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Install browser audit dependencies
        run: npm install --no-save playwright axe-core

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit every route and card state in real Chromium
        env:
          AUDIT_MODE: routes
          AUDIT_VIEWPORT: ${{ matrix.viewport }}
          AUDIT_PRODUCT_LINKS_FILE: browser-audit-discovery/product-links.json
        run: node scripts/browser-dark-contrast-audit.mjs

      - name: Upload route browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-dark-routes-${{ matrix.viewport }}
          path: browser-audit/
          if-no-files-found: error
          retention-days: 3

  products:
    needs: discover-products
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        viewport: [desktop, mobile]
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7

      - name: Download shared product catalog
        uses: actions/download-artifact@v4
        with:
          name: browser-dark-product-catalog
          path: browser-audit-discovery

      - name: Patch audit to reuse shared catalog
        run: node scripts/patch-browser-audit-discovery.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Install browser audit dependencies
        run: npm install --no-save playwright axe-core

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit every product page in real Chromium
        env:
          AUDIT_MODE: products
          AUDIT_VIEWPORT: ${{ matrix.viewport }}
          AUDIT_SHARD_INDEX: ${{ matrix.shard }}
          AUDIT_SHARD_TOTAL: 4
          AUDIT_PRODUCT_LINKS_FILE: browser-audit-discovery/product-links.json
        run: node scripts/browser-dark-contrast-audit.mjs

      - name: Upload product browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-dark-products-${{ matrix.viewport }}-${{ matrix.shard }}
          path: browser-audit/
          if-no-files-found: error
          retention-days: 3
