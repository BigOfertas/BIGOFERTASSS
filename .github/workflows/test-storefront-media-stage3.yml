name: Test Storefront Media Stage 3

on:
  push:
    branches:
      - storefront-media-seo-stage-3-20260908
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-storefront-media-stage3
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Validate catalog foundation
        run: node scripts/validate-catalog-foundation-stage1.mjs

      - name: Validate storefront experience
        run: node scripts/validate-storefront-upgrades.mjs

      - name: Validate stage three media and SEO
        run: node scripts/validate-storefront-media-stage3.mjs

      - name: Validate pricing
        run: bun run validate:pricing

      - name: Validate affiliate regressions
        run: bun run validate:affiliate

      - name: Validate affiliate self-service lifecycle
        run: node scripts/validate-affiliate-self-service.mjs

      - name: Validate order core and admin regressions
        run: bun run validate:phase10

      - name: Build Hostinger artifact without publishing
        run: bun run build:hostinger
