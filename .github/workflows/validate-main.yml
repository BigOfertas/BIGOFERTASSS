name: Validate Storefront Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate centralized storefront brand
        run: node scripts/validate-brand-identity.mjs

      - name: Validate TypeScript and production build
        run: bun run build

      - name: Validate definitive order core
        run: bun run validate:phase10
