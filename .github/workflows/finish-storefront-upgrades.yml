name: Finish Storefront Upgrades

on:
  push:
    branches:
      - storefront-upgrades-20260904
    paths:
      - "scripts/finish-storefront-ui.mjs"
      - ".github/workflows/finish-storefront-upgrades.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finish-storefront-upgrades
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v7
        with:
          ref: storefront-upgrades-20260904

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply finishing pass
        run: node scripts/finish-storefront-ui.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate pricing
        run: bun run validate:pricing

      - name: Validate affiliates
        run: bun run validate:affiliate

      - name: Build application
        run: bun run build

      - name: Build Hostinger artifact without publishing
        run: bun run build:hostinger

      - name: Remove temporary automation
        run: rm scripts/finish-storefront-ui.mjs .github/workflows/finish-storefront-upgrades.yml

      - name: Commit tested finishing pass
        run: |
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add -A
          git commit -m "feat: finish storefront personalization and shopping UX"
          git push origin storefront-upgrades-20260904
