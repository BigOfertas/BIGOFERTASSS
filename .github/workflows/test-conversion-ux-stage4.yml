name: Test Conversion UX Stage 4

on:
  push:
    branches:
      - conversion-ux-polish-stage-4-20260908
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-conversion-ux-stage4
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate stage four conversion UX
        run: node scripts/validate-conversion-ux-stage4.mjs

      - name: Validate catalog foundation
        run: node scripts/validate-catalog-foundation-stage1.mjs

      - name: Validate storefront experience
        run: node scripts/validate-storefront-upgrades.mjs

      - name: Validate media and SEO
        run: node scripts/validate-storefront-media-stage3.mjs

      - name: Validate catalog import bridge
        run: bun run validate:catalog-import

      - name: Validate pricing and order regressions
        run: bun run validate:phase10

      - name: Lint
        run: bun run lint

      - name: Build application
        run: bun run build

      - name: Build Hostinger artifact without publishing
        run: bun run build:hostinger
