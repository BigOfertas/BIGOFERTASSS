name: Temporary Stage 2 Patch Reconciliation

on:
  push:
    branches:
      - stage2-patch-reconcile-20260911
    paths:
      - ".github/workflows/temporary-stage2-patch-reconciliation.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v7
        with:
          ref: stage2-patch-reconcile-20260911

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate static reconciliation migration
        run: node scripts/generate-stage2-patch-reconciliation.mjs

      - name: Register reconciliation migration in deploy pipeline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          deploy = Path("scripts/deploy-storefront-upgrade-migrations.mjs")
          text = deploy.read_text(encoding="utf-8")
          old = '''  [\n    "stage2_storefront_priority_security_fix_20260911",\n    "supabase/migrations/20260911055500_stage2_storefront_priority_security_fix.sql",\n  ],\n];'''
          new = '''  [\n    "stage2_storefront_priority_security_fix_20260911",\n    "supabase/migrations/20260911055500_stage2_storefront_priority_security_fix.sql",\n  ],\n  [\n    "stage2_patch_reconciliation_20260911",\n    "supabase/migrations/20260911061000_stage2_patch_reconciliation.sql",\n  ],\n];'''
          if old in text:
              deploy.write_text(text.replace(old, new), encoding="utf-8")
          elif new not in text:
              raise SystemExit("deploy migration insertion point not found")

          workflow = Path(".github/workflows/deploy-storefront-upgrades-backend.yml")
          text = workflow.read_text(encoding="utf-8")
          old = '      - "supabase/migrations/20260911055500_stage2_storefront_priority_security_fix.sql"'
          new = old + '\n      - "supabase/migrations/20260911061000_stage2_patch_reconciliation.sql"'
          if old in text and "20260911061000_stage2_patch_reconciliation.sql" not in text:
              workflow.write_text(text.replace(old, new), encoding="utf-8")
          elif "20260911061000_stage2_patch_reconciliation.sql" not in text:
              raise SystemExit("workflow migration insertion point not found")
          PY

      - name: Validate generated migration and source
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/migrations/20260911061000_stage2_patch_reconciliation.sql
          grep -q "CREATE TEMP TABLE stage2_patch_reconciliation" supabase/migrations/20260911061000_stage2_patch_reconciliation.sql
          grep -q "Stage 2 patch reconciliation touched protected business tables" supabase/migrations/20260911061000_stage2_patch_reconciliation.sql
          grep -q "stage2_patch_reconciliation_20260911" scripts/deploy-storefront-upgrade-migrations.mjs
          bunx prettier --write scripts/generate-stage2-patch-reconciliation.mjs scripts/audit-stage2-patches.mjs scripts/deploy-storefront-upgrade-migrations.mjs
          node --check scripts/generate-stage2-patch-reconciliation.mjs
          node --check scripts/audit-stage2-patches.mjs
          node --check scripts/deploy-storefront-upgrade-migrations.mjs
          node scripts/validate-stage1-ux.mjs
          node scripts/validate-storefront-upgrades.mjs
          node scripts/validate-storefront-regressions.mjs
          node scripts/validate-stage2-commerce.mjs
          bun run lint
          bun run build

      - name: Commit deterministic reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add \
            supabase/migrations/20260911061000_stage2_patch_reconciliation.sql \
            scripts/generate-stage2-patch-reconciliation.mjs \
            scripts/audit-stage2-patches.mjs \
            scripts/deploy-storefront-upgrade-migrations.mjs \
            .github/workflows/deploy-storefront-upgrades-backend.yml
          if git diff --cached --quiet; then
            echo "NO_PATCH_RECONCILIATION_CHANGES"
            exit 0
          fi
          git commit -m "fix: reconcile Stage 2 product patches"
          git push origin HEAD:stage2-patch-reconcile-20260911
