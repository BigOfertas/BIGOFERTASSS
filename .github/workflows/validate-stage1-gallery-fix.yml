name: Validate Stage 1 Gallery Fix

on:
  push:
    branches:
      - fix-stage1-variant-gallery-mixing-20260914

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix-stage1-variant-gallery-mixing-20260914

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bunx prettier --check src/lib/product-images.ts

      - name: Lint storefront
        run: bunx eslint . --ignore-pattern scripts/qa-stage1-gallery-fix.mjs

      - name: Production build
        run: bun run build

      - name: Hostinger build
        run: bun run build:hostinger

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start branch storefront
        run: |
          nohup bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/stage1-gallery-fix.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/stage1-gallery-fix.log
          exit 1

      - name: Browser QA for gallery fix
        run: node scripts/qa-stage1-gallery-fix.mjs

      - name: Print dev log on failure
        if: failure()
        run: cat /tmp/stage1-gallery-fix.log || true
