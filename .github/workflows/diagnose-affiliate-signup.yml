name: Diagnose Affiliate Signup

on:
  push:
    branches:
      - diagnose-affiliate-signup-20260911
    paths:
      - ".github/workflows/diagnose-affiliate-signup.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - name: Query recent Supabase auth/signup logs
        shell: bash
        run: |
          node <<'NODE'
          const ref = process.env.SUPABASE_PROJECT_ID;
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          if (!ref || !token) throw new Error('Missing Supabase CI credentials');

          const end = new Date();
          const start = new Date(end.getTime() - 3 * 60 * 60 * 1000);
          const sql = `
            select
              timestamp,
              source,
              severity_text,
              event_message,
              log_attributes['request.method'] as method,
              log_attributes['request.path'] as path,
              log_attributes['response.status_code'] as status_code,
              log_attributes['error'] as error,
              log_attributes['msg'] as msg
            from logs
            where
              log_attributes['request.path'] = '/auth/v1/signup'
              or positionCaseInsensitive(event_message, 'signup') > 0
              or positionCaseInsensitive(event_message, 'database error saving new user') > 0
              or positionCaseInsensitive(event_message, 'saving new user') > 0
              or positionCaseInsensitive(event_message, 'affiliate') > 0
              or positionCaseInsensitive(event_message, 'phone') > 0
            order by timestamp desc
            limit 500
          `;
          const qs = new URLSearchParams({
            sql,
            iso_timestamp_start: start.toISOString(),
            iso_timestamp_end: end.toISOString(),
          });
          const response = await fetch(
            `https://api.supabase.com/v1/projects/${encodeURIComponent(ref)}/analytics/endpoints/logs?${qs}`,
            { headers: { authorization: `Bearer ${token}`, accept: 'application/json' } },
          );
          const text = await response.text();
          console.log(`LOG_QUERY_HTTP_${response.status}`);
          console.log(text.slice(0, 50000));
          let payload = null;
          try { payload = JSON.parse(text); } catch {}
          if (!response.ok || (payload && !Array.isArray(payload) && payload.error)) process.exit(10);
          NODE

      - name: Inspect affiliate signup database structure
        shell: bash
        run: |
          node <<'NODE'
          const ref = process.env.SUPABASE_PROJECT_ID;
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const query = `
            select
              (select enabled from public.affiliate_program_settings where singleton = true) as program_enabled,
              (select count(*) from public.affiliates where status = 'active') as active_affiliates,
              (select count(*) from public.affiliates where status = 'active' and user_id is null) as orphan_active_affiliates,
              exists (
                select 1 from pg_catalog.pg_trigger t
                join pg_catalog.pg_class c on c.oid = t.tgrelid
                join pg_catalog.pg_namespace n on n.oid = c.relnamespace
                where n.nspname = 'auth' and c.relname = 'users'
                  and t.tgname = 'on_auth_user_created' and not t.tgisinternal
              ) as new_user_trigger_live,
              exists (
                select 1 from pg_catalog.pg_trigger t
                join pg_catalog.pg_class c on c.oid = t.tgrelid
                join pg_catalog.pg_namespace n on n.oid = c.relnamespace
                where n.nspname = 'auth' and c.relname = 'users'
                  and t.tgname = 'require_phone_on_signup' and not t.tgisinternal
              ) as phone_trigger_live,
              (select p.prosecdef from pg_catalog.pg_proc p join pg_catalog.pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='handle_new_user' limit 1) as handle_new_user_security_definer,
              (select pg_catalog.pg_get_userbyid(p.proowner) from pg_catalog.pg_proc p join pg_catalog.pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='handle_new_user' limit 1) as handle_new_user_owner,
              (select count(*) from pg_catalog.pg_trigger t join pg_catalog.pg_class c on c.oid=t.tgrelid join pg_catalog.pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='affiliate_referrals' and not t.tgisinternal) as referral_custom_triggers;
          `;
          const response = await fetch(
            `https://api.supabase.com/v1/projects/${encodeURIComponent(ref)}/database/query/read-only`,
            {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                accept: 'application/json',
                'content-type': 'application/json',
              },
              body: JSON.stringify({ query }),
            },
          );
          const text = await response.text();
          console.log(`DB_QUERY_HTTP_${response.status}`);
          console.log(text.slice(0, 10000));
          if (!response.ok) process.exit(11);
          NODE
