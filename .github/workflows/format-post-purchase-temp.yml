name: Format Post-Purchase Implementation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/format-post-purchase-temp.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format changed storefront files
        run: >-
          bunx prettier --write
          src/components/orders/PostPurchaseCelebration.tsx
          src/components/account/CustomerOrders.tsx
          src/lib/post-purchase.ts
          'src/routes/conta/pedidos/$orderNumber.tsx'
          src/routes/conta.tsx
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add src/components/orders/PostPurchaseCelebration.tsx src/components/account/CustomerOrders.tsx src/lib/post-purchase.ts 'src/routes/conta/pedidos/$orderNumber.tsx' src/routes/conta.tsx
          git commit -m "style: format post-purchase experience"
          git push origin HEAD:main
