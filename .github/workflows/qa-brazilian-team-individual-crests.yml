name: QA Brazilian Team Individual Crests

on:
  push:
    branches:
      - brasileirao-real-team-images-20260917

permissions:
  contents: write

concurrency:
  group: qa-brazilian-team-individual-crests
  cancel-in-progress: true

jobs:
  qa:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Validate individual crest contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Eo 'enabled: true' src/components/home/BrazilianTeams.tsx | wc -l)" -eq 11
          grep -Fq 'const MINIMUM_TEAM_SLOTS = 30' src/components/home/BrazilianTeams.tsx
          grep -Fq 'data-enabled-team-count={teams.length}' src/components/home/BrazilianTeams.tsx
          grep -Fq 'data-team-slot-count={TOTAL_TEAM_SLOTS}' src/components/home/BrazilianTeams.tsx
          grep -Fq 'object-contain' src/components/home/BrazilianTeams.tsx
          if grep -Fq 'brasileirao-sprite' src/components/home/BrazilianTeams.tsx; then
            echo "BrazilianTeams still depends on the legacy sprite." >&2
            exit 1
          fi
          for asset in \
            flamengo.webp \
            atletico-mineiro.webp \
            cruzeiro.webp \
            saopaulo.webp \
            corinthians.webp \
            palmeiras.webp \
            santos.webp \
            botafogo.webp \
            fluminense.webp \
            gremio.png \
            internacional.webp; do
            test -s "public/assets/teams/$asset"
          done
          echo "INDIVIDUAL_CREST_CONTRACT_OK"

      - name: Lint
        run: bun run lint

      - name: Build Hostinger artifact
        run: bun run build:hostinger

      - name: Locate static output
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT=""
          for candidate in .output/public dist/client dist/public dist; do
            if [ -f "$candidate/index.html" ]; then
              OUTPUT="$candidate"
              break
            fi
          done
          if [ -z "$OUTPUT" ]; then
            echo "Static index.html was not found." >&2
            exit 1
          fi
          echo "HOSTINGER_OUTPUT=$OUTPUT" >> "$GITHUB_ENV"
          echo "Static output: $OUTPUT"

      - name: Install Chromium QA dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$HOSTINGER_OUTPUT" > /tmp/crest-preview.log 2>&1 &
          echo $! > /tmp/crest-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              echo "PREVIEW_READY"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/crest-preview.log || true
          exit 1

      - name: Chromium responsive light and dark QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const expectedTeams = [
            ['flamengo', '/assets/teams/flamengo.webp'],
            ['atletico-mineiro', '/assets/teams/atletico-mineiro.webp'],
            ['cruzeiro', '/assets/teams/cruzeiro.webp'],
            ['sao-paulo', '/assets/teams/saopaulo.webp'],
            ['corinthians', '/assets/teams/corinthians.webp'],
            ['palmeiras', '/assets/teams/palmeiras.webp'],
            ['santos', '/assets/teams/santos.webp'],
            ['botafogo', '/assets/teams/botafogo.webp'],
            ['fluminense', '/assets/teams/fluminense.webp'],
            ['gremio', '/assets/teams/gremio.png'],
            ['internacional', '/assets/teams/internacional.webp'],
          ];

          const browser = await chromium.launch({ headless: true });
          const summaries = [];

          async function runScenario(label, viewport, theme) {
            const context = await browser.newContext({ viewport, colorScheme: theme });
            const page = await context.newPage();
            const failedTeamRequests = [];
            page.on('response', (response) => {
              if (response.url().includes('/assets/teams/') && !response.ok()) {
                failedTeamRequests.push(`${response.status()} ${response.url()}`);
              }
            });

            await page.addInitScript((chosenTheme) => {
              localStorage.setItem('theme', chosenTheme);
            }, theme);

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(3200);

            const heading = page.getByText('Encontre seu time', { exact: true });
            await heading.waitFor({ state: 'visible', timeout: 30000 });
            await heading.scrollIntoViewIfNeeded();
            await page.waitForTimeout(700);

            const wrapper = page.locator('[data-team-slot-count="30"][data-enabled-team-count="11"]');
            if (await wrapper.count() !== 1) throw new Error(`${label}: wrapper contract missing`);

            const cards = page.locator('[data-team-card]');
            if (await cards.count() !== 11) throw new Error(`${label}: expected 11 visible team cards`);

            const slots = page.locator('[data-team-slot]');
            if (await slots.count() !== 11) throw new Error(`${label}: reserved slots leaked into the storefront`);

            const links = page.locator('[data-team-link]');
            if (await links.count() !== 11) throw new Error(`${label}: expected 11 team links`);

            for (const [id, imagePath] of expectedTeams) {
              const link = page.locator(`[data-team-link="${id}"]`);
              if (await link.count() !== 1) throw new Error(`${label}: missing ${id} link`);
              const href = await link.getAttribute('href');
              if (!href || !href.includes(`/products`) || !href.includes(`time=${id}`)) {
                throw new Error(`${label}: invalid filter href for ${id}: ${href}`);
              }
              const image = link.locator('img');
              if ((await image.getAttribute('src')) !== imagePath) {
                throw new Error(`${label}: incorrect source for ${id}`);
              }
            }

            const images = page.locator('[data-team-card] img');
            await page.waitForFunction(() => {
              const nodes = [...document.querySelectorAll('[data-team-card] img')];
              return nodes.length === 11 && nodes.every((img) => img.complete && img.naturalWidth > 0 && img.naturalHeight > 0);
            }, null, { timeout: 30000 });

            const imageMetrics = await images.evaluateAll((nodes) => nodes.map((node) => ({
              src: node.getAttribute('src'),
              width: node.naturalWidth,
              height: node.naturalHeight,
              renderedWidth: node.getBoundingClientRect().width,
              renderedHeight: node.getBoundingClientRect().height,
            })));
            if (imageMetrics.some((image) => image.width <= 0 || image.height <= 0)) {
              throw new Error(`${label}: one or more crests failed to decode`);
            }
            if (failedTeamRequests.length) {
              throw new Error(`${label}: failed team image requests: ${failedTeamRequests.join('; ')}`);
            }

            const rootTheme = await page.evaluate(() => ({
              className: document.documentElement.className,
              colorScheme: getComputedStyle(document.documentElement).colorScheme,
            }));
            if (theme === 'dark' && !rootTheme.className.split(/\s+/).includes('dark')) {
              throw new Error(`${label}: dark theme class was not applied`);
            }
            if (theme === 'light' && rootTheme.className.split(/\s+/).includes('dark')) {
              throw new Error(`${label}: light theme unexpectedly has dark class`);
            }

            const cardStyles = await cards.evaluateAll((nodes) => nodes.map((node) => {
              const outer = getComputedStyle(node);
              const inner = getComputedStyle(node.firstElementChild);
              const rect = node.getBoundingClientRect();
              return {
                width: rect.width,
                height: rect.height,
                outerBackground: outer.backgroundColor,
                innerBackground: inner.backgroundColor,
                borderColor: outer.borderColor,
              };
            }));
            if (cardStyles.some((card) => card.width < 100 || card.height < 100)) {
              throw new Error(`${label}: crest cards are unexpectedly small`);
            }

            const scroller = wrapper.locator('[aria-label="Times do futebol brasileiro"]');
            const scrollBefore = await scroller.evaluate((node) => ({
              left: node.scrollLeft,
              max: Math.max(0, node.scrollWidth - node.clientWidth),
              scrollWidth: node.scrollWidth,
              clientWidth: node.clientWidth,
            }));

            await wrapper.screenshot({ path: `qa-artifacts/${label}-start.png` });

            if (scrollBefore.max > 4) {
              await scroller.evaluate((node) => node.scrollTo({ left: node.scrollWidth, behavior: 'auto' }));
              await page.waitForTimeout(250);
              const scrollAfter = await scroller.evaluate((node) => node.scrollLeft);
              if (scrollAfter <= scrollBefore.left + 4) {
                throw new Error(`${label}: horizontal carousel did not move`);
              }
              await wrapper.screenshot({ path: `qa-artifacts/${label}-end.png` });
            }

            const bodyWidthCheck = await page.evaluate(() => ({
              bodyScrollWidth: document.body.scrollWidth,
              viewportWidth: window.innerWidth,
            }));
            if (bodyWidthCheck.bodyScrollWidth > bodyWidthCheck.viewportWidth + 2) {
              throw new Error(`${label}: unexpected page-level horizontal overflow`);
            }

            const summary = {
              label,
              viewport,
              theme,
              imageMetrics,
              cardStyles,
              scrollBefore,
              rootTheme,
              bodyWidthCheck,
            };
            summaries.push(summary);
            console.log(`CHROMIUM_QA_OK ${label} cards=11 maxScroll=${scrollBefore.max}`);
            await context.close();
          }

          await runScenario('desktop-light', { width: 1440, height: 1200 }, 'light');
          await runScenario('desktop-dark', { width: 1440, height: 1200 }, 'dark');
          await runScenario('mobile-light', { width: 390, height: 844 }, 'light');
          await runScenario('mobile-dark', { width: 390, height: 844 }, 'dark');

          fs.writeFileSync('qa-artifacts/summary.json', JSON.stringify(summaries, null, 2));
          await browser.close();
          console.log('BRAZILIAN_TEAM_BROWSER_QA_OK scenarios=4 visible_crests=11 reserved_visible=0');
          NODE

      - name: Upload QA screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brazilian-team-crest-browser-qa
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Remove one-time QA workflow after success
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/qa-brazilian-team-individual-crests.yml
          git commit -m "chore: remove one-time Brazilian crest browser QA"
          git push origin "HEAD:${GITHUB_REF_NAME}"
