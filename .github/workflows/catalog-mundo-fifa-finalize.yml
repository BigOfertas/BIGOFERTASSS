name: Catalog Mundo FIFA Finalize

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/catalog-mundo-fifa-finalize.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: catalog-mundo-fifa-finalize
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download 44 audited plans from complete source scan
        uses: actions/download-artifact@v4
        with:
          pattern: mundo-fifa-plan-*
          path: .artifacts/mundo-fifa/old
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: 34493929050

      - name: Download corrected Argentina plan
        uses: actions/download-artifact@v4
        with:
          name: mundo-fifa-plan-02
          path: .artifacts/mundo-fifa/corrections/mundo-fifa-plan-02
          github-token: ${{ github.token }}
          run-id: 34495751274

      - name: Download corrected Italy plan
        uses: actions/download-artifact@v4
        with:
          name: mundo-fifa-plan-28
          path: .artifacts/mundo-fifa/corrections/mundo-fifa-plan-28
          github-token: ${{ github.token }}
          run-id: 34496701221

      - name: Assemble source plans
        run: |
          set -euo pipefail
          ROOT=".artifacts/mundo-fifa/combined"
          mkdir -p "$ROOT"
          cp -a .artifacts/mundo-fifa/old/. "$ROOT/"
          rm -rf "$ROOT/mundo-fifa-plan-02" "$ROOT/mundo-fifa-plan-28" "$ROOT/mundo-fifa-plan-42"
          cp -a .artifacts/mundo-fifa/corrections/mundo-fifa-plan-02 "$ROOT/mundo-fifa-plan-02"
          cp -a .artifacts/mundo-fifa/corrections/mundo-fifa-plan-28 "$ROOT/mundo-fifa-plan-28"

      - name: Sanitize frozen scope, source labels and duplicate variants
        run: |
          node scripts/catalog-mundo-fifa-sanitize-plan.mjs \
            --root .artifacts/mundo-fifa/combined

      - name: Merge all plans in original PDF order
        run: |
          node scripts/catalog-merge-mundo-fifa-plans.mjs \
            --manifest catalog-jobs/pdf-groups/mundo-fifa.json \
            --root .artifacts/mundo-fifa/combined \
            --output .artifacts/mundo-fifa/merged-plan.json

      - name: Snapshot protected business data
        run: |
          node scripts/catalog-batch-guard.mjs snapshot \
            --out .artifacts/mundo-fifa/protected-before.json

      - id: filter
        name: Remove products already registered
        run: |
          node scripts/catalog-filter-existing-national-teams.mjs \
            --input .artifacts/mundo-fifa/merged-plan.json \
            --output .artifacts/mundo-fifa/incremental-plan.json \
            --report .artifacts/mundo-fifa/existing-products.json
          COUNT=$(node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('.artifacts/mundo-fifa/incremental-plan.json')); process.stdout.write(String(p.products.length));")
          echo "product_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "MUNDO_FIFA_INCREMENTAL_COUNT=$COUNT"

      - name: Publish new Mundo FIFA products atomically
        if: steps.filter.outputs.product_count != '0'
        run: |
          node scripts/apply-normalized-catalog-plan.mjs \
            --plan .artifacts/mundo-fifa/incremental-plan.json \
            --stock 999

      - name: Verify exact database result and protected data
        if: steps.filter.outputs.product_count != '0'
        run: |
          node scripts/catalog-batch-guard.mjs verify \
            --snapshot .artifacts/mundo-fifa/protected-before.json \
            --plan .artifacts/mundo-fifa/incremental-plan.json \
            --out .artifacts/mundo-fifa/batch-verification.json

      - name: Verify complete Mundo FIFA production coverage
        run: |
          node scripts/catalog-mundo-fifa-production-guard.mjs \
            --manifest catalog-jobs/pdf-groups/mundo-fifa.json \
            --output .artifacts/mundo-fifa/production-verification.json

      - name: Install Playwright for live verification
        if: steps.filter.outputs.product_count != '0'
        run: |
          npm install --no-save --package-lock=false playwright@latest
          npx playwright install --with-deps chromium

      - name: Verify live storefront product samples
        if: steps.filter.outputs.product_count != '0'
        run: |
          node scripts/catalog-batch-public-verify.mjs \
            --verification .artifacts/mundo-fifa/batch-verification.json \
            --base-url https://bigofertas.net \
            --launch-count 10

      - name: Upload final Mundo FIFA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mundo-fifa-final-production
          retention-days: 30
          if-no-files-found: warn
          path: |
            .artifacts/mundo-fifa/merged-plan.json
            .artifacts/mundo-fifa/incremental-plan.json
            .artifacts/mundo-fifa/existing-products.json
            .artifacts/mundo-fifa/protected-before.json
            .artifacts/mundo-fifa/batch-verification.json
            .artifacts/mundo-fifa/production-verification.json
