name: Inspect Checkout Live Temp

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-checkout-live-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - name: Inspect recent checkout logs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.SUPABASE_ACCESS_TOKEN?.trim();
          const project = process.env.SUPABASE_PROJECT_ID?.trim();
          if (!token || !project) throw new Error('Missing Supabase management configuration');

          const end = new Date();
          const start = new Date(end.getTime() - 2 * 60 * 60 * 1000);
          const headers = { authorization: `Bearer ${token}`, accept: 'application/json' };

          async function query(sql) {
            const url = new URL(`https://api.supabase.com/v1/projects/${project}/analytics/endpoints/logs`);
            url.searchParams.set('sql', sql);
            url.searchParams.set('iso_timestamp_start', start.toISOString());
            url.searchParams.set('iso_timestamp_end', end.toISOString());
            const response = await fetch(url, { headers, signal: AbortSignal.timeout(30000) });
            const text = await response.text();
            if (!response.ok) throw new Error(`Log query failed with HTTP ${response.status}: ${text.slice(0, 500)}`);
            const payload = JSON.parse(text);
            return Array.isArray(payload?.result) ? payload.result : [];
          }

          function sanitize(value) {
            return String(value ?? '')
              .replace(/[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/gi, '<uuid>')
              .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, '<email>')
              .replace(/\b\d{7,}\b/g, '<number>')
              .slice(0, 1200);
          }

          const functionRows = await query(`
            select timestamp, source, event_message,
              log_attributes['response.status_code'] as status_code
            from logs
            where source in ('function_logs', 'function_edge_logs')
              and positionCaseInsensitive(event_message, 'checkout') > 0
            order by timestamp desc
            limit 80
          `);
          console.log(`CHECKOUT_FUNCTION_ROWS ${functionRows.length}`);
          for (const row of functionRows) {
            console.log(JSON.stringify({
              timestamp: row.timestamp,
              source: row.source,
              status_code: row.status_code,
              event_message: sanitize(row.event_message),
            }));
          }

          const databaseRows = await query(`
            select timestamp, source, event_message
            from logs
            where source in ('postgres_logs', 'edge_logs', 'postgrest_logs')
              and (
                positionCaseInsensitive(event_message, 'create_order_core') > 0
                or positionCaseInsensitive(event_message, '/rpc/create_order_core') > 0
                or positionCaseInsensitive(event_message, 'order_items') > 0
                or positionCaseInsensitive(event_message, 'orders_') > 0
              )
            order by timestamp desc
            limit 120
          `);
          console.log(`CHECKOUT_DATABASE_ROWS ${databaseRows.length}`);
          for (const row of databaseRows) {
            console.log(JSON.stringify({
              timestamp: row.timestamp,
              source: row.source,
              event_message: sanitize(row.event_message),
            }));
          }

          const postgresErrors = await query(`
            select timestamp, event_message
            from logs
            where source = 'postgres_logs'
              and (
                positionCaseInsensitive(event_message, 'error') > 0
                or positionCaseInsensitive(event_message, 'exception') > 0
                or positionCaseInsensitive(event_message, 'violat') > 0
                or positionCaseInsensitive(event_message, 'invalid') > 0
                or positionCaseInsensitive(event_message, 'ambiguous') > 0
                or positionCaseInsensitive(event_message, 'column') > 0
                or positionCaseInsensitive(event_message, 'record') > 0
                or positionCaseInsensitive(event_message, 'function') > 0
              )
            order by timestamp desc
            limit 160
          `);
          console.log(`CHECKOUT_POSTGRES_ERROR_ROWS ${postgresErrors.length}`);
          for (const row of postgresErrors) {
            console.log(JSON.stringify({
              timestamp: row.timestamp,
              event_message: sanitize(row.event_message),
            }));
          }
          NODE
