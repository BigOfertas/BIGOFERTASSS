name: Inspect Checkout Live Temp

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-checkout-live-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - name: Inspect live checkout database schema
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.SUPABASE_ACCESS_TOKEN?.trim();
          const project = process.env.SUPABASE_PROJECT_ID?.trim();
          if (!token || !project) throw new Error('Missing Supabase management configuration');
          const headers = {
            authorization: `Bearer ${token}`,
            accept: 'application/json',
            'content-type': 'application/json',
          };
          const sql = `
            select 'timeline_columns' as kind,
              jsonb_agg(jsonb_build_object('name', column_name, 'type', udt_name) order by ordinal_position) as value
            from information_schema.columns
            where table_schema = 'public' and table_name = 'order_timeline'
            union all
            select 'order_triggers' as kind,
              jsonb_agg(jsonb_build_object('name', t.tgname, 'definition', pg_get_triggerdef(t.oid)) order by t.tgname) as value
            from pg_trigger t
            join pg_class c on c.oid = t.tgrelid
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relname = 'orders' and not t.tgisinternal
            union all
            select 'timeline_functions' as kind,
              jsonb_agg(jsonb_build_object('name', p.proname, 'definition', pg_get_functiondef(p.oid)) order by p.proname) as value
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
              and p.prokind in ('f', 'p')
              and position('order_timeline' in pg_get_functiondef(p.oid)) > 0;
          `;
          const response = await fetch(`https://api.supabase.com/v1/projects/${project}/database/query/read-only`, {
            method: 'POST', headers, body: JSON.stringify({ query: sql }), signal: AbortSignal.timeout(30000),
          });
          const text = await response.text();
          if (!response.ok) throw new Error(`Schema query failed HTTP ${response.status}: ${text.slice(0, 500)}`);
          const payload = JSON.parse(text);
          for (const row of Array.isArray(payload) ? payload : [payload]) {
            const raw = JSON.stringify(row);
            console.log(raw
              .replace(/[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/gi, '<uuid>')
              .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, '<email>')
              .slice(0, 20000));
          }
          NODE
