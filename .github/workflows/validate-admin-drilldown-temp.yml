name: Validate Admin Drilldown Temp

on:
  push:
    branches:
      - fix-admin-product-affiliate-drilldown-20260912

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Normalize new admin code
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = "src/components/admin/AffiliateAdminWorkspace.tsx";
          let source = fs.readFileSync(path, "utf8");
          source = source.replace(
            '  const affiliates = affiliatesQuery.data ?? [];',
            '  const affiliates = useMemo(() => affiliatesQuery.data ?? [], [affiliatesQuery.data]);',
          );
          source = source.replace(
            '  const referrals = referralsQuery.data ?? [];',
            '  const referrals = useMemo(() => referralsQuery.data ?? [], [referralsQuery.data]);',
          );
          source = source.replace(
            '  const orders = ordersQuery.data ?? [];',
            '  const orders = useMemo(() => ordersQuery.data ?? [], [ordersQuery.data]);',
          );
          source = source.replace(
            '  const commissions = commissionsQuery.data ?? [];',
            '  const commissions = useMemo(() => commissionsQuery.data ?? [], [commissionsQuery.data]);',
          );
          fs.writeFileSync(path, source);
          NODE
          bunx prettier --write \
            src/components/admin/AffiliateAdminWorkspace.tsx \
            src/components/admin/ProductsAdminWorkspace.tsx \
            src/routes/admin.tsx
      - name: Persist formatting fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/admin/AffiliateAdminWorkspace.tsx \
            src/components/admin/ProductsAdminWorkspace.tsx \
            src/routes/admin.tsx
          git commit -m "style: format admin drilldown"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - run: bun run lint
      - run: bun run build
      - name: Validate Hostinger build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: bun run build:hostinger
