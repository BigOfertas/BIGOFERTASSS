name: Dispatch Hostinger Once

on:
  push:
    branches:
      - hostinger-dispatch-once-20260909
    paths:
      - .deploy/dispatch-hostinger-20260909

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official production workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run hostinger-production-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo HOSTINGER_WORKFLOW_DISPATCHED
