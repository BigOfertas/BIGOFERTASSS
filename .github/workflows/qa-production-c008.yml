name: QA Production c008

on:
  push:
    branches:
      - qa-production-c008-20260913
    paths:
      - ".github/workflows/qa-production-c008.yml"

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v7
        with:
          ref: qa-production-c008-20260913

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run production browser QA
        run: node scripts/qa-production-c008.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-qa-c008
          path: qa-artifacts
          if-no-files-found: error
