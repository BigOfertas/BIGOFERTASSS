name: Audit Supabase Live V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-supabase-live-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - uses: actions/checkout@v7
      - name: Read-only auth and RPC privilege audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, os, re, subprocess

          token = os.environ['SUPABASE_ACCESS_TOKEN']
          ref = os.environ['SUPABASE_PROJECT_ID']
          base = 'https://api.supabase.com'

          def call(method, path, body=None):
              cmd = [
                  'curl', '-fsS', '-X', method,
                  '-H', f'Authorization: Bearer {token}',
                  '-H', 'Accept: application/json',
                  '-H', 'User-Agent: curl/8 BIGofertas-readonly-audit',
                  base + path,
              ]
              raw_body = None
              if body is not None:
                  cmd += ['-H', 'Content-Type: application/json', '--data-binary', '@-']
                  raw_body = json.dumps(body).encode()
              proc = subprocess.run(cmd, input=raw_body, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if proc.returncode:
                  raise RuntimeError(f'{method} {path}: {proc.stderr.decode(errors="replace")[:1000]}')
              raw = proc.stdout.decode()
              return json.loads(raw) if raw else None

          def sql(query):
              return call('POST', f'/v1/projects/{ref}/database/query', {'query': query, 'read_only': True})

          def rows(payload):
              if isinstance(payload, list): return payload
              if isinstance(payload, dict):
                  for key in ('result', 'data'):
                      if isinstance(payload.get(key), list): return payload[key]
              return []

          def show(name, value):
              print(f'\n===== {name} =====')
              print(json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True))

          auth = call('GET', f'/v1/projects/{ref}/config/auth')
          selected_auth = {}
          if isinstance(auth, dict):
              for key in ('site_url','uri_allow_list','disable_signup','external_email_enabled','mailer_autoconfirm'):
                  if key in auth:
                      selected_auth[key] = auth[key]
          show('AUTH_CONFIG_SELECTED', selected_auth)

          revoked_public = set()
          grant_anon = set()
          grant_authenticated = set()
          grant_service = set()

          revoke_re = re.compile(r'REVOKE\s+ALL\s+ON\s+FUNCTION\s+public\.([a-zA-Z0-9_]+)\s*\([^;]*?\)\s+FROM\s+([^;]+);', re.I | re.S)
          grant_re = re.compile(r'GRANT\s+EXECUTE\s+ON\s+FUNCTION\s+public\.([a-zA-Z0-9_]+)\s*\([^;]*?\)\s+TO\s+([^;]+);', re.I | re.S)

          for path in sorted(glob.glob('supabase/migrations/*.sql')):
              text = open(path, encoding='utf-8').read()
              for name, roles in revoke_re.findall(text):
                  normalized = roles.lower()
                  if 'public' in normalized:
                      revoked_public.add(name.lower())
                  if 'anon' in normalized:
                      grant_anon.discard(name.lower())
                  if 'authenticated' in normalized:
                      grant_authenticated.discard(name.lower())
                  if 'service_role' in normalized:
                      grant_service.discard(name.lower())
              for name, roles in grant_re.findall(text):
                  key = name.lower()
                  normalized = roles.lower()
                  if 'anon' in normalized:
                      grant_anon.add(key)
                  if 'authenticated' in normalized:
                      grant_authenticated.add(key)
                  if 'service_role' in normalized:
                      grant_service.add(key)

          live_acl = rows(sql('''
            select p.proname as function_name,
                   has_function_privilege('anon', p.oid, 'EXECUTE') as anon_execute,
                   has_function_privilege('authenticated', p.oid, 'EXECUTE') as authenticated_execute,
                   has_function_privilege('service_role', p.oid, 'EXECUTE') as service_execute
            from pg_proc p
            join pg_namespace n on n.oid=p.pronamespace
            where n.nspname='public' and p.prokind='f'
            order by p.proname
          '''))

          mismatches = []
          for row in live_acl:
              name = str(row.get('function_name') or '').lower()
              if name not in revoked_public:
                  continue
              expected_anon = name in grant_anon
              expected_auth = name in grant_authenticated
              expected_service = name in grant_service
              if row.get('anon_execute') != expected_anon or row.get('authenticated_execute') != expected_auth or row.get('service_execute') != expected_service:
                  mismatches.append({
                      'function_name': name,
                      'repo_expected': {
                          'anon_execute': expected_anon,
                          'authenticated_execute': expected_auth,
                          'service_execute': expected_service,
                      },
                      'live': {
                          'anon_execute': row.get('anon_execute'),
                          'authenticated_execute': row.get('authenticated_execute'),
                          'service_execute': row.get('service_execute'),
                      },
                  })

          show('RPC_PRIVILEGE_MISMATCHES', mismatches)
          show('RPC_PRIVILEGE_SUMMARY', {
              'repo_functions_with_public_revoke': len(revoked_public),
              'mismatch_count': len(mismatches),
          })
          PY
