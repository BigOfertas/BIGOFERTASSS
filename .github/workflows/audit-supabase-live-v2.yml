name: Audit Supabase Live V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-supabase-live-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - uses: actions/checkout@v7
      - name: Read-only ACL and auth audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess

          token = os.environ['SUPABASE_ACCESS_TOKEN']
          ref = os.environ['SUPABASE_PROJECT_ID']
          base = 'https://api.supabase.com'

          def call(method, path, body=None):
              cmd = [
                  'curl', '-fsS', '-X', method,
                  '-H', f'Authorization: Bearer {token}',
                  '-H', 'Accept: application/json',
                  '-H', 'User-Agent: curl/8 BIGofertas-readonly-audit',
                  base + path,
              ]
              raw_body = None
              if body is not None:
                  cmd += ['-H', 'Content-Type: application/json', '--data-binary', '@-']
                  raw_body = json.dumps(body).encode()
              proc = subprocess.run(cmd, input=raw_body, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if proc.returncode:
                  raise RuntimeError(f'{method} {path}: {proc.stderr.decode(errors="replace")[:1000]}')
              raw = proc.stdout.decode()
              return json.loads(raw) if raw else None

          def sql(query):
              return call('POST', f'/v1/projects/{ref}/database/query', {'query': query, 'read_only': True})

          def rows(payload):
              if isinstance(payload, list): return payload
              if isinstance(payload, dict):
                  for key in ('result', 'data'):
                      if isinstance(payload.get(key), list): return payload[key]
              return []

          def show(name, value):
              print(f'\n===== {name} =====')
              print(json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True))

          table_acl = rows(sql('''
            select c.relname as table_name,
              has_table_privilege('anon', c.oid, 'SELECT') as anon_select,
              has_table_privilege('anon', c.oid, 'INSERT') as anon_insert,
              has_table_privilege('anon', c.oid, 'UPDATE') as anon_update,
              has_table_privilege('anon', c.oid, 'DELETE') as anon_delete,
              has_table_privilege('authenticated', c.oid, 'SELECT') as authenticated_select,
              has_table_privilege('authenticated', c.oid, 'INSERT') as authenticated_insert,
              has_table_privilege('authenticated', c.oid, 'UPDATE') as authenticated_update,
              has_table_privilege('authenticated', c.oid, 'DELETE') as authenticated_delete,
              has_table_privilege('service_role', c.oid, 'SELECT') as service_select,
              has_table_privilege('service_role', c.oid, 'INSERT') as service_insert,
              has_table_privilege('service_role', c.oid, 'UPDATE') as service_update,
              has_table_privilege('service_role', c.oid, 'DELETE') as service_delete
            from pg_class c
            join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public' and c.relkind='r'
            order by c.relname
          '''))
          show('TABLE_ACL_EFFECTIVE', table_acl)

          routine_acl = rows(sql('''
            select p.proname as function_name,
              pg_get_function_identity_arguments(p.oid) as arguments,
              has_function_privilege('anon', p.oid, 'EXECUTE') as anon_execute,
              has_function_privilege('authenticated', p.oid, 'EXECUTE') as authenticated_execute,
              has_function_privilege('service_role', p.oid, 'EXECUTE') as service_execute
            from pg_proc p
            join pg_namespace n on n.oid=p.pronamespace
            where n.nspname='public' and p.prokind='f'
            order by p.proname, arguments
          '''))
          show('ROUTINE_ACL_EFFECTIVE', routine_acl)

          try:
              cfg = call('GET', f'/v2/projects/{ref}/config')
              data = cfg.get('data') if isinstance(cfg, dict) and isinstance(cfg.get('data'), dict) else cfg
              auth = data.get('auth') if isinstance(data, dict) and isinstance(data.get('auth'), dict) else data
              selected = {}
              if isinstance(auth, dict):
                  for key in ('site_url','uri_allow_list','disable_signup','external_email_enabled','mailer_autoconfirm'):
                      if key in auth:
                          selected[key] = auth[key]
              show('AUTH_CONFIG_SELECTED', selected)
          except Exception as exc:
              show('AUTH_CONFIG_SELECTED', {'error': str(exc)})

          sensitive_tables = ['email_2fa_challenges','notification_events','product_identity_slots']
          sensitive = [row for row in table_acl if row.get('table_name') in sensitive_tables]
          show('SENSITIVE_TABLE_ACL', sensitive)
          PY
