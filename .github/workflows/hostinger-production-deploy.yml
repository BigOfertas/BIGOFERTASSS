name: Hostinger Production Deploy

on:
  workflow_dispatch:
  workflow_call:
  workflow_run:
    workflows:
      - Validate Storefront Main
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: hostinger-production-deploy-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
      HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
      HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
      SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate static Hostinger architecture
        run: node scripts/validate-hostinger-static.mjs

      - name: Build Hostinger SPA
        run: bun run build:hostinger

      - name: Locate static output
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT=""
          for candidate in .output/public dist/client dist/public dist; do
            if [ -f "$candidate/index.html" ]; then
              OUTPUT="$candidate"
              break
            fi
          done

          if [ -z "$OUTPUT" ]; then
            echo "Static index.html was not found in known output directories." >&2
            find . -maxdepth 4 -type f -name 'index.html' -print || true
            exit 1
          fi

          echo "HOSTINGER_OUTPUT=$OUTPUT" >> "$GITHUB_ENV"
          echo "Static output: $OUTPUT"

      - name: Verify public Supabase configuration in bundle
        shell: bash
        run: |
          set -euo pipefail
          grep -R -F -q "hootwcacnrtidfmqsvrn.supabase.co" "$HOSTINGER_OUTPUT"
          grep -R -F -q "sb_publishable_" "$HOSTINGER_OUTPUT"

      - name: Reject server secrets from static bundle
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E -q "SUPABASE_SERVICE_ROLE_KEY|SUPERFRETE_TOKEN|RESEND_API_KEY|EMAIL_2FA_SECRET|R2_SECRET_ACCESS_KEY|SUPABASE_ACCESS_TOKEN" "$HOSTINGER_OUTPUT"; then
            echo "Server-only secret marker found in static Hostinger output." >&2
            exit 1
          fi

      - name: Ensure Hostinger rewrite file is packaged
        shell: bash
        run: |
          set -euo pipefail
          cp public/.htaccess "$HOSTINGER_OUTPUT/.htaccess"
          test -f "$HOSTINGER_OUTPUT/.htaccess"

      - name: Verify hard-refresh shell has no legacy loader
        shell: bash
        run: |
          set -euo pipefail
          if grep -F -q 'data-initial-refresh-loader' "$HOSTINGER_OUTPUT/index.html"; then
            echo "Legacy artificial refresh loader is present in the production bundle." >&2
            exit 1
          fi
          echo "HOSTINGER_REFRESH_SHELL_OK"

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          for name in HOSTINGER_SSH_HOST HOSTINGER_SSH_PORT HOSTINGER_SSH_USER SSHPASS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required Hostinger secret: $name" >&2
              exit 1
            fi
          done
          sudo apt-get update >/dev/null
          sudo apt-get install -y openssh-client sshpass rsync >/dev/null
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$HOSTINGER_SSH_PORT" -H "$HOSTINGER_SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -p "$HOSTINGER_SSH_PORT" \
            -o BatchMode=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            'set -eu; TARGET="$HOME/domains/bigofertas.net/public_html"; test -d "$TARGET"; command -v rsync >/dev/null; mkdir -p "$TARGET/media"; echo HOSTINGER_TARGET_OK'

      - name: Deploy to bigofertas.net
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_PATH="/home/${HOSTINGER_SSH_USER}/domains/bigofertas.net/public_html/"
          sshpass -e rsync \
            -az \
            --delete \
            --exclude='media/' \
            -e "ssh -p ${HOSTINGER_SSH_PORT} -o BatchMode=no -o PreferredAuthentications=password -o PubkeyAuthentication=no" \
            "$HOSTINGER_OUTPUT/" \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST:$REMOTE_PATH"

      - name: Verify deployed site files
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -p "$HOSTINGER_SSH_PORT" \
            -o BatchMode=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            'set -eu; TARGET="$HOME/domains/bigofertas.net/public_html"; test -f "$TARGET/index.html"; test -f "$TARGET/.htaccess"; test -d "$TARGET/media"; echo HOSTINGER_DEPLOY_OK'

      - name: Verify production hard-refresh shell
        shell: bash
        run: |
          set -euo pipefail
          for path in / /products /login; do
            body="$(mktemp)"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              "https://bigofertas.net${path}?refresh_shell_check=${GITHUB_RUN_ID}" \
              -o "$body"
            if grep -F -q 'data-initial-refresh-loader' "$body"; then
              echo "Legacy artificial refresh loader found in production HTML for ${path}." >&2
              rm -f "$body"
              exit 1
            fi
            rm -f "$body"
          done
          echo "HOSTINGER_REFRESH_SHELL_PRODUCTION_OK"
