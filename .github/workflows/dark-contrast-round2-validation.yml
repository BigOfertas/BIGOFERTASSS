name: Dark Contrast Round 2 Validation

on:
  push:
    branches:
      - fix-dark-contrast-round2-20260915
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dark-contrast-round2-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Validate dark mode and i18n
        run: node scripts/validate-stage6-i18n.mjs && node scripts/validate-dark-mode-coverage.mjs
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Hostinger build
        run: bun run build:hostinger
