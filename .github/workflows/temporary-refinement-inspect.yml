name: Temporary Refinement Inspect

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-refinement-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - uses: actions/checkout@v7
      - name: Inspect candidate model products
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const project = process.env.SUPABASE_PROJECT_ID;
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const response = await fetch(`https://api.supabase.com/v1/projects/${project}/database/query/read-only`, {
            method: 'POST',
            headers: { authorization:`Bearer ${token}`, 'content-type':'application/json', accept:'application/json' },
            body: JSON.stringify({ query: `
              with counts as (
                select p.id, p.catalog_code, p.name, p.category, p.time,
                  coalesce(pps.commercial_type,'other') commercial_type,
                  (select count(*) from public.product_images i where i.product_id=p.id and i.status='ready') image_count,
                  (select count(*) from public.product_variants v where v.product_id=p.id and v.status='active') variant_count,
                  (select count(*) from public.product_options o where o.product_id=p.id) option_count
                from public.products p
                left join public.product_purchase_settings pps on pps.product_id=p.id
                where p.status='active'
              )
              select
                count(*) filter (where image_count=2 and variant_count=1 and option_count=0) exact_two_single_variant,
                count(*) filter (where image_count=2 and variant_count=1 and option_count=0 and commercial_type='infantil') infantil_candidates,
                jsonb_agg(jsonb_build_object('code',catalog_code,'name',name,'category',category,'time',time,'type',commercial_type) order by catalog_code)
                  filter (where image_count=2 and variant_count=1 and option_count=0) samples
              from counts;
            ` })
          });
          const text = await response.text();
          if (!response.ok) throw new Error(`${response.status}: ${text.slice(0,500)}`);
          console.log(text);
          NODE
