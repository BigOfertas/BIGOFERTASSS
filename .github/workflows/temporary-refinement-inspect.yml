name: Temporary Refinement Inspect

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-refinement-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect target product source version keys
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs';
          const env = fs.readFileSync('.env','utf8');
          const get = (name) => env.match(new RegExp(`^${name}=["']?([^"'\\n]+)`, 'm'))?.[1]?.trim();
          const url = get('VITE_SUPABASE_URL');
          const key = get('VITE_SUPABASE_PUBLISHABLE_KEY');
          const headers = { apikey:key, authorization:`Bearer ${key}`, 'content-type':'application/json' };
          const r = await fetch(`${url}/rest/v1/rpc/storefront_product_detail_v2`, {
            method:'POST', headers, body:JSON.stringify({p_identifier:'manchester-city-conjunto-infantil-24-25-puma-p002218'})
          });
          const detail = await r.json();
          console.log(JSON.stringify({
            variants: detail?.variants?.map(v => ({id:v.id,name:v.name})),
            images: detail?.images?.map(i => ({
              id:i.id, variant_id:i.variant_id, sort_order:i.sort_order,
              catalog_source_key:i.catalog_source_key, original_filename:i.original_filename
            }))
          }, null, 2));
          NODE
