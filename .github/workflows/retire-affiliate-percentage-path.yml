name: Retire Affiliate Percentage Path

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/retire-affiliate-percentage-path.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retire-affiliate-percentage-path
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Retire legacy percentage code paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p, s): Path(p).write_text(s, encoding='utf-8')
          def rex(p, pattern, repl, flags=0):
              s = read(p)
              out, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'pattern not found exactly once: {p} :: {pattern}')
              write(p, out)
          def exact(p, before, after):
              s = read(p)
              if before not in s:
                  raise SystemExit(f'block not found: {p} :: {before[:100]}')
              write(p, s.replace(before, after, 1))

          migration = '''BEGIN;

          -- A regra percentual foi aposentada. As colunas antigas continuam apenas para
          -- preservar snapshots historicos; novas configuracoes usam exclusivamente
          -- comissao fixa por peca e suas faixas.

          UPDATE public.affiliate_program_settings
          SET commission_rate_bps = NULL,
              commission_base_mode = NULL,
              updated_at = now()
          WHERE singleton = true;

          REVOKE ALL ON FUNCTION public.owner_save_affiliate_program_draft(integer, text, integer, numeric, text)
            FROM PUBLIC, anon, authenticated;
          REVOKE ALL ON FUNCTION public.owner_configure_affiliate_program(boolean, integer, text, integer, numeric, text)
            FROM PUBLIC, anon, authenticated;

          COMMENT ON FUNCTION public.owner_save_affiliate_program_draft(integer, text, integer, numeric, text) IS
            'LEGADO: configuracao percentual aposentada. O programa vigente usa faixas de valor fixo por peca.';
          COMMENT ON FUNCTION public.owner_configure_affiliate_program(boolean, integer, text, integer, numeric, text) IS
            'LEGADO: configuracao percentual aposentada. O programa vigente usa faixas de valor fixo por peca.';

          COMMIT;
          '''
          write('supabase/migrations/20260904052500_affiliate_percentage_path_retirement.sql', migration)

          p = 'src/components/admin/AffiliateAdmin.tsx'
          s = read(p)
          for token in ['  BadgePercent,\n', '  Save,\n', '  ShieldCheck,\n']:
              s = s.replace(token, '')
          s = s.replace('import { useEffect, useMemo, useState } from "react";', 'import { useState } from "react";')
          for token in ['  configureAffiliateProgram,\n', '  saveAffiliateProgramDraft,\n', '  type AffiliateProgramDraft,\n']:
              s = s.replace(token, '')
          s, n = re.subn(r'\nfunction formatPercent\([\s\S]*?\n}\n\nfunction formatBase\([\s\S]*?\n}\n', '\n', s, count=1)
          if n != 1: raise SystemExit('legacy format helpers not found')
          s, n = re.subn(r'\n  const \[commissionPercent, setCommissionPercent\][\s\S]*?\n  const \[rulesInitialized, setRulesInitialized\] = useState\(false\);', '', s, count=1)
          if n != 1: raise SystemExit('legacy affiliate states not found')
          s, n = re.subn(r'\n  useEffect\(\(\) => \{[\s\S]*?\n  const actionMutation = useMutation\(\{', '\n\n  const actionMutation = useMutation({', s, count=1)
          if n != 1: raise SystemExit('legacy affiliate editor block not found')
          s, n = re.subn(r'\n  function completedDraft\(\) \{[\s\S]*?\n  }\n\n  const overview = overviewQuery\.data;', '\n\n  const overview = overviewQuery.data;', s, count=1)
          if n != 1: raise SystemExit('completedDraft block not found')
          marker = '''function withdrawalStatusLabel(value: string | null | undefined) {
            if (value === "requested") return "Solicitado";
            if (value === "paid") return "Pago";
            if (value === "rejected") return "Não aprovado";
            return value || "—";
          }
          '''
          if marker not in s: raise SystemExit('status helper marker not found')
          s = s.replace(marker, marker + '''
          function refundReviewStatusLabel(value: string | null | undefined) {
            if (value === "pending") return "Pendente";
            if (value === "resolved") return "Revisado";
            return value || "—";
          }
          ''', 1)
          s = s.replace('{row.review_status}</p>', '{refundReviewStatusLabel(row.review_status)}</p>')
          s = s.replace('{overview.holdDays === null ? "A definir" : `${overview.holdDays} dias`}', '{overview.holdDays === null ? "A definir" : overview.holdDays === 0 ? "Imediata" : `${overview.holdDays} dias`}')
          write(p, s)

          p = 'src/lib/admin-affiliates.ts'
          s = read(p)
          s = s.replace('  commissionRateBps: number | null;\n', '')
          s = s.replace('  commissionBaseMode: "items_after_discount" | "order_total" | null;\n', '')
          s, n = re.subn(r'\nexport type AffiliateProgramDraft = \{[\s\S]*?\n};\n', '\n', s, count=1)
          if n != 1: raise SystemExit('AffiliateProgramDraft not found')
          s, n = re.subn(r'  const base =\n[\s\S]*?\n      : null;\n\n', '', s, count=1)
          if n != 1: raise SystemExit('overview base normalization not found')
          s = s.replace('    commissionRateBps: nullableNumber(row.commissionRateBps),\n', '')
          s = s.replace('    commissionBaseMode: base,\n', '')
          s, n = re.subn(r'\nexport function saveAffiliateProgramDraft\([\s\S]*?\n}\n\nexport function configureAffiliateProgram\([\s\S]*?\n}\n', '\n', s, count=1)
          if n != 1: raise SystemExit('legacy admin affiliate RPC clients not found')
          write(p, s)

          p = 'scripts/deploy-affiliate-backend.mjs'
          exact(p,
          '''if (!appliedNames.has("affiliate_pix_withdrawal_and_defaults")) {
            await applyMigration(
              "affiliate_pix_withdrawal_and_defaults",
              "supabase/migrations/20260904052000_affiliate_pix_withdrawal_and_defaults.sql",
            );
            appliedNames.add("affiliate_pix_withdrawal_and_defaults");
          }

          const verification = await readOnly(`''',
          '''if (!appliedNames.has("affiliate_pix_withdrawal_and_defaults")) {
            await applyMigration(
              "affiliate_pix_withdrawal_and_defaults",
              "supabase/migrations/20260904052000_affiliate_pix_withdrawal_and_defaults.sql",
            );
            appliedNames.add("affiliate_pix_withdrawal_and_defaults");
          }

          if (!appliedNames.has("affiliate_percentage_path_retirement")) {
            await applyMigration(
              "affiliate_percentage_path_retirement",
              "supabase/migrations/20260904052500_affiliate_percentage_path_retirement.sql",
            );
            appliedNames.add("affiliate_percentage_path_retirement");
          }

          const verification = await readOnly(`''')
          exact(p,
          '''  exists (
            select 1 from public.affiliate_program_settings s
            where s.singleton = true
              and s.hold_days = 0
              and s.minimum_withdrawal = 60.00
              and upper(btrim(s.withdrawal_method)) = 'PIX'
          ) as confirmed_business_defaults,
          not exists (''',
          '''  exists (
            select 1 from public.affiliate_program_settings s
            where s.singleton = true
              and s.hold_days = 0
              and s.minimum_withdrawal = 60.00
              and upper(btrim(s.withdrawal_method)) = 'PIX'
          ) as confirmed_business_defaults,
          not has_function_privilege(
            'authenticated',
            'public.owner_save_affiliate_program_draft(integer,text,integer,numeric,text)',
            'EXECUTE'
          ) as legacy_draft_rpc_retired,
          not has_function_privilege(
            'authenticated',
            'public.owner_configure_affiliate_program(boolean,integer,text,integer,numeric,text)',
            'EXECUTE'
          ) as legacy_configure_rpc_retired,
          not exists (
            select 1 from public.affiliate_program_settings s
            where s.singleton = true
              and (s.commission_rate_bps is not null or s.commission_base_mode is not null)
          ) as legacy_percentage_settings_cleared,
          (select amount_per_unit = 20 from public.resolve_affiliate_commission_tier('00000000-0000-0000-0000-000000000000'::uuid, 1)) as tier_1_safe,
          (select amount_per_unit = 20 from public.resolve_affiliate_commission_tier('00000000-0000-0000-0000-000000000000'::uuid, 7)) as tier_7_safe,
          (select amount_per_unit = 18 from public.resolve_affiliate_commission_tier('00000000-0000-0000-0000-000000000000'::uuid, 8)) as tier_8_safe,
          (select amount_per_unit = 15 from public.resolve_affiliate_commission_tier('00000000-0000-0000-0000-000000000000'::uuid, 15)) as tier_15_safe,
          (select amount_per_unit = 15 from public.resolve_affiliate_commission_tier('00000000-0000-0000-0000-000000000000'::uuid, 34)) as tier_34_safe,
          (select amount_per_unit = 12 from public.resolve_affiliate_commission_tier('00000000-0000-0000-0000-000000000000'::uuid, 35)) as tier_35_safe,
          not exists (''')
          exact(p,
          '''  "confirmed_business_defaults",
            "withdrawal_method_column",''',
          '''  "confirmed_business_defaults",
            "legacy_draft_rpc_retired",
            "legacy_configure_rpc_retired",
            "legacy_percentage_settings_cleared",
            "tier_1_safe",
            "tier_7_safe",
            "tier_8_safe",
            "tier_15_safe",
            "tier_34_safe",
            "tier_35_safe",
            "withdrawal_method_column",''')

          p = 'scripts/validate-affiliate-backend.mjs'
          s = read(p)
          marker = '''const finalRules = read(
            "supabase/migrations/20260904052000_affiliate_pix_withdrawal_and_defaults.sql",
          );
          const commissionEditor = read("src/components/admin/AffiliateCommissionSettings.tsx");'''
          if marker not in s: raise SystemExit('validation finalRules marker not found')
          s = s.replace(marker, '''const finalRules = read(
            "supabase/migrations/20260904052000_affiliate_pix_withdrawal_and_defaults.sql",
          );
          const percentageRetirement = read(
            "supabase/migrations/20260904052500_affiliate_percentage_path_retirement.sql",
          );
          const adminAffiliates = read("src/lib/admin-affiliates.ts");
          const commissionEditor = read("src/components/admin/AffiliateCommissionSettings.tsx");''', 1)
          marker = '''check(
            "painel administrativo mostra todas as faixas fixas ao mesmo tempo",'''
          if marker not in s: raise SystemExit('validation fixed tiers marker not found')
          s = s.replace(marker, '''check(
            "caminho percentual antigo foi aposentado no frontend e no banco",
            percentageRetirement.includes("legacy") || percentageRetirement.includes("LEGADO") &&
              percentageRetirement.includes("REVOKE ALL ON FUNCTION public.owner_save_affiliate_program_draft") &&
              percentageRetirement.includes("REVOKE ALL ON FUNCTION public.owner_configure_affiliate_program") &&
              !affiliateAdmin.includes("commissionPercent") &&
              !affiliateAdmin.includes("commissionBaseMode") &&
              !adminAffiliates.includes("saveAffiliateProgramDraft") &&
              !adminAffiliates.includes("configureAffiliateProgram"),
          );

          check(
            "painel administrativo mostra todas as faixas fixas ao mesmo tempo",''', 1)
          write(p, s)
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate affiliate module
        run: bun run validate:affiliate

      - name: Validate order/admin regressions
        run: bun run validate:phase10

      - name: Build production application
        run: bun run build

      - name: Build Hostinger artifact without publishing
        run: bun run build:hostinger

      - name: Apply and verify affiliate backend
        run: node scripts/deploy-affiliate-backend.mjs

      - name: Remove temporary workflow
        run: rm .github/workflows/retire-affiliate-percentage-path.yml

      - name: Commit completed cleanup
        run: |
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add -A
          git commit -m "refactor: retire legacy affiliate percentage configuration"
          git push origin main
