name: Validate Stage 2 Final Close

on:
  push:
    branches:
      - fix-stage2-verifier-prettier-20260914

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Stage 2 size guidance
        run: bun scripts/validate-size-guidance.ts

      - name: Validate storefront regressions
        run: node scripts/validate-storefront-upgrades.mjs && node scripts/validate-storefront-regressions.mjs && node scripts/validate-stage2-commerce.mjs && node scripts/validate-final-storefront-refinements.mjs

      - name: Lint storefront
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Hostinger build without publish
        run: bun run build:hostinger

      - name: Validate definitive order core
        run: bun run validate:phase10

      - name: Validate backend verifier syntax
        run: node --check scripts/deploy-dynamic-size-guidance.mjs

      - name: Verify Stage 2 backend contract
        run: node scripts/deploy-dynamic-size-guidance.mjs
