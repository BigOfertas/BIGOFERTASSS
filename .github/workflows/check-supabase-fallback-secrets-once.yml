name: Check Supabase Fallback Secrets Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/check-supabase-fallback-secrets-once.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DATABASE_PASSWORD: ${{ secrets.SUPABASE_DATABASE_PASSWORD }}
      SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Report availability only
        shell: bash
        run: |
          set -euo pipefail
          for pair in \
            "SUPABASE_SERVICE_ROLE_KEY:${SERVICE_ROLE:-}" \
            "SUPABASE_DB_PASSWORD:${DB_PASSWORD:-}" \
            "SUPABASE_DATABASE_PASSWORD:${DATABASE_PASSWORD:-}" \
            "SUPABASE_SERVICE_KEY:${SERVICE_KEY:-}"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -n "$value" ]; then
              echo "$name=available"
            else
              echo "$name=missing"
            fi
          done
