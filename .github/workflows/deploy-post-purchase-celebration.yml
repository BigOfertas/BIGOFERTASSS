name: Deploy Post-Purchase Celebration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-post-purchase-celebration.yml"
      - "scripts/deploy-post-purchase-celebration.mjs"
      - "supabase/migrations/20260912170000_post_purchase_celebration.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-post-purchase-celebration-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deploy post-purchase celebration state
        run: node scripts/deploy-post-purchase-celebration.mjs
