name: Fix Auth CAPTCHA Login Hotfix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-auth-captcha-login-temp.yml"

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply auth CAPTCHA hotfix
        run: node scripts/fix-auth-captcha-login-temp.mjs
      - name: Format hotfix
        run: bunx prettier --write supabase/functions/auth-email-2fa/index.ts src/lib/auth.tsx src/routes/login.tsx
      - name: Validate storefront
        run: |
          bun run lint
          bun run build
      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add supabase/functions/auth-email-2fa/index.ts src/lib/auth.tsx src/routes/login.tsx
          git commit -m "fix: forward Turnstile token through password login"
          git push origin HEAD:main
