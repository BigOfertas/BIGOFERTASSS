name: Fix Auth CAPTCHA Login Hotfix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-auth-captcha-login-temp.yml"

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply auth CAPTCHA hotfix
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, found {count}\n--- pattern ---\n{old}")
              path.write_text(text.replace(old, new, 1))

          edge = Path("supabase/functions/auth-email-2fa/index.ts")
          replace_once(
              edge,
              'import { consumeRateLimit, verifyTurnstile } from "../_shared/security.ts";',
              'import { consumeRateLimit } from "../_shared/security.ts";',
          )
          replace_once(
              edge,
              'async function passwordGrant(email: string, password: string): Promise<SupabasePasswordGrant> {',
              'async function passwordGrant(\n  email: string,\n  password: string,\n  captchaToken: string,\n): Promise<SupabasePasswordGrant> {',
          )
          replace_once(
              edge,
              '      body: JSON.stringify({ email, password }),',
              '      body: JSON.stringify({\n        email,\n        password,\n        gotrue_meta_security: { captcha_token: captchaToken },\n      }),',
          )
          replace_once(
              edge,
              '''    if (source.includes("email_not_confirmed") || source.includes("email not confirmed")) {
      throw new EmailTwoFactorError(
        "Confirme seu e-mail antes de entrar. Use o link enviado pela DropBox.",
        403,
        "EMAIL_NOT_CONFIRMED",
      );
    }

    throw new EmailTwoFactorError("E-mail ou senha incorretos.", 401, "INVALID_LOGIN_CREDENTIALS");''',
              '''    if (source.includes("email_not_confirmed") || source.includes("email not confirmed")) {
      throw new EmailTwoFactorError(
        "Confirme seu e-mail antes de entrar. Use o link enviado pela DropBox.",
        403,
        "EMAIL_NOT_CONFIRMED",
      );
    }

    if (source.includes("captcha")) {
      throw new EmailTwoFactorError(
        "A verificação de segurança expirou ou não foi aceita. Faça a verificação novamente.",
        403,
        "EMAIL_2FA_CAPTCHA_REJECTED",
      );
    }

    if (source.includes("api key") || source.includes("apikey") || source.includes("invalid jwt")) {
      throw new EmailTwoFactorError(
        "O acesso à conta está temporariamente indisponível.",
        503,
        "EMAIL_2FA_AUTH_CONFIGURATION_ERROR",
      );
    }

    throw new EmailTwoFactorError("E-mail ou senha incorretos.", 401, "INVALID_LOGIN_CREDENTIALS");''',
          )
          replace_once(
              edge,
              '''  const email = normalizeEmail(body.email);
  const password = normalizePassword(body.password);
  if (!email || !password) {
    throw new EmailTwoFactorError("Informe e-mail e senha.", 400, "EMAIL_2FA_LOGIN_INPUT_INVALID");
  }

  const grant = await passwordGrant(email, password);''',
              '''  const email = normalizeEmail(body.email);
  const password = normalizePassword(body.password);
  const captchaToken = typeof body.turnstileToken === "string" ? body.turnstileToken.trim() : "";
  if (!email || !password) {
    throw new EmailTwoFactorError("Informe e-mail e senha.", 400, "EMAIL_2FA_LOGIN_INPUT_INVALID");
  }

  const grant = await passwordGrant(email, password, captchaToken);''',
          )
          replace_once(
              edge,
              '''  const email = normalizeEmail(body.email);
  const password = normalizePassword(body.password);
  const challengeId = typeof body.challengeId === "string" ? body.challengeId : "";''',
              '''  const email = normalizeEmail(body.email);
  const password = normalizePassword(body.password);
  const captchaToken = typeof body.turnstileToken === "string" ? body.turnstileToken.trim() : "";
  const challengeId = typeof body.challengeId === "string" ? body.challengeId : "";''',
          )
          replace_once(
              edge,
              '  const grant = await passwordGrant(email, password);\n  if (grant.user.id !== challenge.user_id) {',
              '  const grant = await passwordGrant(email, password, captchaToken);\n  if (grant.user.id !== challenge.user_id) {',
          )
          replace_once(
              edge,
              '''
      const turnstile = await verifyTurnstile(request, body.turnstileToken, "login");
      if (!turnstile.success) {
        throw new EmailTwoFactorError(
          "Não foi possível confirmar a verificação de segurança. Atualize a página e tente novamente.",
          403,
          "EMAIL_2FA_TURNSTILE_REJECTED",
        );
      }
''',
              '\n',
          )

          auth = Path("src/lib/auth.tsx")
          replace_once(
              auth,
              '''  verifySignInTwoFactor: (
    email: string,
    password: string,
    challengeId: string,
    code: string,
  ) => Promise<AuthActionResult>;''',
              '''  verifySignInTwoFactor: (
    email: string,
    password: string,
    challengeId: string,
    code: string,
    turnstileToken?: string | null,
  ) => Promise<AuthActionResult>;''',
          )
          replace_once(
              auth,
              '''  async function verifySignInTwoFactor(
    email: string,
    password: string,
    challengeId: string,
    code: string,
  ): Promise<AuthActionResult> {''',
              '''  async function verifySignInTwoFactor(
    email: string,
    password: string,
    challengeId: string,
    code: string,
    turnstileToken?: string | null,
  ): Promise<AuthActionResult> {''',
          )
          replace_once(
              auth,
              '''        body: {
          email: email.trim(),
          password,
          challengeId,
          code: code.trim(),
        },''',
              '''        body: {
          email: email.trim(),
          password,
          challengeId,
          code: code.trim(),
          ...(turnstileToken ? { turnstileToken } : {}),
        },''',
          )

          login = Path("src/routes/login.tsx")
          replace_once(
              login,
              '''    } else if (result.requiresTwoFactor) {
      setChallengeId(result.challengeId ?? "");
      setMaskedEmail(result.maskedEmail ?? email.trim());
      setChallengeExpiresAt(result.expiresAt ?? "");
      setSecurityCode("");
    }''',
              '''    } else if (result.requiresTwoFactor) {
      setTurnstileToken(null);
      setTurnstileResetKey((value) => value + 1);
      setChallengeId(result.challengeId ?? "");
      setMaskedEmail(result.maskedEmail ?? email.trim());
      setChallengeExpiresAt(result.expiresAt ?? "");
      setSecurityCode("");
    }''',
          )
          replace_once(
              login,
              '''    if (verifyingCode || !challengeId) return;

    const normalizedCode = securityCode.replace(/\\D/g, "").slice(0, 6);''',
              '''    if (verifyingCode || !challengeId) return;
    if (turnstileRequired && !turnstileToken) {
      setErrorMessage("Conclua a verificação de segurança para continuar.");
      return;
    }

    const normalizedCode = securityCode.replace(/\\D/g, "").slice(0, 6);''',
          )
          replace_once(
              login,
              '''      challengeId,
      normalizedCode,
    );

    if (error) setErrorMessage(error.message);''',
              '''      challengeId,
      normalizedCode,
      turnstileToken,
    );

    if (error) {
      setErrorMessage(error.message);
      setTurnstileToken(null);
      setTurnstileResetKey((value) => value + 1);
    }''',
          )
          replace_once(
              login,
              '''    setSecurityCode("");
    setErrorMessage("");
  }''',
              '''    setSecurityCode("");
    setTurnstileToken(null);
    setTurnstileResetKey((value) => value + 1);
    setErrorMessage("");
  }''',
          )
          replace_once(
              login,
              '''          <p className="mt-2 text-xs leading-5 text-gray-400">
            {expiresLabel
              ? `Este código expira por volta de ${expiresLabel}.`
              : "O código expira em 10 minutos."}
          </p>

          {errorMessage ? (''',
              '''          <p className="mt-2 text-xs leading-5 text-gray-400">
            {expiresLabel
              ? `Este código expira por volta de ${expiresLabel}.`
              : "O código expira em 10 minutos."}
          </p>

          <div className="mt-4">
            <TurnstileWidget
              action="login"
              onTokenChange={setTurnstileToken}
              resetKey={turnstileResetKey}
            />
          </div>

          {errorMessage ? (''',
          )
          replace_once(
              login,
              '            disabled={verifyingCode || securityCode.length !== 6}',
              '            disabled={\n              verifyingCode ||\n              securityCode.length !== 6 ||\n              (turnstileRequired && !turnstileToken)\n            }',
          )
          PY
      - name: Format hotfix
        run: bunx prettier --write supabase/functions/auth-email-2fa/index.ts src/lib/auth.tsx src/routes/login.tsx
      - name: Validate storefront
        run: |
          bun run lint
          bun run build
      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add supabase/functions/auth-email-2fa/index.ts src/lib/auth.tsx src/routes/login.tsx
          git commit -m "fix: forward Turnstile token through password login"
          git push origin HEAD:main
