name: Deploy Financial Dashboard

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-financial-dashboard.yml"
      - "scripts/deploy-financial-dashboard.mjs"
      - "supabase/migrations/20260913174500_financial_dashboard.sql"
      - "supabase/migrations/20260913181500_financial_dashboard_security_hardening.sql"
      - "supabase/migrations/20260913204500_fix_financial_dashboard_payment_status_type.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-financial-dashboard-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate financial dashboard contract
        run: node scripts/validate-financial-dashboard.mjs

      - name: Deploy financial database state
        run: node scripts/deploy-financial-dashboard.mjs
