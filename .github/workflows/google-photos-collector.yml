name: Google Photos Catalog Collector

on:
  workflow_dispatch:
    inputs:
      album_url:
        description: "URL publica do album Google Photos"
        required: true
        type: string
      label:
        description: "Rotulo do lote"
        required: false
        type: string
      expected_min_images:
        description: "Minimo esperado de imagens"
        required: false
        default: "1"
        type: string
      max_scrolls:
        description: "Limite maximo de ciclos de rolagem"
        required: false
        default: "350"
        type: string

permissions:
  contents: read

concurrency:
  group: google-photos-collector-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate input
        shell: bash
        env:
          ALBUM_URL: ${{ inputs.album_url }}
          LABEL: ${{ inputs.label }}
          EXPECTED_MIN_IMAGES: ${{ inputs.expected_min_images }}
          MAX_SCROLLS: ${{ inputs.max_scrolls }}
        run: |
          set -euo pipefail
          test -n "$ALBUM_URL"
          echo "ALBUM_URL=$ALBUM_URL" >> "$GITHUB_ENV"
          echo "LABEL=$LABEL" >> "$GITHUB_ENV"
          echo "EXPECTED_MIN_IMAGES=${EXPECTED_MIN_IMAGES:-1}" >> "$GITHUB_ENV"
          echo "MAX_SCROLLS=${MAX_SCROLLS:-350}" >> "$GITHUB_ENV"

      - name: Validate collector code
        run: node --check scripts/google-photos-collector.mjs

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@latest
          npx playwright install --with-deps chromium

      - name: Collect Google Photos album
        shell: bash
        run: |
          set -euo pipefail
          node scripts/google-photos-collector.mjs \
            --url "$ALBUM_URL" \
            --label "$LABEL" \
            --expected-min-images "$EXPECTED_MIN_IMAGES" \
            --max-scrolls "$MAX_SCROLLS" \
            --out .artifacts/google-photos-collector

      - name: Summarize collector result
        if: always()
        shell: bash
        run: |
          if [[ -f .artifacts/google-photos-collector/collector.json ]]; then
            node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('.artifacts/google-photos-collector/collector.json','utf8'));
          console.log(`COLLECTOR_SUMMARY productImages=${r.stats.productImages} titles=${r.stats.titles} groups=${r.stats.groups} ungrouped=${r.stats.ungrouped} mediaObserved=${r.stats.mediaObserved}`);
          for (const g of r.groups || []) console.log(`GROUP: ${g.title} -> ${g.images.length}`);
          NODE
          fi

      - name: Upload collector artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-photos-collector-${{ github.run_id }}
          path: .artifacts/google-photos-collector/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
