name: Google Photos Catalog Collector

on:
  workflow_dispatch:
    inputs:
      album_url:
        description: "URL publica do album Google Photos"
        required: true
        type: string
      label:
        description: "Rotulo do lote"
        required: false
        type: string
      expected_min_images:
        description: "Minimo esperado de imagens"
        required: false
        default: "1"
        type: string
      max_scrolls:
        description: "Limite maximo de ciclos de rolagem"
        required: false
        default: "350"
        type: string
  push:
    branches:
      - google-photos-visual-assimilation-20260909
    paths:
      - ".github/workflows/google-photos-collector.yml"
      - "scripts/google-photos-assimilator.mjs"

permissions:
  contents: read

concurrency:
  group: google-photos-collector-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Resolve input
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ALBUM_URL: ${{ inputs.album_url }}
          INPUT_LABEL: ${{ inputs.label }}
          INPUT_EXPECTED_MIN_IMAGES: ${{ inputs.expected_min_images }}
          INPUT_MAX_SCROLLS: ${{ inputs.max_scrolls }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            ALBUM_URL="$INPUT_ALBUM_URL"
            LABEL="$INPUT_LABEL"
            EXPECTED_MIN_IMAGES="${INPUT_EXPECTED_MIN_IMAGES:-1}"
            MAX_SCROLLS="${INPUT_MAX_SCROLLS:-350}"
          else
            ALBUM_URL="https://photos.google.com/share/AF1QipMB9TskKUor2S7eVlJL0wnAqKc2QT8Tb3qNuzwbQuEOQVMfDzQTlk9sakc2K_Mb_w?key=cE9zZTcyYWtQYmFVdGlGaTFBazllR0JucDRQN3N3"
            LABEL="TOP 10 LANCAMENTOS"
            EXPECTED_MIN_IMAGES="50"
            MAX_SCROLLS="220"
          fi
          test -n "$ALBUM_URL"
          echo "ALBUM_URL=$ALBUM_URL" >> "$GITHUB_ENV"
          echo "LABEL=$LABEL" >> "$GITHUB_ENV"
          echo "EXPECTED_MIN_IMAGES=$EXPECTED_MIN_IMAGES" >> "$GITHUB_ENV"
          echo "MAX_SCROLLS=$MAX_SCROLLS" >> "$GITHUB_ENV"

      - name: Validate collector code
        run: |
          node --check scripts/google-photos-collector.mjs
          node --check scripts/google-photos-assimilator.mjs

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@latest
          npx playwright install --with-deps chromium

      - name: Collect Google Photos album
        shell: bash
        run: |
          set -euo pipefail
          node scripts/google-photos-collector.mjs \
            --url "$ALBUM_URL" \
            --label "$LABEL" \
            --expected-min-images "$EXPECTED_MIN_IMAGES" \
            --max-scrolls "$MAX_SCROLLS" \
            --out .artifacts/google-photos-collector

      - name: Generate visual assimilation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/google-photos-assimilator.mjs \
            --input .artifacts/google-photos-collector/collector.json \
            --out .artifacts/google-photos-collector/assimilation

      - name: Summarize collector result
        if: always()
        shell: bash
        run: |
          if [[ -f .artifacts/google-photos-collector/collector.json ]]; then
            node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('.artifacts/google-photos-collector/collector.json','utf8'));
          console.log(`COLLECTOR_SUMMARY productImages=${r.stats.productImages} titles=${r.stats.titles} groups=${r.stats.groups} ungrouped=${r.stats.ungrouped} mediaObserved=${r.stats.mediaObserved}`);
          NODE
          fi
          if [[ -f .artifacts/google-photos-collector/assimilation/assimilation.json ]]; then
            node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('.artifacts/google-photos-collector/assimilation/assimilation.json','utf8'));
          console.log(`ASSIMILATION_SUMMARY groups=${a.stats.groups} productImages=${a.stats.productImages} proposedBaseProducts=${a.stats.proposedBaseProducts} contactSheets=${a.stats.contactSheets} failures=${a.stats.contactSheetsWithImageFailures}`);
          for (const g of a.groups || []) console.log(`ASSIMILATED: ${g.title} -> entity=${g.proposal.entity || '-'} model=${g.proposal.model || '-'} version=${g.proposal.version || '-'} images=${g.imageCount}`);
          NODE
          fi

      - name: Upload collector artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-photos-collector-${{ github.run_id }}
          path: .artifacts/google-photos-collector/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
