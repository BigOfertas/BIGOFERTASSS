name: Inspect Supabase Migration History

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-supabase-migrations.yml"
      - "scripts/inspect-supabase-migration-history.mjs"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Inspect migration history without changing database
        run: node scripts/inspect-supabase-migration-history.mjs
