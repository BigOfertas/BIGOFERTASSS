name: Validate Brand Assets PR

on:
  push:
    branches:
      - fix-brand-assets-20260912

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate rebrand contract
        run: node scripts/validate-brand-identity.mjs && node scripts/validate-stage3-rebrand.mjs

      - name: Build storefront
        run: bun run build
