name: Validate Auth Account Redesign

on:
  push:
    branches:
      - auth-account-sport-redesign-20260911

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate storefront customer experience
        run: node scripts/validate-storefront-upgrades.mjs && node scripts/validate-storefront-regressions.mjs && node scripts/validate-stage2-commerce.mjs && node scripts/validate-final-storefront-refinements.mjs

      - name: Validate affiliate referral backend
        run: bun run validate:affiliate

      - name: Lint storefront
        run: bun run lint

      - name: Validate TypeScript and production build
        run: bun run build
