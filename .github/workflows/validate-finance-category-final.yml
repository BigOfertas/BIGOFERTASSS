name: Validate Finance Category Final

on:
  push:
    branches:
      - finance-category-bulk-20260913
    paths:
      - ".github/workflows/validate-finance-category-final.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: finance-category-bulk-20260913
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Validate finance category scenarios
        run: node scripts/validate-finance-category-bulk.mjs
      - name: Validate existing finance dashboard
        run: node scripts/validate-financial-dashboard.mjs
      - name: Validate deployment script syntax and migration wiring
        run: |
          node --check scripts/deploy-financial-dashboard.mjs
          grep -Fq '20260913210000_finance_category_bulk.sql' scripts/deploy-financial-dashboard.mjs
          grep -Fq '20260913211500_finance_category_bulk_consistency.sql' scripts/deploy-financial-dashboard.mjs
          grep -Fq 'finance_category_bulk_20260913' scripts/deploy-financial-dashboard.mjs
          grep -Fq 'finance_category_bulk_consistency_20260913' scripts/deploy-financial-dashboard.mjs
          grep -Fq 'v.commercial_type IS NULL' supabase/migrations/20260913211500_finance_category_bulk_consistency.sql
          ! grep -Eq 'UPDATE public\.order_items|DELETE FROM public\.order_items|UPDATE public\.orders([[:space:]]|$)' supabase/migrations/2026091321*.sql
      - name: Lint
        run: bun run lint
      - name: Build application
        run: bun run build
      - name: Validate definitive order core
        run: bun run validate:phase10
      - name: Build Hostinger artifact without publishing
        run: bun run build:hostinger
