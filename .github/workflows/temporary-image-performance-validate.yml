name: Temporary Image Performance Validate

on:
  push:
    branches:
      - image-loading-performance-20260911
    paths:
      - ".github/workflows/temporary-image-performance-validate.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout performance branch
        uses: actions/checkout@v7
        with:
          ref: image-loading-performance-20260911

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format touched files
        run: |
          bunx prettier --write \
            src/lib/product-images.ts \
            src/lib/catalog.ts \
            src/lib/home-launches.ts \
            src/components/product/ProductCard.tsx \
            src/components/product/CatalogProductGrid.tsx \
            src/components/product/ProductGallery.tsx \
            src/components/home/BestSellers.tsx \
            src/routes/index.tsx \
            src/routes/__root.tsx \
            supabase/functions/_shared/r2.ts \
            supabase/functions/r2-image-presign/index.ts \
            supabase/functions/site-asset-presign/index.ts \
            scripts/validate-image-loading-performance.mjs \
            scripts/validate-stage1-ux.mjs

      - name: Validate image performance rules
        run: node scripts/validate-image-loading-performance.mjs

      - name: Validate prior storefront regressions
        run: node scripts/validate-stage1-ux.mjs && node scripts/validate-stage2-commerce.mjs

      - name: Lint storefront
        run: bun run lint

      - name: Validate application build
        run: bun run build

      - name: Validate Hostinger prerender build
        run: bun run build:hostinger

      - name: Verify homepage products are present before hydration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          html = Path("dist/client/index.html").read_text(encoding="utf-8")
          checks = {
              "product_cards": html.count("data-product-card"),
              "srcset": html.lower().count("srcset="),
              "product_links": html.count("/product/"),
              "high_priority": html.lower().count("fetchpriority"),
              "google_images": html.count("googleusercontent.com"),
              "r2_images": html.count("img.bigofertas.net"),
          }
          print("PRERENDER_IMAGE_MARKUP", checks)
          if checks["product_cards"] < 1:
              raise SystemExit("No prerendered product cards found")
          if checks["srcset"] < 1:
              raise SystemExit("No responsive srcset found in prerendered homepage")
          if checks["product_links"] < 1:
              raise SystemExit("No prerendered product links found")
          print("HOMEPAGE_PRODUCT_IMAGES_PRERENDERED")
          PY

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add \
            src/lib/product-images.ts \
            src/lib/catalog.ts \
            src/lib/home-launches.ts \
            src/components/product/ProductCard.tsx \
            src/components/product/CatalogProductGrid.tsx \
            src/components/product/ProductGallery.tsx \
            src/components/home/BestSellers.tsx \
            src/routes/index.tsx \
            src/routes/__root.tsx \
            supabase/functions/_shared/r2.ts \
            supabase/functions/r2-image-presign/index.ts \
            supabase/functions/site-asset-presign/index.ts \
            scripts/validate-image-loading-performance.mjs \
            scripts/validate-stage1-ux.mjs
          if git diff --cached --quiet; then
            echo "NO_FORMAT_CHANGES"
            exit 0
          fi
          git commit -m "style: format image performance changes"
          git push origin HEAD:image-loading-performance-20260911
