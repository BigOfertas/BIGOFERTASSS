name: Temporary Image Performance Validate

on:
  push:
    branches:
      - image-loading-performance-20260911
    paths:
      - ".github/workflows/temporary-image-performance-validate.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout performance branch
        uses: actions/checkout@v7
        with:
          ref: image-loading-performance-20260911

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format touched files
        run: |
          bunx prettier --write \
            src/lib/product-images.ts \
            src/lib/catalog.ts \
            src/lib/home-launches.ts \
            src/components/product/ProductCard.tsx \
            src/components/product/CatalogProductGrid.tsx \
            src/components/product/ProductGallery.tsx \
            src/components/home/BestSellers.tsx \
            src/routes/index.tsx \
            src/routes/__root.tsx \
            supabase/functions/_shared/r2.ts \
            supabase/functions/r2-image-presign/index.ts \
            supabase/functions/site-asset-presign/index.ts \
            scripts/generate-home-launches-static.mjs \
            scripts/inject-home-image-preload.mjs \
            scripts/validate-image-loading-performance.mjs \
            scripts/validate-stage1-ux.mjs \
            package.json

      - name: Validate image performance rules
        run: node scripts/validate-image-loading-performance.mjs

      - name: Validate prior storefront regressions
        run: node scripts/validate-stage1-ux.mjs && node scripts/validate-stage2-commerce.mjs

      - name: Lint storefront
        run: bun run lint

      - name: Validate application build
        run: bun run build

      - name: Validate Hostinger build and early product image preload
        run: bun run build:hostinger

      - name: Verify homepage image starts before JavaScript discovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          html_path = Path("dist/client/index.html")
          metadata_path = Path(".tmp/home-product-image-preload.json")
          generated_path = Path("src/generated/home-launches.ts")

          if not html_path.is_file():
              raise SystemExit("Hostinger index.html was not generated")
          if not metadata_path.is_file():
              raise SystemExit("Homepage product image preload metadata was not generated")
          if not generated_path.is_file():
              raise SystemExit("Homepage launch snapshot source was not generated")

          html = html_path.read_text(encoding="utf-8")
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          generated = generated_path.read_text(encoding="utf-8")

          marker = 'data-home-product-image-preload="true"'
          if html.count(marker) != 1:
              raise SystemExit(f"Expected exactly one early product image preload, found {html.count(marker)}")
          if 'rel="preload"' not in html or 'as="image"' not in html:
              raise SystemExit("Early homepage product image preload is missing rel=preload/as=image")
          if 'fetchpriority="high"' not in html:
              raise SystemExit("Early homepage product image preload is missing high fetch priority")
          if 'imagesizes="' not in html:
              raise SystemExit("Early homepage product image preload is missing responsive sizes")
          if not isinstance(metadata.get("href"), str) or not metadata["href"].startswith("https://"):
              raise SystemExit("Early homepage product image preload href is invalid")
          if metadata["href"].replace("&", "&amp;") not in html:
              raise SystemExit("Generated preload href was not injected into the Hostinger HTML")
          if '"items": [' not in generated or generated.count('"id":') < 1:
              raise SystemExit("Build-time homepage product snapshot is empty")
          if metadata.get("srcSet") and 'imagesrcset="' not in html:
              raise SystemExit("Responsive preload metadata exists but imagesrcset was not injected")

          print(
              "EARLY_HOMEPAGE_IMAGE_PRELOAD_OK",
              {
                  "responsive": bool(metadata.get("srcSet")),
                  "snapshot_products": generated.count('"id":'),
              },
          )
          PY

      - name: Restore generated fallback and commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src/generated/home-launches.ts
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add \
            src/lib/product-images.ts \
            src/lib/catalog.ts \
            src/lib/home-launches.ts \
            src/components/product/ProductCard.tsx \
            src/components/product/CatalogProductGrid.tsx \
            src/components/product/ProductGallery.tsx \
            src/components/home/BestSellers.tsx \
            src/routes/index.tsx \
            src/routes/__root.tsx \
            supabase/functions/_shared/r2.ts \
            supabase/functions/r2-image-presign/index.ts \
            supabase/functions/site-asset-presign/index.ts \
            scripts/generate-home-launches-static.mjs \
            scripts/inject-home-image-preload.mjs \
            scripts/validate-image-loading-performance.mjs \
            scripts/validate-stage1-ux.mjs \
            package.json
          if git diff --cached --quiet; then
            echo "NO_FORMAT_CHANGES"
            exit 0
          fi
          git commit -m "style: format image performance changes"
          git push origin HEAD:image-loading-performance-20260911
