name: Temporary Stage 2 Security Fix

on:
  push:
    branches:
      - stage2-priority-security-fix-20260911
    paths:
      - ".github/workflows/temporary-stage2-security-fix.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v7
        with:
          ref: stage2-priority-security-fix-20260911

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Register incremental security fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/deploy-storefront-upgrade-migrations.mjs")
          text = p.read_text(encoding="utf-8")
          old = '''  [\n    "stage2_storefront_priority_20260911",\n    "supabase/migrations/20260911054000_stage2_storefront_priority.sql",\n  ],\n];'''
          new = '''  [\n    "stage2_storefront_priority_20260911",\n    "supabase/migrations/20260911054000_stage2_storefront_priority.sql",\n  ],\n  [\n    "stage2_storefront_priority_security_fix_20260911",\n    "supabase/migrations/20260911055500_stage2_storefront_priority_security_fix.sql",\n  ],\n];'''
          if old not in text:
              if new not in text:
                  raise SystemExit("migration insertion point not found")
          else:
              p.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Validate final Stage 2 code
        run: |
          bunx prettier --write scripts/deploy-storefront-upgrade-migrations.mjs
          node --check scripts/deploy-storefront-upgrade-migrations.mjs
          node scripts/validate-stage1-ux.mjs
          node scripts/validate-storefront-upgrades.mjs
          node scripts/validate-storefront-regressions.mjs
          node scripts/validate-stage2-commerce.mjs
          bun run lint
          bun run build

      - name: Commit security correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add scripts/deploy-storefront-upgrade-migrations.mjs supabase/migrations/20260911055500_stage2_storefront_priority_security_fix.sql
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: preserve catalog RPC security after priority migration"
          git push origin HEAD:stage2-priority-security-fix-20260911
