name: Format Catalog Business Rules

on:
  push:
    branches:
      - main
    paths:
      - catalog-jobs/format-catalog-business-rules.json

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format affected catalog files
        run: |
          bunx prettier --write \
            scripts/catalog-business-rules.mjs \
            scripts/catalog-import-zip.mjs \
            scripts/deploy-storefront-upgrade-migrations.mjs \
            scripts/google-photos-assimilator.mjs \
            scripts/google-photos-assimilator-runner.mjs \
            scripts/google-photos-collector.mjs \
            scripts/validate-catalog-business-rules.mjs \
            src/components/product/ProductPurchaseOptions.tsx

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "BigOfertas Automation"
          git config user.email "contato@bigofertas.net"
          git add \
            scripts/catalog-business-rules.mjs \
            scripts/catalog-import-zip.mjs \
            scripts/deploy-storefront-upgrade-migrations.mjs \
            scripts/google-photos-assimilator.mjs \
            scripts/google-photos-assimilator-runner.mjs \
            scripts/google-photos-collector.mjs \
            scripts/validate-catalog-business-rules.mjs \
            src/components/product/ProductPurchaseOptions.tsx
          git commit -m "style: format catalog business rule changes"
          git push origin HEAD:main
