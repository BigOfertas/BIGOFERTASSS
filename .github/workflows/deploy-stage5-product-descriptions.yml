name: Deploy Stage 5 Product Descriptions

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Validate Storefront Main
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: deploy-stage5-product-descriptions-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate deployment runner syntax
        run: node --check scripts/deploy-stage5-product-descriptions.mjs

      - name: Audit, apply cleanup and verify descriptions
        run: node scripts/deploy-stage5-product-descriptions.mjs
