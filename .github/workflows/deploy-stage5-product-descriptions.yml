name: Deploy Stage 5 Product Descriptions

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-stage5-product-descriptions.yml"
      - "scripts/deploy-stage5-product-descriptions.mjs"
      - "supabase/migrations/20260914162500_stage5_public_product_descriptions.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stage5-product-descriptions-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate deployment runner syntax
        run: node --check scripts/deploy-stage5-product-descriptions.mjs

      - name: Audit, apply cleanup and verify descriptions
        run: node scripts/deploy-stage5-product-descriptions.mjs
