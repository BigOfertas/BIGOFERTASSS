name: QA Stage 3 Header Production

on:
  push:
    branches:
      - qa-stage3-header-production-20260914

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact published main SHA
        uses: actions/checkout@v7
        with:
          ref: 9dcb0f421aa10ad41bb8579a2caf67b978297bbe

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run production header QA
        env:
          BASE_URL: https://bigofertas.net
        run: |
          mkdir -p qa-shots
          cat > stage3-header-production-qa.mjs <<'JS'
          import { chromium } from 'playwright';

          const BASE_URL = process.env.BASE_URL;
          const EXPECTED_SHA = '9dcb0f421aa10ad41bb8579a2caf67b978297bbe';
          const browser = await chromium.launch({ headless: true });
          const result = {
            production: BASE_URL,
            publishedSha: EXPECTED_SHA,
            viewports: {},
            torcedor: null,
            jogador: null,
            search: {},
            logoClick: null,
            consoleErrors: [],
            pageErrors: [],
            failedRequests: [],
            httpErrors: [],
            catalogRpcBodies: [],
          };

          const expectedCategories = [
            'INÍCIO',
            'TORCEDOR',
            'JOGADOR',
            'FEMININO',
            'KIDS',
            'KITS DE TREINO',
            'SHORTS',
            'BASQUETE / NBA',
            'CORTA-VENTO',
            'MUNDO FIFA',
            'CAMISAS RETRÔ',
          ];

          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          const uniquePush = (array, value) => {
            const key = JSON.stringify(value);
            if (!array.some((item) => JSON.stringify(item) === key)) array.push(value);
          };

          function attachDiagnostics(page, label) {
            page.on('console', (msg) => {
              if (msg.type() === 'error') {
                uniquePush(result.consoleErrors, { label, text: msg.text().slice(0, 1000) });
              }
            });
            page.on('pageerror', (error) => {
              uniquePush(result.pageErrors, { label, text: String(error).slice(0, 1000) });
            });
            page.on('requestfailed', (request) => {
              const url = request.url();
              const error = request.failure()?.errorText ?? 'unknown';
              if (
                (url.includes('bigofertas.net') || url.includes('supabase.co')) &&
                !/ERR_ABORTED/i.test(error)
              ) {
                uniquePush(result.failedRequests, { label, url: url.slice(0, 700), error });
              }
            });
            page.on('response', (response) => {
              const url = response.url();
              if (
                response.status() >= 400 &&
                (url.includes('bigofertas.net') || url.includes('supabase.co'))
              ) {
                uniquePush(result.httpErrors, {
                  label,
                  status: response.status(),
                  url: url.slice(0, 700),
                });
              }
            });
            page.on('request', (request) => {
              const url = request.url();
              if (
                request.method() === 'POST' &&
                url.includes('/rest/v1/rpc/catalog_products_page_v3')
              ) {
                try {
                  const body = request.postDataJSON();
                  result.catalogRpcBodies.push({ label, body });
                } catch {
                  result.catalogRpcBodies.push({ label, body: request.postData() });
                }
              }
            });
          }

          const boxNear = (a, b, tolerance = 0.6) =>
            Boolean(
              a &&
                b &&
                Math.abs(a.x - b.x) <= tolerance &&
                Math.abs(a.y - b.y) <= tolerance &&
                Math.abs(a.width - b.width) <= tolerance &&
                Math.abs(a.height - b.height) <= tolerance,
            );

          async function logoState(page) {
            const link = page.locator('header.glass-header a[aria-label$=" - Início"]:visible').first();
            const lockup = link.locator('.brand-lockup');
            await assertVisible(link, 'logo link');
            const linkBox = await link.boundingBox();
            const lockupBox = await lockup.boundingBox();
            const styles = await lockup.evaluate((el) => {
              const style = getComputedStyle(el);
              return {
                transform: style.transform,
                transitionProperty: style.transitionProperty,
              };
            });
            const linkStyles = await link.evaluate((el) => {
              const style = getComputedStyle(el);
              return {
                transform: style.transform,
                outlineStyle: style.outlineStyle,
                outlineWidth: style.outlineWidth,
                outlineColor: style.outlineColor,
              };
            });
            return { linkBox, lockupBox, styles, linkStyles };
          }

          async function assertVisible(locator, label) {
            assert(await locator.isVisible(), `${label} não está visível`);
          }

          async function headerMetrics(page, width) {
            await page.goto(BASE_URL, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForSelector('header.glass-header', { timeout: 20000 });
            await page.waitForTimeout(250);

            const header = page.locator('header.glass-header');
            const hasPageOverflow = await page.evaluate(
              () => document.documentElement.scrollWidth > window.innerWidth + 2,
            );
            assert(!hasPageOverflow, `${width}px: página possui overflow horizontal`);

            const desktopExpected = width >= 1024;
            const desktopNav = page.locator('nav[aria-label="Categorias"]:visible');
            const mobileMenuButton = page.locator(
              'button[aria-label="Abrir menu de categorias"]:visible',
            );

            if (desktopExpected) {
              await assertVisible(desktopNav, `${width}px: navegação desktop`);
              assert(!(await mobileMenuButton.isVisible()), `${width}px: menu móvel apareceu no desktop`);

              const links = desktopNav.getByRole('link');
              const labels = (await links.allTextContents()).map((text) => text.trim()).filter(Boolean);
              for (const label of expectedCategories) {
                assert(labels.includes(label), `${width}px: categoria ${label} ausente`);
              }
              const navLayout = await desktopNav.locator('ul').evaluate((el) => ({
                scrollWidth: el.scrollWidth,
                clientWidth: el.clientWidth,
              }));
              assert(
                navLayout.scrollWidth <= navLayout.clientWidth + 2,
                `${width}px: categorias exigem rolagem horizontal interna`,
              );
              const categoryStyle = await desktopNav
                .getByRole('link', { name: 'TORCEDOR', exact: true })
                .evaluate((el) => {
                  const s = getComputedStyle(el);
                  return {
                    fontSize: s.fontSize,
                    fontWeight: s.fontWeight,
                    letterSpacing: s.letterSpacing,
                  };
                });
              assert(parseFloat(categoryStyle.fontSize) >= 12, `${width}px: fonte das categorias pequena`);
              assert(Number.parseInt(categoryStyle.fontWeight, 10) >= 800, `${width}px: peso das categorias fraco`);
            } else {
              await assertVisible(mobileMenuButton, `${width}px: botão do menu móvel`);
              assert(!(await desktopNav.isVisible()), `${width}px: navegação desktop deveria estar oculta`);
              await mobileMenuButton.click();
              const menu = page.locator('header.glass-header').getByText('Todas as categorias', { exact: true });
              await assertVisible(menu, `${width}px: menu de categorias aberto`);
              for (const label of expectedCategories) {
                await assertVisible(
                  page.locator('header.glass-header button:visible').filter({ hasText: new RegExp(`^${label.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&')}$`) }).first(),
                  `${width}px: item móvel ${label}`,
                );
              }
              const openOverflow = await page.evaluate(
                () => document.documentElement.scrollWidth > window.innerWidth + 2,
              );
              assert(!openOverflow, `${width}px: menu aberto gera overflow horizontal`);
            }

            const logo = page.locator('header.glass-header a[aria-label$=" - Início"]:visible').first();
            const before = await logoState(page);
            assert(
              before.styles.transform === 'none' || before.styles.transform === 'matrix(1, 0, 0, 1, 0, 0)',
              `${width}px: logo inicia transformada`,
            );

            if (width >= 1024) {
              await logo.hover();
              await page.waitForTimeout(260);
              const hover = await logoState(page);
              assert(boxNear(before.lockupBox, hover.lockupBox), `${width}px: logo mudou no hover`);
              assert(
                hover.styles.transform === 'none' || hover.styles.transform === 'matrix(1, 0, 0, 1, 0, 0)',
                `${width}px: logo recebeu transform no hover`,
              );
            }

            await logo.focus();
            await page.waitForTimeout(80);
            const focused = await logoState(page);
            assert(boxNear(before.lockupBox, focused.lockupBox), `${width}px: logo mudou no focus`);
            assert(
              focused.linkStyles.outlineStyle !== 'none' && parseFloat(focused.linkStyles.outlineWidth) >= 1,
              `${width}px: logo não possui foco visível`,
            );

            await logo.evaluate((el) => el.addEventListener('click', (event) => event.preventDefault(), { once: true }));
            if (width >= 1024) {
              const box = await logo.boundingBox();
              if (box) {
                await page.mouse.move(box.x + box.width / 2, box.y + box.height / 2);
                await page.mouse.down();
                await page.waitForTimeout(80);
                const active = await logoState(page);
                assert(boxNear(before.lockupBox, active.lockupBox), `${width}px: logo mudou no active`);
                await page.mouse.up();
              }
            } else {
              await logo.tap();
              await page.waitForTimeout(80);
              const touched = await logoState(page);
              assert(boxNear(before.lockupBox, touched.lockupBox), `${width}px: logo mudou após toque`);
            }

            const search = page.locator('input[aria-label="Buscar produtos"]:visible').first();
            await assertVisible(search, `${width}px: busca`);
            const searchBeforeBox = await search.boundingBox();
            const searchNormal = await search.evaluate((el) => {
              const s = getComputedStyle(el);
              return {
                borderColor: s.borderColor,
                borderWidth: s.borderWidth,
                backgroundColor: s.backgroundColor,
                backgroundImage: s.backgroundImage,
                boxShadow: s.boxShadow,
                transform: s.transform,
              };
            });
            assert(parseFloat(searchNormal.borderWidth) >= 1, `${width}px: busca sem borda definida`);
            assert(searchNormal.transform === 'none', `${width}px: busca inicia transformada`);

            if (width >= 1024) {
              await search.hover();
              const searchHover = await search.evaluate((el) => ({ borderColor: getComputedStyle(el).borderColor }));
              assert(searchHover.borderColor !== searchNormal.borderColor, `${width}px: busca sem estado hover`);
            }

            await search.focus();
            await page.waitForTimeout(80);
            const searchFocusBox = await search.boundingBox();
            const searchFocus = await search.evaluate((el) => {
              const s = getComputedStyle(el);
              return { borderColor: s.borderColor, boxShadow: s.boxShadow, transform: s.transform };
            });
            assert(boxNear(searchBeforeBox, searchFocusBox), `${width}px: busca sofre layout shift no foco`);
            assert(searchFocus.transform === 'none', `${width}px: busca se move no foco`);
            assert(
              searchFocus.borderColor !== searchNormal.borderColor || searchFocus.boxShadow !== searchNormal.boxShadow,
              `${width}px: foco da busca não está destacado`,
            );

            await page.screenshot({ path: `qa-shots/header-${width}.png`, fullPage: false });

            return {
              mode: desktopExpected ? 'desktop' : 'mobile',
              overflow: false,
              logo: { stable: true, focusVisible: true },
              search: {
                stableOnFocus: true,
                borderNormal: searchNormal.borderColor,
                borderFocus: searchFocus.borderColor,
              },
            };
          }

          async function testStructuredCategory(page, name, commercialType) {
            await page.goto(BASE_URL, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForSelector('nav[aria-label="Categorias"]:visible', { timeout: 20000 });
            const beforeBodies = result.catalogRpcBodies.length;
            await Promise.all([
              page.waitForURL(
                (url) =>
                  url.pathname === '/products' && url.searchParams.get('commercialType') === commercialType,
                { timeout: 25000 },
              ),
              page
                .locator('nav[aria-label="Categorias"]:visible')
                .getByRole('link', { name, exact: true })
                .click(),
            ]);
            await page.waitForSelector('[data-product-card]', { timeout: 25000 });
            await page.waitForTimeout(350);
            const cards = await page.locator('[data-product-card]').count();
            assert(cards > 0, `${name}: listagem real sem produtos`);
            const clickBodies = result.catalogRpcBodies.slice(beforeBodies);
            assert(
              clickBodies.some((entry) => entry.body?.p_commercial_type === commercialType),
              `${name}: clique não enviou p_commercial_type=${commercialType}`,
            );

            const beforeReloadBodies = result.catalogRpcBodies.length;
            await page.reload({ waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForSelector('[data-product-card]', { timeout: 25000 });
            await page.waitForTimeout(350);
            assert(
              new URL(page.url()).searchParams.get('commercialType') === commercialType,
              `${name}: refresh perdeu o filtro`,
            );
            const reloadBodies = result.catalogRpcBodies.slice(beforeReloadBodies);
            assert(
              reloadBodies.some((entry) => entry.body?.p_commercial_type === commercialType),
              `${name}: refresh não reenviou p_commercial_type=${commercialType}`,
            );
            return {
              url: page.url(),
              cards,
              clickRpcStructured: true,
              refreshRpcStructured: true,
            };
          }

          async function testSearchInteraction(page, label) {
            await page.goto(BASE_URL, { waitUntil: 'domcontentloaded', timeout: 45000 });
            const input = page.locator('input[aria-label="Buscar produtos"]:visible').first();
            await assertVisible(input, `${label}: busca interativa`);
            const before = await input.boundingBox();
            await input.fill('Real Madrid');
            await page.waitForTimeout(1000);
            const suggestionSurface = page.locator(
              'text=Ver todos os resultados, text=Nenhum produto encontrado agora., text=Buscando produtos...',
            );
            const suggestionVisible = await suggestionSurface.first().isVisible().catch(() => false);
            assert(suggestionVisible, `${label}: superfície de sugestões não apareceu`);
            const afterType = await input.boundingBox();
            assert(boxNear(before, afterType), `${label}: digitação alterou tamanho da busca`);

            await input.press('Enter');
            await page.waitForURL(
              (url) => url.pathname === '/products' && url.searchParams.get('q') === 'Real Madrid',
              { timeout: 25000 },
            );
            await page.waitForSelector('[data-product-card]', { timeout: 25000 });
            return {
              suggestions: true,
              submittedUrl: page.url(),
              cards: await page.locator('[data-product-card]').count(),
            };
          }

          try {
            for (const width of [1440, 1280, 1024, 768, 390]) {
              const context = await browser.newContext({
                viewport: { width, height: width <= 390 ? 844 : 900 },
                isMobile: width <= 390,
                hasTouch: width <= 768,
              });
              const page = await context.newPage();
              attachDiagnostics(page, `viewport-${width}`);
              result.viewports[String(width)] = await headerMetrics(page, width);

              if (width === 768 || width === 390) {
                await page.goto(BASE_URL, { waitUntil: 'domcontentloaded', timeout: 45000 });
                await page.getByRole('button', { name: 'Abrir menu de categorias' }).click();
                const target = width === 768 ? 'JOGADOR' : 'TORCEDOR';
                const expected = width === 768 ? 'jogador' : 'torcedor';
                await Promise.all([
                  page.waitForURL(
                    (url) =>
                      url.pathname === '/products' && url.searchParams.get('commercialType') === expected,
                    { timeout: 25000 },
                  ),
                  page.locator('header.glass-header button:visible').filter({ hasText: target }).first().click(),
                ]);
                assert(
                  new URL(page.url()).searchParams.get('commercialType') === expected,
                  `${width}px: ${target} móvel não navegou corretamente`,
                );
              }

              if (width === 1440) {
                result.search.desktop = await testSearchInteraction(page, 'desktop');
              }
              if (width === 390) {
                result.search.mobile = await testSearchInteraction(page, 'mobile');
              }
              await context.close();
            }

            const functionalContext = await browser.newContext({ viewport: { width: 1440, height: 900 } });
            const functionalPage = await functionalContext.newPage();
            attachDiagnostics(functionalPage, 'functional-desktop');
            result.torcedor = await testStructuredCategory(functionalPage, 'TORCEDOR', 'torcedor');
            result.jogador = await testStructuredCategory(functionalPage, 'JOGADOR', 'jogador');

            await functionalPage.goto(`${BASE_URL}/products?commercialType=torcedor`, {
              waitUntil: 'domcontentloaded',
              timeout: 45000,
            });
            const logo = functionalPage
              .locator('header.glass-header a[aria-label$=" - Início"]:visible')
              .first();
            await Promise.all([
              functionalPage.waitForURL((url) => url.pathname === '/', { timeout: 20000 }),
              logo.click(),
            ]);
            result.logoClick = { clickable: true, finalUrl: functionalPage.url() };
            await functionalContext.close();

            const relevantConsole = result.consoleErrors.filter(({ text }) =>
              /hydration|cors|rpc|failed to fetch|uncaught|typeerror|referenceerror|syntaxerror/i.test(text),
            );
            result.relevantDiagnostics = {
              consoleErrors: relevantConsole,
              pageErrors: result.pageErrors,
              failedRequests: result.failedRequests,
              httpErrors: result.httpErrors,
            };

            console.log('STAGE3_HEADER_PRODUCTION_QA_RESULT=' + JSON.stringify(result));
            assert(relevantConsole.length === 0, 'Console contém erros relevantes');
            assert(result.pageErrors.length === 0, 'Page errors encontrados');
            assert(result.failedRequests.length === 0, 'Requests relevantes falharam');
            assert(result.httpErrors.length === 0, 'Respostas 4xx/5xx relevantes encontradas');
            console.log('STAGE3_HEADER_PRODUCTION_QA_OK');
          } finally {
            await browser.close();
          }
          JS
          node ./stage3-header-production-qa.mjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-header-production-qa-shots
          path: qa-shots/*.png
          if-no-files-found: ignore
