name: Collect Kids First Batch Once

on:
  push:
    branches:
      - catalog-kids-first-deploy-20260909
    paths:
      - catalog-jobs/collect-kids-first.json

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@latest
          npx playwright install --with-deps chromium

      - name: Collect Kids album
        run: |
          node scripts/google-photos-collector.mjs \
            --url "https://photos.google.com/share/AF1QipNzO9O14qDltaCwg-UrQmxIq_u9erocoR2-_93SdGTwGUZes9-KnHLEDRkoTE3vmw?key=YnItTlYydGhJVi0yVmswZVFCWDJkdm5RMHRVRnl3" \
            --label "conjuntos-infantis-kids" \
            --expected-min-images "1" \
            --max-scrolls "500" \
            --out .artifacts/kids

      - name: Assimilate Kids album
        run: |
          node scripts/google-photos-assimilator-runner.mjs \
            --input .artifacts/kids/collector.json \
            --out .artifacts/kids/assimilation

      - name: Build and validate Kids plan
        run: |
          node scripts/google-photos-catalog-pipeline.mjs \
            --collector .artifacts/kids/collector.json \
            --assimilation .artifacts/kids/assimilation/assimilation.json \
            --report .artifacts/kids/catalog-pipeline-plan.json \
            --validate-urls \
            --stock 999

      - name: Guard Kids classification
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const plan = JSON.parse(fs.readFileSync('.artifacts/kids/catalog-pipeline-plan.json', 'utf8'));
          if (!Array.isArray(plan.products) || plan.products.length === 0) throw new Error('KIDS_NO_PRODUCTS');
          if (plan.products.some((p) => p.category?.slug !== 'infantil')) throw new Error('KIDS_CATEGORY_MISMATCH');
          if (plan.products.some((p) => p.commercialType !== 'infantil')) throw new Error('KIDS_COMMERCIAL_TYPE_MISMATCH');
          if (plan.products.some((p) => Math.abs(Number(p.price) - 169.9) > 0.001)) throw new Error('KIDS_PRICE_MISMATCH');
          if (plan.products.some((p) => !Array.isArray(p.variants) || p.variants.length < 1)) throw new Error('KIDS_VARIANT_MISSING');
          const imageCount = plan.products.reduce((sum, p) => sum + p.variants.reduce((inner, v) => inner + v.images.length, 0), 0);
          if (imageCount < plan.products.length) throw new Error('KIDS_IMAGE_COUNT_TOO_LOW');
          console.log(`KIDS_PLAN_OK products=${plan.products.length} variants=${plan.summary.variants} images=${imageCount}`);
          for (const product of plan.products) {
            console.log(`KIDS_PRODUCT ${product.name} | variants=${product.variants.length} | price=${product.price} | category=${product.category.slug}`);
          }
          NODE

      - name: Upload Kids evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-first-batch-${{ github.run_id }}
          path: .artifacts/kids/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
