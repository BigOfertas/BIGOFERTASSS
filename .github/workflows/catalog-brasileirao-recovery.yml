name: Catalog Campeonato Brasileiro Recovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/catalog-brasileirao-recovery.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: catalog-brasileirao-recovery-v2
  cancel-in-progress: false

env:
  ORIGINAL_RUN_ID: "34505064261"

jobs:
  recover-missing:
    name: recover-${{ matrix.slug }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "15"
            manifest_index: "14"
            slug: gremio
            expected_name: Grêmio
          - id: "16"
            manifest_index: "15"
            slug: internacional
            expected_name: Internacional
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Playwright robustly
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@latest
          for source in /etc/apt/sources.list.d/*; do
            if [[ -f "$source" ]] && grep -q "packages.microsoft.com/ubuntu/24.04/prod" "$source"; then
              sudo sed -i 's/^[[:space:]]*deb /# deb /' "$source"
            fi
          done
          npx playwright install --with-deps chromium || {
            sleep 10
            npx playwright install --with-deps chromium
          }
      - name: Resolve club album
        id: album
        env:
          MANIFEST_INDEX: ${{ matrix.manifest_index }}
          EXPECTED_NAME: ${{ matrix.expected_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('catalog-jobs/pdf-groups/brasileirao.json', 'utf8'));
          const album = manifest.albums?.[Number(process.env.MANIFEST_INDEX)];
          if (!album || album.name !== process.env.EXPECTED_NAME) {
            throw new Error(`Álbum inesperado: ${album?.name ?? 'ausente'}; esperado ${process.env.EXPECTED_NAME}.`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${album.name}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${album.url}\n`);
          NODE
      - name: Collect complete club album
        env:
          ALBUM_URL: ${{ steps.album.outputs.url }}
          ALBUM_NAME: ${{ steps.album.outputs.name }}
          PLAN_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          OUT=".artifacts/brasileirao/${PLAN_ID}"
          timeout 12m node scripts/google-photos-collector.mjs \
            --url "$ALBUM_URL" \
            --label "CAMPEONATO BRASILEIRO - $ALBUM_NAME" \
            --out "$OUT" \
            --expected-min-images 1 \
            --max-scrolls 350
      - name: Assimilate and normalize club products
        env:
          ALBUM_NAME: ${{ steps.album.outputs.name }}
          PLAN_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          OUT=".artifacts/brasileirao/${PLAN_ID}"
          node scripts/google-photos-assimilator-runner.mjs \
            --input "$OUT/collector.json" \
            --out "$OUT/assimilation"
          node scripts/catalog-brasileirao-assimilation-filter.mjs \
            --input "$OUT/assimilation/assimilation.json" \
            --output "$OUT/assimilation/brasileirao-filtered.json" \
            --report "$OUT/scope-filter.json"
          node scripts/google-photos-catalog-pipeline.mjs \
            --collector "$OUT/collector.json" \
            --assimilation "$OUT/assimilation/brasileirao-filtered.json" \
            --report "$OUT/raw-plan.json" \
            --validate-urls
          node scripts/catalog-brasileirao-plan.mjs \
            --input "$OUT/raw-plan.json" \
            --output "$OUT/plan.json" \
            --source-group "$ALBUM_NAME"
      - name: Upload recovered club plan
        uses: actions/upload-artifact@v4
        with:
          name: brasileirao-plan-${{ matrix.id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            .artifacts/brasileirao/${{ matrix.id }}/collector.json
            .artifacts/brasileirao/${{ matrix.id }}/groups.json
            .artifacts/brasileirao/${{ matrix.id }}/assimilation/assimilation.json
            .artifacts/brasileirao/${{ matrix.id }}/assimilation/brasileirao-filtered.json
            .artifacts/brasileirao/${{ matrix.id }}/assimilation/overview.png
            .artifacts/brasileirao/${{ matrix.id }}/scope-filter.json
            .artifacts/brasileirao/${{ matrix.id }}/raw-plan.json
            .artifacts/brasileirao/${{ matrix.id }}/plan.json

  publish:
    needs: recover-missing
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download original audited plans
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ORIGINAL_RUN_ID }}
          pattern: brasileirao-plan-*
          path: .artifacts/brasileirao/original
          merge-multiple: false
      - name: Download recovered missing plans
        uses: actions/download-artifact@v6
        with:
          pattern: brasileirao-plan-*
          path: .artifacts/brasileirao/recovered
          merge-multiple: false
      - name: Assemble and assert all 30 audited plans
        run: |
          set -euo pipefail
          mkdir -p .artifacts/brasileirao/downloaded
          if compgen -G '.artifacts/brasileirao/original/brasileirao-plan-*' > /dev/null; then
            cp -a .artifacts/brasileirao/original/brasileirao-plan-* .artifacts/brasileirao/downloaded/
          fi
          cp -a .artifacts/brasileirao/recovered/brasileirao-plan-15 .artifacts/brasileirao/downloaded/
          cp -a .artifacts/brasileirao/recovered/brasileirao-plan-16 .artifacts/brasileirao/downloaded/
          for n in $(seq -w 1 30); do
            test -f ".artifacts/brasileirao/downloaded/brasileirao-plan-${n}/plan.json" || {
              echo "Plano ausente: brasileirao-plan-${n}" >&2
              exit 1
            }
          done
          echo "BRASILEIRAO_30_PLANS_READY"
      - name: Merge plans in PDF order
        run: |
          node scripts/catalog-merge-brasileirao-plans.mjs \
            --manifest catalog-jobs/pdf-groups/brasileirao.json \
            --root .artifacts/brasileirao/downloaded \
            --output .artifacts/brasileirao/merged-plan.json
      - name: Snapshot protected business data
        run: |
          node scripts/catalog-batch-guard.mjs snapshot \
            --out .artifacts/brasileirao/protected-before.json
      - id: reconcile
        name: Reconcile products already registered
        run: |
          node scripts/catalog-reconcile-existing-club-products.mjs \
            --input .artifacts/brasileirao/merged-plan.json \
            --output .artifacts/brasileirao/reconciled-plan.json \
            --report .artifacts/brasileirao/existing-products.json
          AMBIGUOUS=$(node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('.artifacts/brasileirao/existing-products.json')); process.stdout.write(String(r.skipped.filter((x) => x.reason === 'ambiguous_existing_match').length));")
          if [[ "$AMBIGUOUS" != "0" ]]; then
            echo "Há $AMBIGUOUS correspondência(s) ambígua(s) com o catálogo atual." >&2
            exit 1
          fi
          COUNT=$(node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('.artifacts/brasileirao/reconciled-plan.json')); process.stdout.write(String(p.products.length));")
          echo "product_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "BRASILEIRAO_RECONCILED_COUNT=$COUNT"
      - name: Publish Campeonato Brasileiro atomically
        if: steps.reconcile.outputs.product_count != '0'
        run: |
          node scripts/apply-normalized-catalog-plan.mjs \
            --plan .artifacts/brasileirao/reconciled-plan.json \
            --stock 999
      - name: Verify exact database result and protected data
        if: steps.reconcile.outputs.product_count != '0'
        run: |
          node scripts/catalog-batch-guard.mjs verify \
            --snapshot .artifacts/brasileirao/protected-before.json \
            --plan .artifacts/brasileirao/reconciled-plan.json \
            --out .artifacts/brasileirao/batch-verification.json
      - name: Verify all 30 Brazilian clubs in production
        run: |
          node scripts/catalog-brasileirao-production-guard.mjs \
            --manifest catalog-jobs/pdf-groups/brasileirao.json \
            --output .artifacts/brasileirao/production-verification.json
      - name: Install Playwright for live verification
        if: steps.reconcile.outputs.product_count != '0'
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@latest
          for source in /etc/apt/sources.list.d/*; do
            if [[ -f "$source" ]] && grep -q "packages.microsoft.com/ubuntu/24.04/prod" "$source"; then
              sudo sed -i 's/^[[:space:]]*deb /# deb /' "$source"
            fi
          done
          npx playwright install --with-deps chromium || {
            sleep 10
            npx playwright install --with-deps chromium
          }
      - name: Verify live storefront product samples
        if: steps.reconcile.outputs.product_count != '0'
        run: |
          node scripts/catalog-batch-public-verify.mjs \
            --verification .artifacts/brasileirao/batch-verification.json \
            --base-url https://bigofertas.net \
            --launch-count 10
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brasileirao-production-recovery-v2
          retention-days: 30
          if-no-files-found: warn
          path: |
            .artifacts/brasileirao/merged-plan.json
            .artifacts/brasileirao/reconciled-plan.json
            .artifacts/brasileirao/existing-products.json
            .artifacts/brasileirao/protected-before.json
            .artifacts/brasileirao/batch-verification.json
            .artifacts/brasileirao/production-verification.json
