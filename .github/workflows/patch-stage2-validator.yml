name: Validate Stage 2 Size Guidance Gate Fix

on:
  push:
    branches:
      - fix-stage2-size-guidance-validator-20260914

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix-stage2-size-guidance-validator-20260914

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate storefront upgrades and dynamic size guidance
        run: node scripts/validate-storefront-upgrades.mjs && bun scripts/validate-size-guidance.ts

      - name: Validate remaining storefront regressions
        run: node scripts/validate-storefront-regressions.mjs && node scripts/validate-stage2-commerce.mjs && node scripts/validate-final-storefront-refinements.mjs

      - name: Lint storefront
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Hostinger build without publish
        run: bun run build:hostinger

      - name: Validate definitive order core
        run: bun run validate:phase10
