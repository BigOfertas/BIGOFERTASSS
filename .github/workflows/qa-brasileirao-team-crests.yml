name: QA Brasileirao Team Crests

on:
  push:
    branches:
      - brasileirao-team-crests-20260917

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Brazilian team crest contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o 'spriteIndex:' src/components/home/BrazilianTeams.tsx | wc -l)" -eq 11
          grep -Fq 'Array.from({ length: 19 }' src/components/home/BrazilianTeams.tsx
          grep -Fq 'data-team-slot-count={TOTAL_TEAM_SLOTS}' src/components/home/BrazilianTeams.tsx
          grep -Fq 'search={{ time: team.id }}' src/components/home/BrazilianTeams.tsx
          grep -Fq 'search={{ campeonato: "brasileirao", sort: "featured" }}' src/components/home/BrazilianTeams.tsx
          grep -Fq 'ChevronLeft' src/components/home/BrazilianTeams.tsx
          grep -Fq 'ChevronRight' src/components/home/BrazilianTeams.tsx
          grep -Fq 'overflow-x-auto' src/components/home/BrazilianTeams.tsx
          node - <<'NODE'
          const fs = require('fs');
          const files = Array.from({length: 6}, (_, i) => `src/assets/teams/brasileirao-sprite-parts/part${i + 1}.ts`);
          const chunks = files.map((file) => {
            const source = fs.readFileSync(file, 'utf8');
            const match = source.match(/^export default "([A-Za-z0-9+/=]+)";\s*$/);
            if (!match) throw new Error(`invalid sprite part: ${file}`);
            return match[1];
          });
          const buffer = Buffer.from(chunks.join(''), 'base64');
          if (buffer.toString('ascii', 0, 4) !== 'RIFF' || buffer.toString('ascii', 8, 12) !== 'WEBP') {
            throw new Error('combined sprite is not a WEBP');
          }
          if (buffer.length < 50000) throw new Error(`sprite unexpectedly small: ${buffer.length}`);
          console.log(`BRAZILIAN_TEAM_CRESTS_OK slots=30 real=11 reserved=19 sprite_bytes=${buffer.length}`);
          NODE

      - name: Lint
        run: bun run lint

      - name: TypeScript and production build
        run: bun run build
