name: Apply Abuse Protection

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-abuse-protection.yml"
      - "scripts/apply-abuse-protection.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-abuse-protection-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply security patches
        run: node scripts/apply-abuse-protection.mjs

      - name: Commit patched functions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/checkout-start/index.ts supabase/functions/shipping-quote/index.ts supabase/functions/auth-email-2fa/index.ts
          if git diff --cached --quiet; then
            echo "No security patch changes to commit."
            exit 0
          fi
          git commit -m "security: enforce edge rate limits"
          git push origin HEAD:main
