name: Apply Abuse Protection

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-abuse-protection.yml"
      - "scripts/apply-turnstile-frontend.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-abuse-protection-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply Turnstile frontend patches
        run: node scripts/apply-turnstile-frontend.mjs

      - name: Commit patched frontend
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/auth.tsx src/routes/login.tsx src/routes/cadastro.tsx src/routes/esqueci-senha.tsx
          if git diff --cached --quiet; then
            echo "No Turnstile frontend changes to commit."
            exit 0
          fi
          git commit -m "security: wire Turnstile into auth flows"
          git push origin HEAD:main
