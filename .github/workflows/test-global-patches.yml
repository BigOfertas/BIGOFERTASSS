name: Test Global Patch Matrix

on:
  push:
    branches:
      - catalog-global-patches-20260909

permissions:
  contents: read

concurrency:
  group: test-global-patches
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate catalog business rules
        run: node scripts/validate-catalog-business-rules.mjs

      - name: Check formatting
        run: bunx prettier --check scripts/catalog-business-rules.mjs scripts/validate-catalog-business-rules.mjs scripts/deploy-storefront-upgrade-migrations.mjs src/components/product/ProductPurchaseOptions.tsx

      - name: Lint
        run: bun run lint

      - name: Build application
        run: bun run build

      - name: Build Hostinger artifact without publishing
        run: bun run build:hostinger
