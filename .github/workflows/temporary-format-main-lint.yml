name: Temporary Format Main Lint Fix

on:
  push:
    branches:
      - fix-main-lint-20260911
    paths:
      - ".github/workflows/temporary-format-main-lint.yml"

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix-main-lint-20260911

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format lint failures
        run: |
          bunx prettier --write \
            scripts/catalog-training-price-plan.mjs \
            scripts/validate-stage1-ux.mjs \
            scripts/validate-storefront-regressions.mjs \
            src/components/home/ShopByLeague.tsx \
            src/components/home/VisualCategories.tsx \
            src/components/product/ProductGallery.tsx \
            src/lib/product-images.ts

      - name: Validate lint
        run: bun run lint

      - name: Validate production build
        run: bun run build

      - name: Commit formatting fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add \
            scripts/catalog-training-price-plan.mjs \
            scripts/validate-stage1-ux.mjs \
            scripts/validate-storefront-regressions.mjs \
            src/components/home/ShopByLeague.tsx \
            src/components/home/VisualCategories.tsx \
            src/components/product/ProductGallery.tsx \
            src/lib/product-images.ts
          if git diff --cached --quiet; then
            echo "NO_FORMAT_CHANGES"
            exit 0
          fi
          git commit -m "style: fix main lint formatting"
          git push origin HEAD:fix-main-lint-20260911
