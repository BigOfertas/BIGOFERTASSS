name: Deploy Storefront Upgrades Backend

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-storefront-upgrades-backend.yml"
      - "scripts/deploy-storefront-upgrade-migrations.mjs"
      - "scripts/deploy-home-launches-top10.mjs"
      - "scripts/deploy-kids-purchase-sizes.mjs"
      - "scripts/deploy-catalog-filter-key-fix.mjs"
      - "supabase/migrations/20260904213000_storefront_personalization.sql"
      - "supabase/migrations/20260904213500_catalog_commercial_type.sql"
      - "supabase/migrations/20260905004500_affiliate_self_service_links.sql"
      - "supabase/migrations/20260907124500_require_phone_on_signup.sql"
      - "supabase/migrations/20260908113000_catalog_foundation_stage_1.sql"
      - "supabase/migrations/20260908114500_scale_purchase_admin.sql"
      - "supabase/migrations/20260908115000_fix_catalog_variant_upsert.sql"
      - "supabase/migrations/20260908133000_storefront_experience_stage_2.sql"
      - "supabase/migrations/20260908152000_storefront_media_seo_stage_3.sql"
      - "supabase/migrations/20260908170000_catalog_bulk_import_bridge.sql"
      - "supabase/migrations/20260909220000_catalog_public_rpc_security_fix.sql"
      - "supabase/migrations/20260909233000_home_launches_top10.sql"
      - "supabase/migrations/20260909234000_product_purchase_sizes_override.sql"
      - "supabase/migrations/20260910043000_catalog_filter_key_canonical.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-affiliate-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure affiliate backend core is live
        run: node scripts/deploy-affiliate-backend.mjs

      - name: Deploy storefront upgrade migrations
        run: node scripts/deploy-storefront-upgrade-migrations.mjs

      - name: Deploy canonical catalog filter keys
        run: node scripts/deploy-catalog-filter-key-fix.mjs

      - name: Deploy pinned homepage launches
        run: node scripts/deploy-home-launches-top10.mjs

      - name: Deploy Kids purchase sizes
        run: node scripts/deploy-kids-purchase-sizes.mjs
