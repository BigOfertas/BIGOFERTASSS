name: Format Catalog Import Bridge

on:
  push:
    branches:
      - catalog-bulk-import-bridge-20260908

permissions:
  contents: write

concurrency:
  group: format-catalog-import-bridge
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import bridge branch
        uses: actions/checkout@v7
        with:
          ref: catalog-bulk-import-bridge-20260908

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format importer files
        run: |
          bunx prettier --write \
            scripts/catalog-import-zip.mjs \
            scripts/validate-catalog-import-bridge.mjs \
            scripts/deploy-storefront-upgrade-migrations.mjs \
            .github/workflows/test-catalog-import-bridge.yml \
            .github/workflows/deploy-storefront-upgrades-backend.yml \
            .github/workflows/validate-main.yml

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add scripts .github/workflows
          git commit -m "style: format catalog import bridge"
          git push origin HEAD:catalog-bulk-import-bridge-20260908
