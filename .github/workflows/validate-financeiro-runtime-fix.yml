name: Validate Financeiro Runtime Fix

on:
  push:
    branches:
      - fix-financeiro-runtime-20260913
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-financeiro-runtime-fix
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Financeiro contract
        run: node scripts/validate-financial-dashboard.mjs

      - name: Check deploy script syntax
        run: node --check scripts/deploy-financial-dashboard.mjs

      - name: Lint
        run: bun run lint

      - name: Build application
        run: bun run build

      - name: Build Hostinger artifact without publishing
        run: bun run build:hostinger
