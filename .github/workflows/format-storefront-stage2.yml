name: Format Storefront Stage 2

on:
  push:
    branches:
      - storefront-experience-stage-2-20260908

permissions:
  contents: write

concurrency:
  group: format-storefront-stage2
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v7
        with:
          ref: storefront-experience-stage-2-20260908

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format stage files
        run: |
          bunx prettier --write \
            scripts/validate-catalog-foundation-stage1.mjs \
            src/components/ProductFilters.tsx \
            src/components/admin/CatalogFoundationAdmin.tsx \
            src/components/admin/ProductPurchaseAdmin.tsx \
            src/components/content/InstitutionalPage.tsx \
            src/components/home/BestSellers.tsx \
            src/components/home/BrazilianProducts.tsx \
            src/components/home/VisualCategories.tsx \
            src/components/layout/Footer.tsx \
            src/components/product/ProductCard.tsx \
            src/components/product/ProductPurchaseOptions.tsx \
            src/components/product/ProductShippingCalculator.tsx \
            src/lib/admin-catalog-foundation.ts \
            src/lib/shipping.ts \
            src/routes/__root.tsx \
            src/routes/checkout.tsx \
            src/routes/contato.tsx \
            src/routes/privacidade.tsx \
            src/routes/producao-e-envio.tsx \
            src/routes/products.tsx \
            src/routes/termos-de-compra.tsx \
            src/routes/trocas-e-devolucoes.tsx

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add scripts src
          git commit -m "style: format stage two implementation"
          git push origin HEAD:storefront-experience-stage-2-20260908
