name: Finalize Fixed Affiliate Commissions

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-affiliate-fixed-commissions.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-fixed-affiliate-commissions
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate affiliate backend
        run: bun run validate:affiliate

      - name: Validate production build
        run: bun run build

      - name: Apply and verify affiliate backend
        run: node scripts/deploy-affiliate-backend.mjs

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy affiliate notification processor
        run: supabase functions deploy notifications-process --project-ref "$SUPABASE_PROJECT_ID"

      - name: Remove temporary workflow
        run: rm .github/workflows/finalize-affiliate-fixed-commissions.yml

      - name: Commit cleanup
        run: |
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add -A
          git commit -m "chore: remove affiliate finalization workflow"
          git push origin main
