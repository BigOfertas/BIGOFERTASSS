name: Build Hostinger Static Artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-hostinger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate static Hostinger architecture
        run: node scripts/validate-hostinger-static.mjs

      - name: Build Hostinger SPA
        run: bun run build:hostinger

      - name: Locate static output
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT=""
          for candidate in .output/public dist/client dist/public dist; do
            if [ -f "$candidate/index.html" ]; then
              OUTPUT="$candidate"
              break
            fi
          done

          if [ -z "$OUTPUT" ]; then
            echo "Static index.html was not found in known output directories." >&2
            find . -maxdepth 4 -type f -name 'index.html' -print || true
            exit 1
          fi

          echo "HOSTINGER_OUTPUT=$OUTPUT" >> "$GITHUB_ENV"
          echo "Static output: $OUTPUT"
          find "$OUTPUT" -maxdepth 2 -type f | sort | head -200

      - name: Verify public Supabase configuration in bundle
        shell: bash
        run: |
          set -euo pipefail
          grep -R -F -q "hootwcacnrtidfmqsvrn.supabase.co" "$HOSTINGER_OUTPUT"
          grep -R -F -q "sb_publishable_" "$HOSTINGER_OUTPUT"

      - name: Reject server secrets from static bundle
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E -q "SUPABASE_SERVICE_ROLE_KEY|SUPERFRETE_TOKEN|RESEND_API_KEY|EMAIL_2FA_SECRET|R2_SECRET_ACCESS_KEY|SUPABASE_ACCESS_TOKEN" "$HOSTINGER_OUTPUT"; then
            echo "Server-only secret marker found in static Hostinger output." >&2
            exit 1
          fi

      - name: Ensure Hostinger rewrite file is packaged
        shell: bash
        run: |
          set -euo pipefail
          cp public/.htaccess "$HOSTINGER_OUTPUT/.htaccess"
          test -f "$HOSTINGER_OUTPUT/.htaccess"

      - name: Upload Hostinger artifact
        uses: actions/upload-artifact@v4
        with:
          name: bigofertas-hostinger-static
          path: ${{ env.HOSTINGER_OUTPUT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
