name: Format Conversion UX Stage 4

on:
  push:
    branches:
      - conversion-ux-polish-stage-4-20260908

permissions:
  contents: write

concurrency:
  group: format-conversion-ux-stage4
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v7
        with:
          ref: conversion-ux-polish-stage-4-20260908

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format stage four files
        run: |
          bunx prettier --write \
            scripts/deploy-storefront-upgrade-migrations.mjs \
            scripts/validate-conversion-ux-stage4.mjs \
            src/context/FavoritesContext.tsx \
            src/context/CartContext.tsx \
            src/components/cart/MiniCartDrawer.tsx \
            src/routes/__root.tsx \
            src/routes/favoritos.tsx \
            src/lib/catalog.ts \
            src/hooks/useCatalogProducts.ts \
            src/hooks/useCatalogSearchSuggestions.ts \
            src/components/product/ProductCard.tsx \
            src/components/product/CatalogProductGrid.tsx \
            src/components/layout/Header.tsx \
            src/routes/products.tsx \
            src/components/product/ProductSeo.tsx \
            src/components/product/ProductShippingCalculator.tsx \
            src/lib/checkout.ts \
            src/routes/conta.tsx \
            .github/workflows/test-conversion-ux-stage4.yml \
            .github/workflows/deploy-storefront-upgrades-backend.yml \
            .github/workflows/validate-main.yml

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add scripts src .github/workflows
          git commit -m "style: format stage four conversion polish"
          git push origin HEAD:conversion-ux-polish-stage-4-20260908
