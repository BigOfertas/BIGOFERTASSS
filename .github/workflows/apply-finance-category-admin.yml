name: Apply Finance Category Admin

on:
  push:
    branches:
      - finance-category-bulk-20260913
    paths:
      - ".github/workflows/apply-finance-category-admin.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: finance-category-bulk-20260913

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Integrate finance category UI
        run: node scripts/patch-finance-category-admin.mjs

      - name: Format touched files
        run: bunx prettier --write src/routes/admin.tsx .github/workflows/validate-main.yml

      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add src/routes/admin.tsx .github/workflows/validate-main.yml
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "feat: mount finance category pricing admin"
          git push origin HEAD:finance-category-bulk-20260913
