name: Temporary Stage 2 Revalidate

on:
  push:
    branches:
      - stage2-commerce-fixes-20260911
    paths:
      - ".github/workflows/temporary-stage2-revalidate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage 2 branch
        uses: actions/checkout@v7
        with:
          ref: stage2-commerce-fixes-20260911

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate deployment script syntax
        run: node --check scripts/deploy-storefront-upgrade-migrations.mjs

      - name: Validate Stage 1 regressions
        run: node scripts/validate-stage1-ux.mjs

      - name: Validate Stage 2 commerce
        run: node scripts/validate-stage2-commerce.mjs

      - name: Lint storefront
        run: bun run lint

      - name: Validate production build
        run: bun run build
