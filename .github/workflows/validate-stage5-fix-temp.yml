name: Validate Stage 5 Fix Temp

on:
  push:
    branches:
      - stage5-ci-fix-20260914

permissions:
  contents: read

concurrency:
  group: validate-stage5-fix-temp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate centralized storefront brand
        run: node scripts/validate-brand-identity.mjs && node scripts/validate-stage3-rebrand.mjs

      - name: Validate catalog foundation
        run: node scripts/validate-catalog-foundation-stage1.mjs

      - name: Validate catalog bulk import bridge
        run: bun run validate:catalog-import

      - name: Validate final catalog pipeline
        run: node scripts/validate-catalog-business-rules.mjs && node scripts/validate-google-photos-final-pipeline.mjs && node scripts/validate-retro-pdf-group-deploy.mjs

      - name: Validate storefront customer experience
        run: node scripts/validate-storefront-upgrades.mjs && node scripts/validate-storefront-regressions.mjs && node scripts/validate-stage2-commerce.mjs && node scripts/validate-final-storefront-refinements.mjs && bun scripts/validate-size-guidance.ts && bun scripts/validate-stage5.ts

      - name: Validate affiliate referral backend
        run: bun run validate:affiliate

      - name: Validate financial dashboard
        run: node scripts/validate-financial-dashboard.mjs && node scripts/validate-finance-category-bulk.mjs

      - name: Lint storefront
        run: bun run lint

      - name: Validate TypeScript and production build
        run: bun run build

      - name: Validate definitive order core
        run: bun run validate:phase10
