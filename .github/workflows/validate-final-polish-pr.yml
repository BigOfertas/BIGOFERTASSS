name: Validate Final Storefront Polish PR

on:
  push:
    branches:
      - fix-brand-assets-20260912

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate brand and storefront contracts
        run: |
          node scripts/validate-brand-identity.mjs
          node scripts/validate-stage3-rebrand.mjs
          node scripts/validate-storefront-upgrades.mjs
          node scripts/validate-storefront-regressions.mjs
          node scripts/validate-stage2-commerce.mjs

      - name: Validate requested storefront polish
        run: |
          grep -F 'lg:max-w-[1536px]' src/components/home/BestSellers.tsx
          grep -F 'lg:max-w-[1536px]' src/components/home/ShopByLeague.tsx
          grep -F 'category-carousel-arrow' src/components/home/VisualCategories.tsx
          grep -F 'scrollBy({' src/components/home/VisualCategories.tsx
          grep -F 'configAttempted' src/components/product/ProductQuickAdd.tsx
          grep -F 'detailAttempted' src/components/product/ProductQuickAdd.tsx
          grep -F 'Barlow+Condensed' src/sport-theme.css
          grep -F 'dropbox-wordmark-fallback' src/components/brand/BrandWordmark.tsx

      - name: Lint storefront
        run: bun run lint

      - name: Build storefront
        run: bun run build
