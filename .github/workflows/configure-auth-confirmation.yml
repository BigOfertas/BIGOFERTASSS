name: Configure Auth Confirmation

on:
  workflow_run:
    workflows:
      - Hostinger Production Deploy
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: configure-auth-confirmation-production
  cancel-in-progress: false

jobs:
  configure:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn

    steps:
      - name: Route confirmation links through DropBox
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const projectRef = process.env.SUPABASE_PROJECT_ID;
          const accessToken = process.env.SUPABASE_ACCESS_TOKEN;
          if (!projectRef || !accessToken) {
            console.error("AUTH_CONFIRMATION_CONFIGURATION_MISSING_CREDENTIALS");
            process.exit(2);
          }

          const endpoint = `https://api.supabase.com/v1/projects/${encodeURIComponent(projectRef)}/config/auth`;
          const headers = {
            authorization: `Bearer ${accessToken}`,
            accept: "application/json",
            "content-type": "application/json",
          };

          const currentResponse = await fetch(endpoint, {
            headers,
            signal: AbortSignal.timeout(30_000),
          });
          if (!currentResponse.ok) {
            console.error(`AUTH_CONFIRMATION_READ_FAILED_HTTP_${currentResponse.status}`);
            process.exit(3);
          }

          const current = await currentResponse.json();
          const currentTemplate = current?.mailer_templates_confirmation_content;
          if (typeof currentTemplate !== "string" || !currentTemplate.trim()) {
            console.error("AUTH_CONFIRMATION_TEMPLATE_MISSING");
            process.exit(4);
          }

          const desiredLink = "{{ .SiteURL }}/confirmar-email?token_hash={{ .TokenHash }}&type=email";
          let nextTemplate = currentTemplate;

          if (!nextTemplate.includes(desiredLink)) {
            const confirmationUrlPattern = /{{\s*\.ConfirmationURL\s*}}/g;
            if (!confirmationUrlPattern.test(nextTemplate)) {
              console.error("AUTH_CONFIRMATION_TEMPLATE_LINK_NOT_RECOGNIZED");
              process.exit(5);
            }
            nextTemplate = nextTemplate.replace(confirmationUrlPattern, desiredLink);
          }

          const patchResponse = await fetch(endpoint, {
            method: "PATCH",
            headers,
            body: JSON.stringify({
              site_url: "https://bigofertas.net",
              mailer_templates_confirmation_content: nextTemplate,
            }),
            signal: AbortSignal.timeout(30_000),
          });
          if (!patchResponse.ok) {
            console.error(`AUTH_CONFIRMATION_PATCH_FAILED_HTTP_${patchResponse.status}`);
            process.exit(6);
          }

          const verifyResponse = await fetch(endpoint, {
            headers,
            signal: AbortSignal.timeout(30_000),
          });
          if (!verifyResponse.ok) {
            console.error(`AUTH_CONFIRMATION_VERIFY_FAILED_HTTP_${verifyResponse.status}`);
            process.exit(7);
          }

          const verified = await verifyResponse.json();
          const verifiedTemplate = verified?.mailer_templates_confirmation_content;
          if (
            verified?.site_url !== "https://bigofertas.net" ||
            typeof verifiedTemplate !== "string" ||
            !verifiedTemplate.includes(desiredLink)
          ) {
            console.error("AUTH_CONFIRMATION_VERIFY_FAILED");
            process.exit(8);
          }

          console.log("AUTH_CONFIRMATION_STOREFRONT_ROUTE_ACTIVE");
          NODE
