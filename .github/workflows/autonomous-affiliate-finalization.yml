name: Autonomous Affiliate Finalization

on:
  push:
    branches:
      - main
    paths:
      - "scripts/implement-affiliate-autonomous-finalization.mjs"
      - ".github/workflows/autonomous-affiliate-finalization.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autonomous-affiliate-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply autonomous affiliate finalization
        run: node scripts/implement-affiliate-autonomous-finalization.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate affiliate module
        run: bun run validate:affiliate

      - name: Validate order and admin regressions
        run: bun run validate:phase10

      - name: Build production application
        run: bun run build

      - name: Build Hostinger static artifact without publishing
        run: bun run build:hostinger

      - name: Apply and verify affiliate backend
        run: node scripts/deploy-affiliate-backend.mjs

      - name: Remove temporary automation files
        run: rm scripts/implement-affiliate-autonomous-finalization.mjs .github/workflows/autonomous-affiliate-finalization.yml

      - name: Commit completed work
        run: |
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: complete affiliate PIX withdrawal flow"
          git push origin main
