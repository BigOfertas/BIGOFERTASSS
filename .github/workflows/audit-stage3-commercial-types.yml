name: Audit Stage 3 Commercial Types

on:
  push:
    branches:
      - qa-stage3-header-production-20260914

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Audit active commercial classifications read-only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          node <<'JS'
          const projectRef = process.env.SUPABASE_PROJECT_ID;
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          async function query(sql) {
            const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/database/query/read-only`, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                accept: 'application/json',
                'content-type': 'application/json',
              },
              body: JSON.stringify({ query: sql }),
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`HTTP_${response.status}: ${text}`);
            return JSON.parse(text);
          }

          const counts = await query(`
            select
              pps.commercial_type::text as product_type,
              count(distinct p.id)::int as active_products,
              count(distinct v.id) filter (where v.status = 'active'::public.product_variant_status)::int as active_variants
            from public.products p
            left join public.product_purchase_settings pps on pps.product_id = p.id
            left join public.product_variants v on v.product_id = p.id
            where p.status = 'active'::public.product_status
            group by pps.commercial_type
            order by pps.commercial_type nulls first;
          `);

          const targets = await query(`
            select
              p.id,
              p.slug,
              p.name,
              p.status::text as status,
              pps.commercial_type::text as product_commercial_type,
              coalesce(
                jsonb_agg(distinct v.commercial_type::text) filter (where v.commercial_type is not null),
                '[]'::jsonb
              ) as variant_commercial_types
            from public.products p
            left join public.product_purchase_settings pps on pps.product_id = p.id
            left join public.product_variants v on v.product_id = p.id and v.status = 'active'::public.product_variant_status
            where p.status = 'active'::public.product_status
              and (
                pps.commercial_type::text in ('torcedor','jogador')
                or v.commercial_type::text in ('torcedor','jogador')
              )
            group by p.id,p.slug,p.name,p.status,pps.commercial_type
            order by p.name
            limit 100;
          `);

          const rpcTorcedor = await query(`
            select public.catalog_products_page_v3(
              null,null,null,null,null,null,null,null,'torcedor',null,null,'featured',1,24
            ) as payload;
          `);
          const rpcJogador = await query(`
            select public.catalog_products_page_v3(
              null,null,null,null,null,null,null,null,'jogador',null,null,'featured',1,24
            ) as payload;
          `);

          console.log('STAGE3_COMMERCIAL_COUNTS=' + JSON.stringify(counts));
          console.log('STAGE3_COMMERCIAL_TARGETS=' + JSON.stringify(targets));
          console.log('STAGE3_RPC_TORCEDOR=' + JSON.stringify(rpcTorcedor));
          console.log('STAGE3_RPC_JOGADOR=' + JSON.stringify(rpcJogador));
          JS
