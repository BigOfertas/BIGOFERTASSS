name: Audit Stage 3 Commercial Types

on:
  push:
    branches:
      - qa-stage3-header-production-20260914

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact published main SHA
        uses: actions/checkout@v7
        with:
          ref: 9dcb0f421aa10ad41bb8579a2caf67b978297bbe

      - name: Diagnose Torcedor/Jogador RPC performance read-only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
        run: |
          node <<'JS'
          import fs from 'node:fs';
          import { performance } from 'node:perf_hooks';

          const projectRef = process.env.SUPABASE_PROJECT_ID;
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const envText = fs.readFileSync('.env', 'utf8');
          const env = Object.fromEntries(envText.split(/\r?\n/).map((line)=>line.trim()).filter((line)=>line&&!line.startsWith('#')&&line.includes('=')).map((line)=>{const i=line.indexOf('=');return [line.slice(0,i),line.slice(i+1).replace(/^['\"]|['\"]$/g,'')]}));
          const publicUrl = env.VITE_SUPABASE_URL;
          const publicKey = env.VITE_SUPABASE_PUBLISHABLE_KEY;
          if (!publicUrl || !publicKey) throw new Error('Configuração pública Supabase ausente');

          async function query(sql) {
            const response = await fetch(`https://api.supabase.com/v1/projects/${projectRef}/database/query/read-only`, {method:'POST',headers:{authorization:`Bearer ${token}`,accept:'application/json','content-type':'application/json'},body:JSON.stringify({query:sql})});
            const text=await response.text();
            if(!response.ok) throw new Error(`READ_ONLY_SQL_${response.status}: ${text}`);
            return JSON.parse(text);
          }

          async function publicRpc(functionName,args) {
            const started=performance.now();
            try {
              const response=await fetch(`${publicUrl}/rest/v1/rpc/${functionName}`,{method:'POST',headers:{apikey:publicKey,authorization:`Bearer ${publicKey}`,accept:'application/json','content-type':'application/json'},body:JSON.stringify(args)});
              const text=await response.text();
              const ms=Math.round(performance.now()-started);
              let data=null; try { data=JSON.parse(text); } catch {}
              return {ok:response.ok,status:response.status,ms,data,text:text.slice(0,800)};
            } catch(error) {
              return {ok:false,status:0,ms:Math.round(performance.now()-started),data:null,text:String(error).slice(0,800)};
            }
          }

          const productTypes=await query(`select pps.commercial_type::text as commercial_type,count(distinct p.id)::int as active_products,count(distinct p.id) filter(where exists(select 1 from public.product_images i where i.product_id=p.id and i.status='ready'::public.product_image_status))::int as visible_products from public.products p join public.product_purchase_settings pps on pps.product_id=p.id where p.status='active'::public.product_status and pps.commercial_type::text in ('torcedor','jogador') group by pps.commercial_type order by pps.commercial_type;`);
          const variantTypes=await query(`select v.commercial_type::text as commercial_type,count(distinct p.id)::int as active_product_bases,count(distinct v.id)::int as active_variants from public.products p join public.product_variants v on v.product_id=p.id where p.status='active'::public.product_status and v.status='active'::public.product_variant_status and v.commercial_type::text in ('torcedor','jogador') group by v.commercial_type order by v.commercial_type;`);
          const storageMeta=await query(`select table_name,column_name,data_type,udt_name from information_schema.columns where table_schema='public' and table_name in ('product_purchase_settings','product_variants') and column_name='commercial_type' order by table_name;`);
          const rpcDefs=await query(`select p.proname,pg_get_functiondef(p.oid) as definition from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('catalog_products_page_v2','catalog_products_page_v3') order by p.proname;`);
          const mixed=await query(`select p.time_key,p.season_key,p.brand_key,count(distinct p.id) filter(where pps.commercial_type='torcedor')::int as torcedor_products,count(distinct p.id) filter(where pps.commercial_type='jogador')::int as jogador_products,jsonb_agg(jsonb_build_object('id',p.id,'slug',p.slug,'name',p.name,'type',pps.commercial_type::text) order by pps.commercial_type,p.name) as products from public.products p join public.product_purchase_settings pps on pps.product_id=p.id where p.status='active'::public.product_status and pps.commercial_type in ('torcedor','jogador') and p.time_key is not null and p.season_key is not null and p.brand_key is not null and exists(select 1 from public.product_images i where i.product_id=p.id and i.status='ready'::public.product_image_status) group by p.time_key,p.season_key,p.brand_key having count(distinct pps.commercial_type)=2 order by p.time_key,p.season_key,p.brand_key limit 5;`);

          console.log('STAGE3_PRODUCT_TYPES='+JSON.stringify(productTypes));
          console.log('STAGE3_VARIANT_TYPES='+JSON.stringify(variantTypes));
          console.log('STAGE3_STORAGE_META='+JSON.stringify(storageMeta));
          console.log('STAGE3_RPC_FILTER_SOURCES='+JSON.stringify(rpcDefs.map((row)=>({name:row.proname,usesProductSettings:row.definition.includes('product_purchase_settings'),usesVariantCommercialType:row.definition.includes('pv.commercial_type')||row.definition.includes('v.commercial_type'),delegatesV2:row.definition.includes('catalog_products_page_v2')}))));
          console.log('STAGE3_MIXED_STRUCTURED_CASES='+JSON.stringify(mixed));

          const args=(type,page=1,pageSize=24,extra={})=>({p_query:null,p_category:null,p_campeonato:null,p_liga:null,p_time:null,p_season:null,p_brand:null,p_audience:null,p_commercial_type:type,p_min_price:null,p_max_price:null,p_sort:'featured',p_page:page,p_page_size:pageSize,...extra});
          const summarize=(r)=>({ok:r.ok,status:r.status,ms:r.ms,total:r.data?.total??null,page:r.data?.page??null,pageSize:r.data?.pageSize??null,totalPages:r.data?.totalPages??null,itemCount:Array.isArray(r.data?.items)?r.data.items.length:null,items:Array.isArray(r.data?.items)?r.data.items.slice(0,5).map((x)=>({id:x.id,slug:x.slug,type:x.commercial_type,time:x.time,season:x.season,brand:x.brand})):[],error:r.ok?null:r.text});

          // Jogador first so Torcedor timeout cannot mask it.
          const tests=[];
          for (const spec of [
            ['v3-jogador-p1','catalog_products_page_v3',args('jogador',1,24)],
            ['v2-jogador-p1','catalog_products_page_v2',args('jogador',1,24)],
            ['v3-jogador-p2','catalog_products_page_v3',args('jogador',2,24)],
            ['v3-torcedor-p1-12','catalog_products_page_v3',args('torcedor',1,12)],
            ['v2-torcedor-p1-12','catalog_products_page_v2',args('torcedor',1,12)],
            ['v3-torcedor-p1-24','catalog_products_page_v3',args('torcedor',1,24)],
            ['v2-torcedor-p1-24','catalog_products_page_v2',args('torcedor',1,24)],
          ]) {
            const [label,fn,a]=spec;
            const r=await publicRpc(fn,a);
            const s=summarize(r);
            tests.push({label,...s});
            console.log(`STAGE3_RPC_TEST_${label}=`+JSON.stringify(s));
          }

          if (mixed[0]) {
            const m=mixed[0];
            const extra={p_time:m.time_key,p_season:m.season_key,p_brand:m.brand_key};
            for (const type of ['torcedor','jogador']) {
              const r=await publicRpc('catalog_products_page_v3',args(type,1,24,extra));
              console.log(`STAGE3_MIXED_${type.toUpperCase()}=`+JSON.stringify(summarize(r)));
            }
          }

          const jogador=tests.find((x)=>x.label==='v3-jogador-p1');
          if (!jogador?.ok || jogador.total!==46 || jogador.itemCount!==24) throw new Error('Jogador v3 público não corresponde aos 46 produtos ativos');
          if (!jogador.items.every((x)=>x.type==='jogador')) throw new Error('Jogador v3 misturou tipos');
          console.log('STAGE3_RPC_DIAGNOSTIC_COMPLETE');
          JS
