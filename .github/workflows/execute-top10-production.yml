name: Execute Top 10 Production Catalog

on:
  push:
    branches:
      - catalog-final-pipeline-20260909-prod
    paths:
      - catalog-jobs/execute-top10-production.json

permissions:
  contents: read
  actions: read

concurrency:
  group: execute-top10-production-catalog
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout validated branch
        uses: actions/checkout@v7
        with:
          ref: catalog-final-pipeline-20260909-prod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Revalidate release candidate
        run: |
          node scripts/validate-catalog-business-rules.mjs
          node scripts/validate-google-photos-final-pipeline.mjs
          node scripts/validate-storefront-media-stage3.mjs
          bun run lint
          bun run build

      - name: Apply definitive Supabase migrations
        run: node scripts/deploy-storefront-upgrade-migrations.mjs

      - name: Snapshot non-catalog production invariants
        run: |
          mkdir -p .artifacts
          node scripts/top10-production-guard.mjs snapshot .artifacts/top10-reset-before.json

      - name: Recover verified real Top 10 collector artifact
        run: |
          mkdir -p .artifacts/top10-source
          gh run download 34371627604 \
            --repo BigOfertas/BIGOFERTASSS \
            --name google-photos-collector-34371627604 \
            --dir .artifacts/top10-source
          test -f .artifacts/top10-source/collector.json
          test -f .artifacts/top10-source/assimilation/assimilation.json

      - name: Preview Top 10 and validate all Google image URLs
        run: |
          node scripts/google-photos-catalog-pipeline.mjs \
            --collector .artifacts/top10-source/collector.json \
            --assimilation .artifacts/top10-source/assimilation/assimilation.json \
            --report .artifacts/top10-catalog-plan.json \
            --reset \
            --validate-urls \
            --stock 999

      - name: Reset only catalog and import Top 10 as draft
        run: |
          node scripts/google-photos-catalog-pipeline.mjs \
            --collector .artifacts/top10-source/collector.json \
            --assimilation .artifacts/top10-source/assimilation/assimilation.json \
            --report .artifacts/top10-catalog-plan-applied.json \
            --reset \
            --apply \
            --stock 999

      - name: Validate draft catalog and preservation guards
        run: node scripts/top10-production-guard.mjs validate .artifacts/top10-reset-before.json

      - name: Activate only validated P000001-P000010
        run: node scripts/top10-production-guard.mjs activate .artifacts/top10-reset-before.json

      - name: Verify active catalog after activation
        run: node scripts/top10-production-guard.mjs verify-active .artifacts/top10-reset-before.json

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top10-production-evidence-${{ github.run_id }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
