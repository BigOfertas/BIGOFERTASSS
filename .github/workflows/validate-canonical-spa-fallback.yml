name: Validate Canonical SPA Fallback

on:
  push:
    branches:
      - fix-product-canonical-spa-fallback-20260914

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix-product-canonical-spa-fallback-20260914

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bunx prettier --check src/components/product/ProductSeo.tsx

      - name: Lint
        run: bun run lint

      - name: TypeScript and production build
        run: bun run build

      - name: Hostinger build
        run: bun run build:hostinger
