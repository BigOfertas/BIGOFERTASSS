name: Format Finance Category Sources

on:
  push:
    branches:
      - finance-category-bulk-20260913
    paths:
      - ".github/workflows/format-finance-category-sources.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: finance-category-bulk-20260913
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format sources
        run: bunx prettier --write src/components/admin/FinanceCategoryPricing.tsx src/lib/admin-finance-categories.ts scripts/validate-finance-category-bulk.mjs src/routes/admin.tsx
      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add src/components/admin/FinanceCategoryPricing.tsx src/lib/admin-finance-categories.ts scripts/validate-finance-category-bulk.mjs src/routes/admin.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style: format finance category sources"
          git push origin HEAD:finance-category-bulk-20260913
