name: Validate Email Confirmation Hotfix

on:
  push:
    branches:
      - fix-email-confirmation-gateway-20260912

permissions:
  contents: read

concurrency:
  group: validate-email-confirmation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint storefront
        run: bun run lint
      - name: Validate TypeScript and production build
        run: bun run build
      - name: Validate Hostinger production build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: bun run build:hostinger
