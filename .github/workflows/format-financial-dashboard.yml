name: Format Financial Dashboard Sources

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/format-financial-dashboard.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format financial sources
        run: bunx prettier --write src/components/admin/FinancialAdmin.tsx src/routes/admin.tsx scripts/validate-financial-dashboard.mjs

      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/FinancialAdmin.tsx src/routes/admin.tsx scripts/validate-financial-dashboard.mjs
          if git diff --cached --quiet; then
            echo "Financial sources already formatted."
            exit 0
          fi
          git commit -m "style: format financial dashboard sources"
          git push origin HEAD:main
