name: Dark Mode Workbench

on:
  push:
    branches:
      - fix-global-dark-mode-20260914
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dark-mode-workbench
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dark-mode branch
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate dark-mode coverage
        run: node scripts/validate-dark-mode-coverage.mjs

      - name: Validate Stage 6
        run: node scripts/validate-stage6-i18n.mjs

      - name: Validate storefront regressions
        run: node scripts/validate-storefront-regressions.mjs && node scripts/validate-final-storefront-refinements.mjs && bun scripts/validate-stage5.ts

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Hostinger build
        run: bun run build:hostinger
