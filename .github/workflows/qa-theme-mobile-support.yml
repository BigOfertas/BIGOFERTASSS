name: QA Theme Mobile Support

on:
  push:
    branches:
      - theme-mobile-support-20260915

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate brand and support contact
        run: node scripts/validate-stage3-rebrand.mjs

      - name: Validate Stage 6
        run: node scripts/validate-stage6-i18n.mjs

      - name: Lint
        run: bun run lint

      - name: TypeScript and production build
        run: bun run build
