name: Validate Stage 2 Size Guidance

on:
  push:
    branches:
      - stage2-dynamic-size-guidance-20260914

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate dynamic size guidance scenarios
        run: bun scripts/validate-size-guidance.ts

      - name: Validate storefront regressions
        run: node scripts/validate-storefront-regressions.mjs && node scripts/validate-stage2-commerce.mjs && node scripts/validate-final-storefront-refinements.mjs

      - name: Validate deployment script syntax
        run: node --check scripts/deploy-dynamic-size-guidance.mjs

      - name: Lint storefront
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Hostinger build without publish
        run: bun run build:hostinger

      - name: Validate definitive order core
        run: bun run validate:phase10
