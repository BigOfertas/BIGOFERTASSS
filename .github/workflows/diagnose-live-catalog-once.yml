name: Diagnose BIGofertas Live Catalog Once

on:
  push:
    branches:
      - hostinger-dispatch-once-20260909
    paths:
      - .verify/diagnose-live-catalog-20260909

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - name: Diagnose production database state and grants
        run: |
          cat > ./diagnose-db.mjs <<'NODE'
          const ref = process.env.SUPABASE_PROJECT_ID;
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          if (!ref || !token) throw new Error('missing Supabase management credentials');
          const url = `https://api.supabase.com/v1/projects/${ref}/database/query/read-only`;
          async function q(label, query) {
            const response = await fetch(url, {
              method: 'POST',
              headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
              body: JSON.stringify({ query }),
            });
            const text = await response.text();
            console.log(`${label}_HTTP_${response.status}`);
            console.log(text.slice(0, 12000));
            if (!response.ok) throw new Error(`${label}_FAILED`);
          }
          await q('STATE', `select
            count(*)::int as products,
            count(*) filter (where status='active'::public.product_status)::int as active,
            (select count(*)::int from public.product_images where status='ready'::public.product_image_status) as ready_images,
            (select count(*)::int from public.product_images where external_url is not null) as external_images
            from public.products;`);
          await q('GRANTS', `select
            has_table_privilege('anon','public.products','SELECT') as anon_products_select,
            has_table_privilege('anon','public.product_images','SELECT') as anon_images_select,
            has_table_privilege('anon','public.product_variants','SELECT') as anon_variants_select,
            has_table_privilege('anon','public.product_purchase_settings','SELECT') as anon_purchase_settings_select,
            exists(select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='catalog_products_page_v3' and has_function_privilege('anon',p.oid,'EXECUTE')) as anon_page_v3_execute,
            exists(select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='catalog_products_page_v2' and has_function_privilege('anon',p.oid,'EXECUTE')) as anon_page_v2_execute,
            exists(select 1 from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='catalog_filter_facets_v2' and has_function_privilege('anon',p.oid,'EXECUTE')) as anon_facets_v2_execute;`);
          NODE
          node ./diagnose-db.mjs

      - name: Diagnose live HTML and public RPCs
        run: |
          cat > ./diagnose-public.mjs <<'NODE'
          const siteUrl = 'https://bigofertas.net/products';
          const htmlResponse = await fetch(siteUrl, { redirect: 'follow' });
          const html = await htmlResponse.text();
          console.log(`LIVE_HTML_HTTP_${htmlResponse.status}`);
          console.log(`LIVE_HTML_CONTENT_TYPE=${htmlResponse.headers.get('content-type')}`);
          console.log(`LIVE_HTML_BYTES=${html.length}`);
          console.log(`LIVE_HTML_HAS_ROOT=${html.includes('id="root"')}`);
          console.log(`LIVE_HTML_HAS_ASSETS=${html.includes('/assets/')}`);
          if (!htmlResponse.ok) throw new Error('LIVE_HTML_FAILED');

          const sources = [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map((match) => match[1]);
          console.log(`LIVE_SCRIPT_COUNT=${sources.length}`);
          let publishable = null;
          let bundleWithKey = null;
          for (const source of sources) {
            const assetUrl = new URL(source, htmlResponse.url).href;
            const response = await fetch(assetUrl);
            const body = await response.text();
            console.log(`ASSET_HTTP_${response.status} ${new URL(assetUrl).pathname}`);
            const match = body.match(/sb_publishable_[A-Za-z0-9_-]+/);
            if (match) {
              publishable = match[0];
              bundleWithKey = new URL(assetUrl).pathname;
              break;
            }
          }
          if (!publishable) throw new Error('PUBLISHABLE_KEY_NOT_FOUND_IN_LIVE_BUNDLE');
          console.log(`PUBLISHABLE_KEY_FOUND_IN=${bundleWithKey}`);

          const supabaseBase = 'https://hootwcacnrtidfmqsvrn.supabase.co/rest/v1/rpc';
          async function rpc(name, args) {
            const response = await fetch(`${supabaseBase}/${name}`, {
              method: 'POST',
              headers: {
                apikey: publishable,
                authorization: `Bearer ${publishable}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify(args),
            });
            const text = await response.text();
            console.log(`PUBLIC_${name.toUpperCase()}_HTTP_${response.status}`);
            if (!response.ok) {
              console.log(text.slice(0, 6000));
              throw new Error(`PUBLIC_${name}_FAILED`);
            }
            const data = JSON.parse(text);
            if (name === 'catalog_products_page_v3') {
              console.log(`PUBLIC_PAGE_ITEMS=${Array.isArray(data?.items) ? data.items.length : -1}`);
              console.log(`PUBLIC_PAGE_TOTAL=${data?.total ?? 'missing'}`);
              console.log(`PUBLIC_PAGE_NAMES=${(data?.items ?? []).map((item) => item.name).join(' | ')}`);
              console.log(`PUBLIC_PAGE_EXTERNAL_IMAGES=${(data?.items ?? []).filter((item) => String(item.image_external_url || '').includes('googleusercontent.com')).length}`);
            } else {
              console.log(`PUBLIC_FACETS_KEYS=${Object.keys(data ?? {}).join(',')}`);
            }
          }

          await rpc('catalog_products_page_v3', { p_page: 1, p_page_size: 24 });
          await rpc('catalog_filter_facets_v2', {});
          console.log('PUBLIC_CATALOG_RPC_DIAGNOSTICS_OK');
          NODE
          node ./diagnose-public.mjs
