name: Stage6 Regression Fix Workbench

on:
  push:
    branches:
      - stage6-dark-i18n-regression-fix-20260914
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: stage6-regression-fix-workbench
  cancel-in-progress: true

jobs:
  validate-and-persist:
    if: ${{ !contains(github.event.head_commit.message || '', '[stage6-regression-persist]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout regression fix branch
        uses: actions/checkout@v7
        with:
          ref: stage6-dark-i18n-regression-fix-20260914

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format regression fix
        run: >-
          bunx prettier --write
          src/i18n/ui-copy.ts
          src/components/layout/CategoryNav.tsx
          src/components/layout/Header.tsx
          src/components/home/BestSellers.tsx
          src/components/product/ProductCard.tsx
          src/components/product/ProductCarousel.tsx
          src/components/ProductFilters.tsx
          src/routes/products.tsx
          src/stage6-theme.css
          scripts/validate-stage6-i18n.mjs

      - name: Validate Stage 6 architecture
        run: bun run validate:stage6-i18n

      - name: Validate storefront regressions
        run: |
          node scripts/validate-storefront-upgrades.mjs
          node scripts/validate-storefront-regressions.mjs
          bun scripts/validate-stage5.ts

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Hostinger build
        run: bun run build:hostinger

      - name: Persist formatted validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add src/i18n/ui-copy.ts src/components/layout/CategoryNav.tsx src/components/layout/Header.tsx src/components/home/BestSellers.tsx src/components/product/ProductCard.tsx src/components/product/ProductCarousel.tsx src/components/ProductFilters.tsx src/routes/products.tsx src/stage6-theme.css scripts/validate-stage6-i18n.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes to persist."
            exit 0
          fi
          git commit -m "[stage6-regression-persist] fix(stage6): format validated dark/i18n correction"
          git push origin HEAD:stage6-dark-i18n-regression-fix-20260914
