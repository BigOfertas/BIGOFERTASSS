name: Temporary Stage 2 Completion

on:
  push:
    branches:
      - stage2-completion-20260911
    paths:
      - ".github/workflows/temporary-stage2-completion.yml"

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v7
        with:
          ref: stage2-completion-20260911

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Finalize Stage 2 integration files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"Expected text not found in {path}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_required(
              "src/routes/products.tsx",
              'value={search.sort ?? "newest"}',
              'value={search.sort ?? "featured"}',
          )
          replace_required(
              "src/routes/products.tsx",
              '<option value="newest">Mais recentes</option>',
              '<option value="featured">Destaques</option>\n              <option value="newest">Mais recentes</option>',
          )

          replace_required(
              "scripts/validate-storefront-upgrades.mjs",
              '''check(\n  "card inteiro abre o produto e não repete CTA",\n  productCard.includes("className={`group block h-full") &&\n    productCard.includes('to="/product/$id"') &&\n    !productCard.includes("Ver produto") &&\n    !productCard.includes("Ver detalhes"),\n);''',
              '''check(\n  "card mantém navegação ao produto e quick add separado sem CTA repetido",\n  productCard.includes("data-product-card") &&\n    productCard.includes("<ProductQuickAdd") &&\n    productCard.includes('to="/product/$id"') &&\n    !productCard.includes("Ver produto") &&\n    !productCard.includes("Ver detalhes"),\n);''',
          )

          replace_required(
              "scripts/deploy-storefront-upgrade-migrations.mjs",
              '''  [\n    "stage2_purchase_customization_policy_20260911",\n    "supabase/migrations/20260911051000_stage2_purchase_customization_policy.sql",\n  ],\n];''',
              '''  [\n    "stage2_purchase_customization_policy_20260911",\n    "supabase/migrations/20260911051000_stage2_purchase_customization_policy.sql",\n  ],\n  [\n    "stage2_storefront_priority_20260911",\n    "supabase/migrations/20260911054000_stage2_storefront_priority.sql",\n  ],\n];''',
          )
          replace_required(
              "scripts/deploy-storefront-upgrade-migrations.mjs",
              '''  ) as non_shorts_personalization_policy;''',
              '''  ) as non_shorts_personalization_policy,\n  exists (\n    select 1 from pg_catalog.pg_proc p\n    join pg_catalog.pg_namespace n on n.oid = p.pronamespace\n    where n.nspname = 'public' and p.proname = 'storefront_product_priority'\n  ) as stage2_storefront_priority_rpc;''',
          )
          replace_required(
              "scripts/deploy-storefront-upgrade-migrations.mjs",
              '''  "non_shorts_personalization_policy",\n];''',
              '''  "non_shorts_personalization_policy",\n  "stage2_storefront_priority_rpc",\n];''',
          )

          replace_required(
              ".github/workflows/deploy-storefront-upgrades-backend.yml",
              '''      - "supabase/migrations/20260911051000_stage2_purchase_customization_policy.sql"''',
              '''      - "supabase/migrations/20260911051000_stage2_purchase_customization_policy.sql"\n      - "supabase/migrations/20260911054000_stage2_storefront_priority.sql"''',
          )
          PY

      - name: Format changed source
        run: |
          bunx prettier --write \
            src/lib/catalog.ts \
            src/routes/products.tsx \
            src/components/home/BrazilianProducts.tsx \
            src/components/home/ShopByLeague.tsx \
            scripts/validate-storefront-upgrades.mjs \
            scripts/validate-stage2-commerce.mjs \
            scripts/audit-stage2-patches.mjs \
            scripts/deploy-storefront-upgrade-migrations.mjs

      - name: Validate storefront and Stage 2
        run: |
          node --check scripts/deploy-storefront-upgrade-migrations.mjs
          node scripts/validate-stage1-ux.mjs
          node scripts/validate-storefront-upgrades.mjs
          node scripts/validate-storefront-regressions.mjs
          node scripts/validate-stage2-commerce.mjs

      - name: Lint storefront
        run: bun run lint

      - name: Validate production build
        run: bun run build

      - name: Commit final Stage 2 completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add src scripts .github/workflows/deploy-storefront-upgrades-backend.yml supabase/migrations/20260911054000_stage2_storefront_priority.sql
          if git diff --cached --quiet; then
            echo "NO_STAGE2_COMPLETION_CHANGES"
            exit 0
          fi
          git commit -m "feat: complete Stage 2 product prioritization"
          git push origin HEAD:stage2-completion-20260911
