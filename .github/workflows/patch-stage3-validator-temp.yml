name: Patch Stage 3 Legacy Validator Temp

on:
  push:
    branches:
      - stage3-header-refinement-20260914
    paths:
      - .github/workflows/patch-stage3-validator-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: stage3-header-refinement-20260914

      - name: Update legacy navigation expectation
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/validate-storefront-upgrades.mjs')
          text = path.read_text()
          old = '''const expectedNav = [
            "INÍCIO",
            "KIDS",
            "KITS DE TREINO",
            "SHORTS",
            "BASQUETE / NBA",
            "CORTA-VENTO",
            "MUNDO FIFA",
            "CAMISAS RETRÔ",
          ];
          const forbiddenNav = [
            "COPA DO MUNDO",
            "JOGADOR",
            "KIT REGATA",
            "CONJUNTOS",
            "INFANTIL",
            "FEMININAS",
            "ACESSÓRIOS",
          ];'''
          new = '''const expectedNav = [
            "INÍCIO",
            "TORCEDOR",
            "JOGADOR",
            "FEMININO",
            "KIDS",
            "KITS DE TREINO",
            "SHORTS",
            "BASQUETE / NBA",
            "CORTA-VENTO",
            "MUNDO FIFA",
            "CAMISAS RETRÔ",
          ];
          const forbiddenNav = [
            "COPA DO MUNDO",
            "KIT REGATA",
            "CONJUNTOS",
            "INFANTIL",
            "FEMININAS",
            "ACESSÓRIOS",
          ];'''
          if old not in text:
              raise SystemExit('Expected legacy navigation block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit validator correction
        run: |
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add scripts/validate-storefront-upgrades.mjs
          git commit -m "test: atualizar taxonomia esperada do cabeçalho"
          git push origin HEAD:stage3-header-refinement-20260914
