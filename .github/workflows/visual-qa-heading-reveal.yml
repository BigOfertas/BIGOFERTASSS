name: Visual QA Heading Reveal

on:
  push:
    branches:
      - fix-heading-reveal-clipping-20260913
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-qa-heading-reveal
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate code
        run: bun run lint && bun run build

      - name: Install Playwright for visual QA
        run: |
          bun add --no-save playwright
          bunx playwright install chromium --with-deps

      - name: Start storefront locally
        shell: bash
        run: |
          set -euo pipefail
          bun run dev -- --host 127.0.0.1 > /tmp/dropbox-heading-vite.log 2>&1 &
          echo $! > /tmp/dropbox-heading-vite.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dropbox-heading-vite.log
          exit 1

      - name: Capture desktop tablet and mobile headings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p heading-qa
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const viewports = [
            ['desktop', { width: 1440, height: 900 }],
            ['tablet', { width: 768, height: 1024 }],
            ['mobile', { width: 390, height: 844 }],
          ];
          const headings = [
            ['lancamentos', 'Lançamentos'],
            ['monte-seu-pedido', 'Monte seu pedido'],
            ['encontre-seu-time', 'Encontre seu time'],
            ['compre-por-liga', 'Compre por liga'],
            ['perguntas-frequentes', 'Perguntas frequentes'],
          ];

          for (const [viewportName, viewport] of viewports) {
            const page = await browser.newPage({ viewportSize: viewport, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:8080/', { waitUntil: 'networkidle' });
            await page.waitForTimeout(3200);

            const cookieAccept = page.getByRole('button', { name: /aceitar todos/i });
            if (await cookieAccept.count()) {
              await cookieAccept.first().click();
              await page.waitForTimeout(250);
            }

            for (const [slug, title] of headings) {
              const heading = page.locator('h2').filter({ hasText: title }).first();
              await heading.scrollIntoViewIfNeeded();
              await page.waitForTimeout(900);

              const reveal = heading.locator('[data-slide-up-reveal]').first();
              const overflowIsSafe = await reveal.evaluate((root) => {
                const nodes = [root, ...root.querySelectorAll('[data-slide-word], [data-slide-character]')];
                return nodes.every((node) => {
                  const style = getComputedStyle(node);
                  return style.overflowX === 'visible' && style.overflowY === 'visible';
                });
              });
              if (!overflowIsSafe) throw new Error(`Unsafe clipping found: ${title}`);

              const wordSpacingIsVisible = await reveal.evaluate((root) => {
                const words = Array.from(root.querySelectorAll('[data-slide-word]'));
                if (words.length < 2) return true;
                return words.slice(0, -1).every((word) => {
                  const lastChild = word.lastElementChild;
                  return lastChild ? lastChild.getBoundingClientRect().width > 1 : false;
                });
              });
              if (!wordSpacingIsVisible) throw new Error(`Collapsed word spacing found: ${title}`);

              const box = await heading.boundingBox();
              if (!box) throw new Error(`Heading not found: ${title}`);
              const padding = 36;
              const pageWidth = await page.evaluate(() => document.documentElement.scrollWidth);
              const clip = {
                x: Math.max(0, box.x - padding),
                y: Math.max(0, box.y - padding),
                width: Math.min(pageWidth, box.width + padding * 2),
                height: box.height + padding * 2,
              };
              await page.screenshot({
                path: `heading-qa/${viewportName}-${slug}.png`,
                clip,
              });
            }

            await page.close();
          }

          await browser.close();
          NODE

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: heading-reveal-visual-qa-${{ github.sha }}
          path: heading-qa/*.png
          if-no-files-found: error
          retention-days: 1
