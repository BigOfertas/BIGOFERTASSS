name: Dark All Pages Workbench

on:
  push:
    branches:
      - fix-dark-all-pages-20260915
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dark-all-pages-workbench
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dark mode on every visual route and component
        run: node scripts/validate-dark-mode-coverage.mjs

      - name: Validate Stage 6
        run: node scripts/validate-stage6-i18n.mjs

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Hostinger build
        run: bun run build:hostinger
