name: Temporary Email Diagnostic

on:
  push:
    branches:
      - email-diagnostic-20260911
    paths:
      - ".github/workflows/temporary-email-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Inspect Supabase Auth mail configuration
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" > /tmp/auth-config.json
          jq '{site_url,external_email_enabled,mailer_autoconfirm,smtp_configured:((((.smtp_host // "")|length)>0) and (((.smtp_admin_email // "")|length)>0)),smtp_host:(.smtp_host // null),smtp_port:(.smtp_port // null),smtp_admin_email:(.smtp_admin_email // null),smtp_sender_name:(.smtp_sender_name // null),rate_limit_email_sent:(.rate_limit_email_sent // null)}' /tmp/auth-config.json

      - name: Check required Edge Function secrets exist
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets list --project-ref "$SUPABASE_PROJECT_ID" --output json > /tmp/secrets.json
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/secrets.json','utf8'));const rows=Array.isArray(p)?p:(p.secrets||[]);const names=new Set(rows.map(r=>r.name).filter(Boolean));const req=['RESEND_API_KEY','RESEND_FROM','EMAIL_2FA_SECRET','PUBLIC_SITE_URL','APP_ALLOWED_ORIGINS'];console.log(JSON.stringify(Object.fromEntries(req.map(n=>[n,names.has(n)])),null,2));"

      - name: Inspect public email DNS
        shell: bash
        run: |
          set -euo pipefail
          for q in 'bigofertas.net TXT' 'bigofertas.net MX' 'send.bigofertas.net TXT' 'send.bigofertas.net MX' '_dmarc.bigofertas.net TXT' 'resend._domainkey.bigofertas.net TXT' 'resend._domainkey.bigofertas.net CNAME'; do
            set -- $q
            NAME="$1"; TYPE="$2"
            echo "### $NAME $TYPE"
            curl -fsS -G -H 'accept: application/dns-json' --data-urlencode "name=$NAME" --data-urlencode "type=$TYPE" https://dns.google/resolve | jq '{Status,Answer:[(.Answer // [])[]?.data]}'
          done
