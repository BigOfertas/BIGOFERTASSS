name: Temporary Remove Product Description Sentence

on:
  push:
    branches:
      - remove-product-description-sentence-20260911
    paths:
      - ".github/workflows/temporary-remove-description-sentence.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v7
        with:
          ref: remove-product-description-sentence-20260911

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Remove sentence from every catalog generator and wire migration deploy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          long_sentence = "Disponível com as opções de tamanho e personalização configuradas pela BIGofertas."
          short_sentence = "Disponível com as opções configuradas pela BIGofertas."
          generator_paths = [
              Path("scripts/catalog-brasileirao-plan.mjs"),
              Path("scripts/catalog-nba-plan.mjs"),
              Path("scripts/catalog-retro-plan.mjs"),
              Path("scripts/catalog-mundo-fifa-plan.mjs"),
              Path("scripts/catalog-pdf-remaining-plan.mjs"),
              Path("scripts/google-photos-catalog-pipeline.mjs"),
          ]

          for path in generator_paths:
              text = path.read_text(encoding="utf-8")
              text = text.replace(f'  parts.push("{long_sentence}");\n', "")
              text = text.replace(f'  parts.push("{short_sentence}");\n', "")
              text = text.replace(f" {long_sentence}", "")
              text = text.replace(f" {short_sentence}", "")
              path.write_text(text, encoding="utf-8")

          deploy_path = Path("scripts/deploy-storefront-upgrade-migrations.mjs")
          deploy = deploy_path.read_text(encoding="utf-8")
          migration_name = "remove_generic_product_description_sentence_20260911"
          if migration_name not in deploy:
              anchor = '''  [
    "stage2_patch_reconciliation_20260911",
    "supabase/migrations/20260911061000_stage2_patch_reconciliation.sql",
  ],
'''
              addition = anchor + '''  [
    "remove_generic_product_description_sentence_20260911",
    "supabase/migrations/20260911102000_remove_generic_product_description_sentence.sql",
  ],
'''
              if anchor not in deploy:
                  raise SystemExit("Migration list anchor not found")
              deploy = deploy.replace(anchor, addition, 1)

          if "product_description_cleanup_trigger" not in deploy:
              query_anchor = '''  exists (
    select 1 from pg_catalog.pg_proc p
    join pg_catalog.pg_namespace n on n.oid = p.pronamespace
    where n.nspname = 'public' and p.proname = 'storefront_product_priority'
  ) as stage2_storefront_priority_rpc;
'''
              query_replacement = '''  exists (
    select 1 from pg_catalog.pg_proc p
    join pg_catalog.pg_namespace n on n.oid = p.pronamespace
    where n.nspname = 'public' and p.proname = 'storefront_product_priority'
  ) as stage2_storefront_priority_rpc,
  exists (
    select 1 from pg_catalog.pg_trigger t
    join pg_catalog.pg_class c on c.oid = t.tgrelid
    join pg_catalog.pg_namespace n on n.oid = c.relnamespace
    where n.nspname = 'public'
      and c.relname = 'products'
      and t.tgname = 'clean_product_description_before_write'
      and not t.tgisinternal
  ) as product_description_cleanup_trigger,
  not exists (
    select 1
    from public.products p
    where p.description ~* 'Disponível com as opções( de tamanho e personalização)? configuradas pela (BIGofertas|DropBox)\\.'
  ) as product_description_cleanup_complete;
'''
              if query_anchor not in deploy:
                  raise SystemExit("Verification query anchor not found")
              deploy = deploy.replace(query_anchor, query_replacement, 1)

              required_anchor = '''  "stage2_storefront_priority_rpc",
];
'''
              required_replacement = '''  "stage2_storefront_priority_rpc",
  "product_description_cleanup_trigger",
  "product_description_cleanup_complete",
];
'''
              if required_anchor not in deploy:
                  raise SystemExit("Required verification anchor not found")
              deploy = deploy.replace(required_anchor, required_replacement, 1)

          deploy_path.write_text(deploy, encoding="utf-8")

          workflow_path = Path(".github/workflows/deploy-storefront-upgrades-backend.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          migration_path = '      - "supabase/migrations/20260911102000_remove_generic_product_description_sentence.sql"\n'
          if migration_path not in workflow:
              anchor = '      - "supabase/migrations/20260911061000_stage2_patch_reconciliation.sql"\n'
              if anchor not in workflow:
                  raise SystemExit("Backend workflow path anchor not found")
              workflow = workflow.replace(anchor, anchor + migration_path, 1)
          workflow_path.write_text(workflow, encoding="utf-8")
          PY

      - name: Format changed files
        run: |
          bunx prettier --write \
            scripts/catalog-brasileirao-plan.mjs \
            scripts/catalog-nba-plan.mjs \
            scripts/catalog-retro-plan.mjs \
            scripts/catalog-mundo-fifa-plan.mjs \
            scripts/catalog-pdf-remaining-plan.mjs \
            scripts/google-photos-catalog-pipeline.mjs \
            scripts/deploy-storefront-upgrade-migrations.mjs \
            .github/workflows/deploy-storefront-upgrades-backend.yml

      - name: Verify sentence is gone from generators
        shell: bash
        run: |
          set -euo pipefail
          if grep -F -n -e 'Disponível com as opções configuradas pela BIGofertas.' -e 'Disponível com as opções de tamanho e personalização configuradas pela BIGofertas.' \
            scripts/catalog-brasileirao-plan.mjs \
            scripts/catalog-nba-plan.mjs \
            scripts/catalog-retro-plan.mjs \
            scripts/catalog-mundo-fifa-plan.mjs \
            scripts/catalog-pdf-remaining-plan.mjs \
            scripts/google-photos-catalog-pipeline.mjs; then
            echo "Generic description sentence still exists in a catalog generator." >&2
            exit 1
          fi

      - name: Validate JavaScript syntax
        run: |
          node --check scripts/deploy-storefront-upgrade-migrations.mjs
          node --check scripts/google-photos-catalog-pipeline.mjs
          node --check scripts/catalog-brasileirao-plan.mjs
          node --check scripts/catalog-nba-plan.mjs
          node --check scripts/catalog-retro-plan.mjs
          node --check scripts/catalog-mundo-fifa-plan.mjs
          node --check scripts/catalog-pdf-remaining-plan.mjs

      - name: Lint storefront
        run: bun run lint

      - name: Validate production build
        run: bun run build

      - name: Commit finalized cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add \
            scripts/catalog-brasileirao-plan.mjs \
            scripts/catalog-nba-plan.mjs \
            scripts/catalog-retro-plan.mjs \
            scripts/catalog-mundo-fifa-plan.mjs \
            scripts/catalog-pdf-remaining-plan.mjs \
            scripts/google-photos-catalog-pipeline.mjs \
            scripts/deploy-storefront-upgrade-migrations.mjs \
            .github/workflows/deploy-storefront-upgrades-backend.yml
          if git diff --cached --quiet; then
            echo "NO_FINALIZE_CHANGES"
            exit 0
          fi
          git commit -m "fix: permanently remove generic product description sentence"
          git push origin HEAD:remove-product-description-sentence-20260911
