name: QA Brasileirao Crests Production

on:
  push:
    branches:
      - qa-brasileirao-crests-prod-20260917

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v7

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production team crest section
        run: node scripts/qa-brasileirao-crests-prod.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-brasileirao-crests-prod
          path: qa-brasileirao-crests-prod/
          if-no-files-found: error
          retention-days: 3
