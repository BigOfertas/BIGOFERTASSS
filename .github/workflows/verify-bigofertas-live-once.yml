name: Verify BIGofertas Live Once

on:
  push:
    branches:
      - hostinger-dispatch-once-20260909
    paths:
      - .verify/bigofertas-live-20260909

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@latest
          npx playwright install --with-deps chromium

      - name: Verify live catalog and product purchase UI
        run: |
          cat > ./verify-live.cjs <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const failures = [];
            page.on('pageerror', (error) => failures.push(`pageerror:${error.message}`));

            await page.goto('https://bigofertas.net/products', {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForSelector('a[aria-label^="Ver "]', { timeout: 45000 });
            await page.waitForTimeout(1500);

            const cards = await page.locator('a[aria-label^="Ver "]').evaluateAll((nodes) =>
              nodes.map((node) => ({
                label: node.getAttribute('aria-label') || '',
                href: node.getAttribute('href') || '',
              })),
            );
            if (cards.length !== 10) throw new Error(`LIVE_PRODUCT_COUNT_${cards.length}`);

            const expected = [
              'Chelsea — Camisa I 26/27 Nike',
              'Chelsea — Camisa II 26/27 Nike',
              'Manchester City — Camisa II 26/27 Puma',
              'Bayern — Camisa I 26/27 Adidas',
              'Bayern — Camisa II 26/27 Adidas',
              'Barcelona — Camisa II 26/27 Nike',
              'PSG — Camisa I 26/27 Nike',
              'Lyon — Camisa II 26/27 Adidas',
              'Milan — Camisa II 26/27 Puma',
              'Napoli — Camisa I 26/26 EA7',
            ];
            for (const name of expected) {
              if (!cards.some((card) => card.label.includes(name))) {
                throw new Error(`LIVE_PRODUCT_MISSING_${name}`);
              }
            }

            const imageLocators = page.locator('a[aria-label^="Ver "] img');
            const imageCount = await imageLocators.count();
            if (imageCount !== 10) throw new Error(`LIVE_CARD_IMAGE_COUNT_${imageCount}`);
            for (let index = 0; index < imageCount; index += 1) {
              const image = imageLocators.nth(index);
              await image.scrollIntoViewIfNeeded();
              await image.evaluate((node) => { node.loading = 'eager'; });
              const handle = await image.elementHandle();
              await page.waitForFunction(
                (node) => Boolean(node && node.complete && node.naturalWidth > 0),
                handle,
                { timeout: 15000 },
              );
            }
            const cardImages = await imageLocators.evaluateAll((nodes) =>
              nodes.map((img) => ({ src: img.currentSrc || img.src, width: img.naturalWidth })),
            );
            if (cardImages.some((image) => !image.src.includes('googleusercontent.com') || image.width <= 0)) {
              console.log(JSON.stringify(cardImages, null, 2));
              throw new Error('LIVE_CARD_IMAGE_SOURCE_OR_LOAD_FAILURE');
            }

            const chelsea = page.locator('a[aria-label="Ver Chelsea — Camisa I 26/27 Nike"]').first();
            const href = await chelsea.getAttribute('href');
            if (!href || !href.startsWith('/product/')) throw new Error(`LIVE_CHELSEA_HREF_${href}`);
            await chelsea.click();
            await page.waitForURL(/\/product\//, { timeout: 30000 });
            await page.waitForTimeout(2500);

            const bodyText = await page.locator('body').innerText();
            if (!bodyText.includes('Chelsea — Camisa I 26/27 Nike')) throw new Error('LIVE_DETAIL_NAME_MISSING');
            if (!bodyText.includes('Você pode escolher mais de um.')) throw new Error('LIVE_MULTIPATCH_COPY_MISSING');
            if (!bodyText.includes('R$ 15,00') && !bodyText.includes('R$ 15,00')) {
              throw new Error('LIVE_PATCH_PRICE_MISSING');
            }

            const patchFieldset = page.locator('fieldset').filter({ hasText: 'Patches' }).first();
            await patchFieldset.waitFor({ state: 'visible', timeout: 15000 });
            const patchBoxes = patchFieldset.locator('input[type="checkbox"]');
            const patchCount = await patchBoxes.count();
            if (patchCount < 2) throw new Error(`LIVE_PATCH_OPTION_COUNT_${patchCount}`);
            await patchBoxes.nth(0).check();
            await patchBoxes.nth(1).check();
            if (!(await patchBoxes.nth(0).isChecked()) || !(await patchBoxes.nth(1).isChecked())) {
              throw new Error('LIVE_MULTIPATCH_SELECTION_FAILED');
            }

            const detailImages = page.locator('img[src*="googleusercontent.com"]');
            const detailImageCount = await detailImages.count();
            if (detailImageCount < 5) throw new Error(`LIVE_DETAIL_GOOGLE_IMAGE_COUNT_${detailImageCount}`);
            for (let index = 0; index < Math.min(detailImageCount, 5); index += 1) {
              const image = detailImages.nth(index);
              await image.scrollIntoViewIfNeeded();
              await image.evaluate((node) => { node.loading = 'eager'; });
              const handle = await image.elementHandle();
              await page.waitForFunction(
                (node) => Boolean(node && node.complete && node.naturalWidth > 0),
                handle,
                { timeout: 15000 },
              );
            }

            if (failures.length) throw new Error(`LIVE_PAGE_ERRORS_${failures.join('|')}`);

            console.log(`LIVE_CATALOG_OK products=${cards.length} cardGoogleImages=${cardImages.length}`);
            console.log(`LIVE_PRODUCT_DETAIL_OK googleImages=${detailImageCount} patches=${patchCount}`);
            console.log('LIVE_MULTIPATCH_OK selected=2');
            console.log('BIGOFERTAS_LIVE_VERIFICATION_OK');
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node ./verify-live.cjs
