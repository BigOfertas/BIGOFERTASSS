name: Prepare Kids First Branch Once

on:
  push:
    branches:
      - catalog-kids-first-deploy-20260909
    paths:
      - catalog-jobs/prepare-kids-first.json

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: catalog-kids-first-deploy-20260909

      - name: Correct current national titleholder rules
        run: |
          python - <<'PY'
          from pathlib import Path

          rules = Path('scripts/catalog-business-rules.mjs')
          text = rules.read_text()
          old = '''  if (national.key === "ESPANHA" && currentSeason2627(source)) {\n    addPatch(codes, "euro-titleholder");\n  }\n  if (national.key === "PORTUGAL" && currentSeason2627(source))\n    addPatch(codes, "nations-league-titleholder");\n  if (national.key === "ARGENTINA" && currentSeason2627(source)) {\n    addPatch(codes, "fifa-world-champions");\n    addPatch(codes, "copa-america-titleholder");\n  }'''
          new = '''  if (national.key === "ESPANHA" && currentSeason2627(source)) {\n    addPatch(codes, "fifa-world-champions");\n    addPatch(codes, "euro-titleholder");\n  }\n  if (national.key === "PORTUGAL" && currentSeason2627(source))\n    addPatch(codes, "nations-league-titleholder");\n  if (national.key === "ARGENTINA" && currentSeason2627(source)) {\n    addPatch(codes, "copa-america-titleholder");\n  }'''
          if old not in text:
              raise SystemExit('national rules target not found')
          rules.write_text(text.replace(old, new))

          validator = Path('scripts/validate-catalog-business-rules.mjs')
          text = validator.read_text()
          old_spain = '''    ["fifa-world-cup-2026", "euro", "euro-titleholder", "uefa-nations-league"],'''
          new_spain = '''    [\n      "fifa-world-cup-2026",\n      "fifa-world-champions",\n      "euro",\n      "euro-titleholder",\n      "uefa-nations-league",\n    ],'''
          if old_spain not in text:
              raise SystemExit('Spain validator target not found')
          text = text.replace(old_spain, new_spain, 1)
          old_arg = '''  ["fifa-world-champions", "copa-america-titleholder"],'''
          new_arg = '''  ["copa-america-titleholder"],'''
          if old_arg not in text:
              raise SystemExit('Argentina validator target not found')
          validator.write_text(text.replace(old_arg, new_arg, 1))
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format touched code
        run: bunx prettier --write scripts/catalog-business-rules.mjs scripts/validate-catalog-business-rules.mjs src/components/home/BestSellers.tsx scripts/deploy-home-launches-top10.mjs .github/workflows/deploy-storefront-upgrades-backend.yml

      - name: Validate business rules
        run: node scripts/validate-catalog-business-rules.mjs

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Commit preparation
        run: |
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add scripts/catalog-business-rules.mjs scripts/validate-catalog-business-rules.mjs src/components/home/BestSellers.tsx scripts/deploy-home-launches-top10.mjs supabase/migrations/20260909233000_home_launches_top10.sql .github/workflows/deploy-storefront-upgrades-backend.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "fix: finalize first catalog deployment rules"
            git push origin HEAD:catalog-kids-first-deploy-20260909
          fi
