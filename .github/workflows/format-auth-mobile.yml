name: One-time Format Auth and Mobile UI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-auth-mobile.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed UI files
        run: |
          bunx prettier --write \
            scripts/validate-storefront-upgrades.mjs \
            src/components/layout/Header.tsx \
            src/components/ui/auth-split-shell.tsx \
            src/components/ui/mobile-liquid-morph-menu.tsx \
            src/routes/login.tsx \
            src/routes/cadastro.tsx

      - name: Verify lint
        run: bun run lint

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add \
            scripts/validate-storefront-upgrades.mjs \
            src/components/layout/Header.tsx \
            src/components/ui/auth-split-shell.tsx \
            src/components/ui/mobile-liquid-morph-menu.tsx \
            src/routes/login.tsx \
            src/routes/cadastro.tsx
          git commit -m "style: format auth and mobile UI"
          git push origin HEAD:main
