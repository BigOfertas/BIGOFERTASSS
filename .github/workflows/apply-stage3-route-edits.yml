name: Apply Stage 3 Route Edits

on:
  push:
    branches:
      - storefront-media-seo-stage-3-20260908
    paths:
      - "scripts/apply-stage3-route-edits.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: storefront-media-seo-stage-3-20260908
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: node scripts/apply-stage3-route-edits.mjs
      - run: bunx prettier --write 'src/routes/product/$id.tsx' src/components/product/ProductSeo.tsx
      - name: Commit edits
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add 'src/routes/product/$id.tsx' src/components/product/ProductSeo.tsx
          git commit -m "feat: render product SEO from route data"
          git push origin HEAD:storefront-media-seo-stage-3-20260908
