name: Google Photos Definitive Catalog Pipeline

on:
  workflow_dispatch:
    inputs:
      album_url:
        description: "URL publica do album Google Photos"
        required: true
        type: string
      label:
        description: "Rotulo do lote"
        required: false
        type: string
      expected_min_images:
        description: "Minimo esperado de imagens"
        required: false
        default: "1"
        type: string
      max_scrolls:
        description: "Limite maximo de ciclos de rolagem"
        required: false
        default: "350"
        type: string
      default_stock:
        description: "Estoque inicial por variacao"
        required: false
        default: "999"
        type: string
      apply:
        description: "Gravar o lote no Supabase"
        required: false
        default: false
        type: boolean
      reset_catalog:
        description: "Zerar somente o catalogo antes desta carga"
        required: false
        default: false
        type: boolean
      activate:
        description: "Ativar produtos depois de validar"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: google-photos-definitive-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate pipeline code
        run: |
          node --check scripts/google-photos-collector.mjs
          node --check scripts/google-photos-assimilator.mjs
          node --check scripts/google-photos-assimilator-runner.mjs
          node --check scripts/google-photos-catalog-pipeline.mjs

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@latest
          npx playwright install --with-deps chromium

      - name: Collect Google Photos album
        run: |
          node scripts/google-photos-collector.mjs \
            --url "${{ inputs.album_url }}" \
            --label "${{ inputs.label }}" \
            --expected-min-images "${{ inputs.expected_min_images }}" \
            --max-scrolls "${{ inputs.max_scrolls }}" \
            --out .artifacts/google-photos-collector

      - name: Generate visual assimilation
        run: |
          node scripts/google-photos-assimilator-runner.mjs \
            --input .artifacts/google-photos-collector/collector.json \
            --out .artifacts/google-photos-collector/assimilation

      - name: Normalize, validate URLs and prepare catalog
        run: |
          FLAGS="--validate-urls --stock ${{ inputs.default_stock }}"
          if [[ "${{ inputs.apply }}" == "true" ]]; then FLAGS="$FLAGS --apply"; fi
          if [[ "${{ inputs.reset_catalog }}" == "true" ]]; then FLAGS="$FLAGS --reset"; fi
          if [[ "${{ inputs.activate }}" == "true" ]]; then FLAGS="$FLAGS --activate"; fi
          node scripts/google-photos-catalog-pipeline.mjs $FLAGS

      - name: Upload catalog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-photos-definitive-catalog-${{ github.run_id }}
          path: .artifacts/google-photos-collector/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
