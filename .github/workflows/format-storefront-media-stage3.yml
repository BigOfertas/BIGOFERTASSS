name: Format Storefront Media Stage 3

on:
  push:
    branches:
      - storefront-media-seo-stage-3-20260908

permissions:
  contents: write

concurrency:
  group: format-storefront-media-stage3
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: storefront-media-seo-stage-3-20260908
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format stage three files
        run: |
          bunx prettier --write \
            cloudflare/hostinger-product-seo-worker.ts \
            scripts/validate-storefront-upgrades.mjs \
            scripts/validate-storefront-media-stage3.mjs \
            src/components/product/ProductGallery.tsx \
            src/lib/admin-product-images.ts \
            src/lib/catalog.ts \
            src/lib/product-detail.ts \
            src/lib/product-images.ts \
            src/lib/product-seo.ts \
            src/integrations/supabase/types.ts \
            supabase/functions/_shared/r2.ts \
            supabase/functions/r2-image-presign/index.ts \
            supabase/functions/r2-image-complete/index.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "BigOfertas"
          git config user.email "contato@bigofertas.net"
          git add cloudflare scripts src supabase/functions
          git commit -m "style: format stage three implementation"
          git push origin HEAD:storefront-media-seo-stage-3-20260908
