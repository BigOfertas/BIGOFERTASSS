name: QA Stage 3 Header Production Final

on:
  push:
    branches:
      - qa-stage3-header-production-20260914

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact published main SHA
        uses: actions/checkout@v7
        with:
          ref: 9dcb0f421aa10ad41bb8579a2caf67b978297bbe

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run remaining production QA
        env:
          BASE_URL: https://bigofertas.net
        run: |
          mkdir -p qa-shots
          cat > stage3-header-production-final.mjs <<'JS'
          import { chromium } from 'playwright';

          const BASE_URL = process.env.BASE_URL;
          const browser = await chromium.launch({ headless: true });
          const result = {
            publishedSha: '9dcb0f421aa10ad41bb8579a2caf67b978297bbe',
            mobile: {}, filters: {}, search: {}, logoClick: null,
            consoleErrors: [], pageErrors: [], failedRequests: [], httpErrors: [], rpcBodies: [],
          };
          const labels = [
            'INÍCIO', 'TORCEDOR', 'JOGADOR', 'FEMININO', 'KIDS', 'KITS DE TREINO',
            'SHORTS', 'BASQUETE / NBA', 'CORTA-VENTO', 'MUNDO FIFA', 'CAMISAS RETRÔ',
          ];
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const unique = (array, value) => {
            const key = JSON.stringify(value);
            if (!array.some((item) => JSON.stringify(item) === key)) array.push(value);
          };
          const near = (a, b, t = 0.7) => Boolean(a && b && Math.abs(a.x-b.x)<=t && Math.abs(a.y-b.y)<=t && Math.abs(a.width-b.width)<=t && Math.abs(a.height-b.height)<=t);

          function diagnostics(page, label) {
            page.on('console', (msg) => { if (msg.type() === 'error') unique(result.consoleErrors, { label, text: msg.text().slice(0, 900) }); });
            page.on('pageerror', (error) => unique(result.pageErrors, { label, text: String(error).slice(0, 900) }));
            page.on('requestfailed', (request) => {
              const url = request.url(); const error = request.failure()?.errorText ?? 'unknown';
              if ((url.includes('bigofertas.net') || url.includes('supabase.co')) && !/ERR_ABORTED/i.test(error)) unique(result.failedRequests, { label, url: url.slice(0,650), error });
            });
            page.on('response', (response) => {
              const url = response.url();
              if (response.status() >= 400 && (url.includes('bigofertas.net') || url.includes('supabase.co'))) unique(result.httpErrors, { label, status: response.status(), url: url.slice(0,650) });
            });
            page.on('request', (request) => {
              if (request.method() === 'POST' && request.url().includes('/rest/v1/rpc/catalog_products_page_v3')) {
                try { result.rpcBodies.push({ label, body: request.postDataJSON() }); } catch { result.rpcBodies.push({ label, body: request.postData() }); }
              }
            });
          }

          async function waitHeader(page) {
            await page.waitForSelector('header.glass-header', { state: 'visible', timeout: 22000 });
            await page.waitForTimeout(350);
          }

          async function focusLogoByKeyboard(page, logo) {
            await page.evaluate(() => {
              if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
            });
            for (let i = 0; i < 20; i += 1) {
              await page.keyboard.press('Tab');
              const focused = await logo.evaluate((el) => document.activeElement === el);
              if (focused) return true;
            }
            return false;
          }

          async function testMobile(width) {
            const context = await browser.newContext({ viewport: { width, height: width === 390 ? 844 : 900 }, isMobile: width === 390, hasTouch: true });
            const page = await context.newPage();
            diagnostics(page, `mobile-${width}`);
            await page.goto(BASE_URL, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await waitHeader(page);
            assert(!(await page.evaluate(() => document.documentElement.scrollWidth > innerWidth + 2)), `${width}px: overflow inicial`);

            const logo = page.locator('header.glass-header a[aria-label$=" - Início"]:visible').first();
            await logo.waitFor({ state: 'visible', timeout: 10000 });
            const lock = logo.locator('.brand-lockup');
            const before = await lock.boundingBox();
            const beforeTransform = await lock.evaluate((el) => getComputedStyle(el).transform);
            assert(['none','matrix(1, 0, 0, 1, 0, 0)'].includes(beforeTransform), `${width}px: logo transformada no repouso`);

            assert(await focusLogoByKeyboard(page, logo), `${width}px: teclado não alcançou a logo`);
            await page.waitForTimeout(100);
            const keyFocusedBox = await lock.boundingBox();
            const focusStyle = await logo.evaluate((el) => {
              const s = getComputedStyle(el); return { outlineStyle: s.outlineStyle, outlineWidth: s.outlineWidth };
            });
            assert(near(before, keyFocusedBox), `${width}px: logo muda no foco por teclado`);
            assert(focusStyle.outlineStyle !== 'none' && parseFloat(focusStyle.outlineWidth) >= 1, `${width}px: foco por teclado não está visível`);

            await logo.evaluate((el) => el.addEventListener('click', (event) => event.preventDefault(), { once: true }));
            await logo.tap();
            await page.waitForTimeout(120);
            assert(near(before, await lock.boundingBox()), `${width}px: logo muda após touch`);
            const touchTransform = await lock.evaluate((el) => getComputedStyle(el).transform);
            assert(['none','matrix(1, 0, 0, 1, 0, 0)'].includes(touchTransform), `${width}px: logo ganha transform no touch`);

            const input = page.locator('input[aria-label="Buscar produtos"]:visible').first();
            await input.waitFor({ state: 'visible', timeout: 10000 });
            const inputBox = await input.boundingBox();
            const normal = await input.evaluate((el) => { const s=getComputedStyle(el); return { borderColor:s.borderColor, borderWidth:s.borderWidth, boxShadow:s.boxShadow, transform:s.transform }; });
            assert(parseFloat(normal.borderWidth) >= 1 && normal.transform === 'none', `${width}px: busca sem destaque estável`);
            await input.tap();
            await page.waitForTimeout(180);
            const focused = await input.evaluate((el) => { const s=getComputedStyle(el); return { borderColor:s.borderColor, boxShadow:s.boxShadow, transform:s.transform }; });
            assert(near(inputBox, await input.boundingBox()), `${width}px: busca muda no foco`);
            assert(focused.transform === 'none', `${width}px: busca se desloca no foco`);
            assert(focused.borderColor !== normal.borderColor || focused.boxShadow !== normal.boxShadow, `${width}px: busca sem foco visível`);

            const menu = page.getByRole('button', { name: 'Abrir menu de categorias' });
            await menu.click();
            await page.getByText('Todas as categorias', { exact: true }).waitFor({ state:'visible', timeout:8000 });
            for (const label of labels) await page.getByRole('button', { name: label, exact: true }).waitFor({ state:'visible', timeout:8000 });
            assert(!(await page.evaluate(() => document.documentElement.scrollWidth > innerWidth + 2)), `${width}px: drawer com overflow`);
            await page.screenshot({ path:`qa-shots/header-${width}-final.png`, fullPage:false });

            const data = { noOverflow:true, allCategories:true, logoKeyboardFocus:true, logoTouchStable:true, searchFocusStable:true };
            await context.close();
            return data;
          }

          async function testMobileNavigation(width, label, type) {
            const context = await browser.newContext({ viewport:{ width, height: width === 390 ? 844 : 900 }, isMobile: width === 390, hasTouch:true });
            const page = await context.newPage(); diagnostics(page, `mobile-nav-${width}`);
            await page.goto(BASE_URL, { waitUntil:'domcontentloaded', timeout:45000 }); await waitHeader(page);
            await page.getByRole('button', { name:'Abrir menu de categorias' }).click();
            const button = page.getByRole('button', { name:label, exact:true }); await button.waitFor({ state:'visible', timeout:8000 });
            await Promise.all([
              page.waitForURL((u)=>u.pathname==='/products' && u.searchParams.get('commercialType')===type,{timeout:25000}),
              button.click(),
            ]);
            assert(new URL(page.url()).searchParams.get('commercialType')===type, `${label} móvel não navegou`);
            await context.close(); return { works:true };
          }

          async function testFilter(page, label, type) {
            await page.goto(BASE_URL,{waitUntil:'domcontentloaded',timeout:45000}); await waitHeader(page);
            const nav=page.locator('nav[aria-label="Categorias"]:visible'); await nav.waitFor({state:'visible',timeout:10000});
            const start=result.rpcBodies.length;
            await Promise.all([
              page.waitForURL((u)=>u.pathname==='/products'&&u.searchParams.get('commercialType')===type,{timeout:25000}),
              nav.getByRole('link',{name:label,exact:true}).click(),
            ]);
            await page.waitForSelector('[data-product-card]',{state:'visible',timeout:25000}); await page.waitForTimeout(450);
            const cards=await page.locator('[data-product-card]').count(); assert(cards>0, `${label}: sem produtos reais`);
            assert(result.rpcBodies.slice(start).some((x)=>x.body?.p_commercial_type===type), `${label}: RPC sem commercial_type`);
            const reloadStart=result.rpcBodies.length; await page.reload({waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForSelector('[data-product-card]',{state:'visible',timeout:25000}); await page.waitForTimeout(450);
            assert(new URL(page.url()).searchParams.get('commercialType')===type, `${label}: refresh perdeu filtro`);
            assert(result.rpcBodies.slice(reloadStart).some((x)=>x.body?.p_commercial_type===type), `${label}: refresh sem commercial_type`);
            return { url:page.url(), cards, clickStructured:true, refreshStructured:true };
          }

          async function testSearch(width, mobile) {
            const context=await browser.newContext({viewport:{width,height:mobile?844:900},isMobile:mobile,hasTouch:mobile});
            const page=await context.newPage(); diagnostics(page,`search-${width}`);
            await page.goto(BASE_URL,{waitUntil:'domcontentloaded',timeout:45000}); await waitHeader(page);
            const input=page.locator('input[aria-label="Buscar produtos"]:visible').first(); await input.waitFor({state:'visible',timeout:10000});
            const before=await input.boundingBox(); await input.fill('Real Madrid');
            await page.waitForFunction(()=>{const t=document.body.innerText;return t.includes('Ver todos os resultados')||t.includes('Nenhum produto encontrado agora.')||t.includes('Buscando produtos...');},null,{timeout:15000});
            await page.waitForTimeout(900); assert(near(before,await input.boundingBox()),`${width}px: input muda ao digitar`);
            const suggestions=await page.getByText('Ver todos os resultados',{exact:true}).isVisible().catch(()=>false);
            const empty=await page.getByText('Nenhum produto encontrado agora.',{exact:true}).isVisible().catch(()=>false);
            assert(suggestions||empty,`${width}px: autocomplete não estabilizou`);
            await input.press('Enter');
            await page.waitForURL((u)=>u.pathname==='/products'&&u.searchParams.get('q')==='Real Madrid',{timeout:25000});
            await page.waitForSelector('[data-product-card]',{state:'visible',timeout:25000});
            const cards=await page.locator('[data-product-card]').count(); assert(cards>0,`${width}px: busca Enter sem resultados`);
            const data={autocomplete:true,enter:true,cards,url:page.url()}; await context.close(); return data;
          }

          try {
            result.mobile['768']=await testMobile(768);
            result.mobile['390']=await testMobile(390);
            result.mobile['768'].jogadorNavigation=(await testMobileNavigation(768,'JOGADOR','jogador')).works;
            result.mobile['390'].torcedorNavigation=(await testMobileNavigation(390,'TORCEDOR','torcedor')).works;

            const context=await browser.newContext({viewport:{width:1440,height:900}}); const page=await context.newPage(); diagnostics(page,'desktop-filters');
            result.filters.torcedor=await testFilter(page,'TORCEDOR','torcedor');
            result.filters.jogador=await testFilter(page,'JOGADOR','jogador');
            await page.goto(`${BASE_URL}/products?commercialType=torcedor`,{waitUntil:'domcontentloaded',timeout:45000}); await waitHeader(page);
            const logo=page.locator('header.glass-header a[aria-label$=" - Início"]:visible').first();
            await Promise.all([page.waitForURL((u)=>u.pathname==='/',{timeout:20000}),logo.click()]);
            result.logoClick={works:true,url:page.url()}; await context.close();

            result.search.desktop1440=await testSearch(1440,false);
            result.search.mobile390=await testSearch(390,true);

            const relevantConsole=result.consoleErrors.filter(({text})=>/hydration|cors|rpc|failed to fetch|uncaught|typeerror|referenceerror|syntaxerror/i.test(text));
            result.relevantDiagnostics={consoleErrors:relevantConsole,pageErrors:result.pageErrors,failedRequests:result.failedRequests,httpErrors:result.httpErrors};
            console.log('STAGE3_HEADER_PRODUCTION_FINAL_RESULT='+JSON.stringify(result));
            assert(relevantConsole.length===0,'console errors relevantes'); assert(result.pageErrors.length===0,'page errors');
            assert(result.failedRequests.length===0,'requests falhos'); assert(result.httpErrors.length===0,'4xx/5xx relevantes');
            console.log('STAGE3_HEADER_PRODUCTION_FINAL_OK');
          } catch(error) {
            console.log('STAGE3_HEADER_PRODUCTION_FINAL_PARTIAL='+JSON.stringify(result)); throw error;
          } finally { await browser.close(); }
          JS
          node ./stage3-header-production-final.mjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-header-production-final-shots
          path: qa-shots/*.png
          if-no-files-found: ignore
