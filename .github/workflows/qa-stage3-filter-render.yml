name: QA Stage 3 Filter Render

on:
  push:
    branches:
      - qa-stage3-filter-render-20260914

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout published production SHA
        uses: actions/checkout@v7
        with:
          ref: 9dcb0f421aa10ad41bb8579a2caf67b978297bbe

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Diagnose and validate Torcedor/Jogador rendering
        env:
          BASE_URL: https://bigofertas.net
        run: |
          node <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const BASE_URL = process.env.BASE_URL;
          const report = { tests: [], consoleErrors: [], pageErrors: [], failedRequests: [], httpErrors: [] };
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          function attachDiagnostics(page, label) {
            page.on('console', (msg) => { if (msg.type() === 'error') report.consoleErrors.push({ label, text: msg.text().slice(0,1000) }); });
            page.on('pageerror', (err) => report.pageErrors.push({ label, text: String(err).slice(0,1000) }));
            page.on('requestfailed', (req) => {
              if (req.url().includes('bigofertas.net') || req.url().includes('supabase.co')) report.failedRequests.push({ label, url:req.url().slice(0,700), error:req.failure()?.errorText });
            });
            page.on('response', (res) => {
              if (res.status() >= 400 && (res.url().includes('bigofertas.net') || res.url().includes('supabase.co'))) report.httpErrors.push({ label, status:res.status(), url:res.url().slice(0,700) });
            });
          }

          function rpcBody(response) {
            try { return response.request().postDataJSON(); } catch { return null; }
          }

          async function waitTargetRpc(page, type) {
            return page.waitForResponse((response) => {
              if (!response.url().includes('/rest/v1/rpc/catalog_products_page_v3')) return false;
              const body = rpcBody(response);
              return body?.p_commercial_type === type && body?.p_category === null && body?.p_campeonato === null && body?.p_liga === null && body?.p_time === null && body?.p_page === 1 && body?.p_page_size === 24;
            }, { timeout: 40000 });
          }

          async function snapshotUi(page) {
            await page.waitForTimeout(1200);
            return page.evaluate(() => ({
              url: location.href,
              cards: document.querySelectorAll('[data-product-card]').length,
              productLinks: document.querySelectorAll('a[href^="/produto"],a[href^="/products/"]').length,
              text: document.body.innerText.slice(0,5000),
              rootHtmlExcerpt: document.querySelector('main')?.innerHTML.slice(0,5000) ?? '',
            }));
          }

          async function test(type, label, width, mobile) {
            const context = await browser.newContext({ viewport:{ width, height: mobile ? 844 : 900 }, isMobile:mobile, hasTouch:mobile });
            const page = await context.newPage();
            const diagLabel = `${label}-${width}`;
            attachDiagnostics(page, diagLabel);
            await page.goto(BASE_URL, { waitUntil:'domcontentloaded', timeout:45000 });
            await page.waitForSelector('header.glass-header', { state:'visible', timeout:20000 });

            const responsePromise = waitTargetRpc(page, type);
            if (mobile) {
              await page.getByRole('button', { name:'Abrir menu de categorias' }).click();
              await page.getByRole('button', { name:label, exact:true }).click();
            } else {
              const nav = page.locator('nav[aria-label="Categorias"]:visible');
              await nav.getByRole('link', { name:label, exact:true }).click();
            }
            await page.waitForURL((u)=>u.pathname==='/products' && u.searchParams.get('commercialType')===type, { timeout:20000 });
            const response = await responsePromise;
            const json = await response.json().catch(()=>null);
            const first = json?.items?.[0] ?? null;
            const rpc = { status:response.status(), body:rpcBody(response), total:json?.total ?? null, page:json?.page ?? null, pageSize:json?.pageSize ?? null, totalPages:json?.totalPages ?? null, itemCount:Array.isArray(json?.items)?json.items.length:null, first };
            const clicked = await snapshotUi(page);

            const reloadPromise = waitTargetRpc(page, type);
            await page.reload({ waitUntil:'domcontentloaded', timeout:45000 });
            const reloadResponse = await reloadPromise;
            const reloadJson = await reloadResponse.json().catch(()=>null);
            const reloaded = await snapshotUi(page);

            const result = {
              label, type, width, mobile,
              rpc,
              clicked,
              reloadRpc:{ status:reloadResponse.status(), total:reloadJson?.total ?? null, itemCount:Array.isArray(reloadJson?.items)?reloadJson.items.length:null, body:rpcBody(reloadResponse) },
              reloaded,
            };
            report.tests.push(result);
            console.log('STAGE3_RENDER_TEST='+JSON.stringify(result));
            await context.close();
          }

          try {
            for (const spec of [
              ['torcedor','TORCEDOR',1440,false],
              ['jogador','JOGADOR',1440,false],
              ['torcedor','TORCEDOR',390,true],
              ['jogador','JOGADOR',390,true],
            ]) await test(...spec);

            for (const t of report.tests) {
              assert(t.rpc.status === 200, `${t.label} ${t.width}: RPC status ${t.rpc.status}`);
              assert(t.rpc.itemCount > 0, `${t.label} ${t.width}: RPC sem itens`);
              assert(t.clicked.cards > 0, `${t.label} ${t.width}: clique retornou RPC com itens mas UI sem cards. Texto: ${t.clicked.text.slice(0,700)}`);
              assert(t.reloadRpc.status === 200 && t.reloadRpc.itemCount > 0, `${t.label} ${t.width}: refresh RPC inválido`);
              assert(t.reloaded.cards > 0, `${t.label} ${t.width}: refresh sem cards`);
              assert(new URL(t.clicked.url).searchParams.get('commercialType') === t.type, `${t.label}: URL incorreta`);
              assert(new URL(t.reloaded.url).searchParams.get('commercialType') === t.type, `${t.label}: refresh perdeu filtro`);
            }
            assert(report.pageErrors.length===0, 'pageErrors encontrados');
            assert(report.failedRequests.length===0, 'requests falhos encontrados');
            assert(report.httpErrors.length===0, 'HTTP >= 400 encontrado');
            console.log('STAGE3_FILTER_RENDER_REPORT='+JSON.stringify(report));
            console.log('STAGE3_FILTER_RENDER_OK');
          } finally {
            await browser.close();
          }
          JS
