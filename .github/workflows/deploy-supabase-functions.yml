name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: hootwcacnrtidfmqsvrn

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Apply DropBox transactional sender
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" 'RESEND_FROM=DropBox <contato@bigofertas.net>'

      # Turnstile secrets are intentionally activated only after a successful
      # Hostinger production deploy, so backend enforcement can never precede
      # publication of the matching public site key. The smoke workflow runs
      # after this deployment completes and validates the live Edge Functions.
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
